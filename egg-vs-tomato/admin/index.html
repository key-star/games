<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>蛋蛋快跑 - 后台统计</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#0f172a; color:#e2e8f0; padding:24px; }
h1 { font-size:20px; color:#94a3b8; margin-bottom:32px; font-weight:500; }
.card { background:#1e293b; border-radius:12px; padding:24px; margin-bottom:16px; }
.row { display:flex; gap:16px; flex-wrap:wrap; }
.stat-box { flex:1; min-width:140px; text-align:center; padding:8px 0; }
.stat-label { font-size:13px; color:#64748b; margin-bottom:8px; }
.stat-value { font-size:32px; font-weight:600; color:#38bdf8; }
.stat-unit { font-size:14px; color:#64748b; }
.chart-wrap { position:relative; height:300px; }
.refresh-btn { background:#334155; border:none; color:#94a3b8; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:13px; float:right; }
.refresh-btn:hover { background:#475569; color:#e2e8f0; }
.loading { text-align:center; color:#64748b; padding:40px; font-size:14px; }
.error-msg { text-align:center; color:#f87171; padding:40px; }
.section-title { font-size:14px; color:#94a3b8; margin-bottom:16px; font-weight:500; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; padding:8px 12px; color:#64748b; border-bottom:1px solid #334155; font-weight:500; }
td { padding:8px 12px; border-bottom:1px solid #1e293b; }
tr:hover td { background:#334155; }
.badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; }
.badge-ok { background:#166534; color:#86efac; }
.badge-warn { background:#854d0e; color:#fde047; }
.badge-err { background:#7f1d1d; color:#fca5a5; }
.tabs { display:flex; gap:4px; margin-bottom:16px; }
.tab { padding:8px 16px; border-radius:6px; cursor:pointer; font-size:13px; color:#64748b; background:#1e293b; border:none; }
.tab:hover { background:#334155; color:#e2e8f0; }
.tab.active { background:#38bdf8; color:#0f172a; font-weight:600; }
.hidden { display:none; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:768px) { .grid-2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<h1>蛋蛋快跑 · 后台统计</h1>

<div class="tabs">
  <button class="tab active" data-tab="overview">概览</button>
  <button class="tab" data-tab="games">对局</button>
  <button class="tab" data-tab="players">玩家</button>
  <button class="tab" data-tab="errors">错误</button>
</div>

<div id="tab-overview">
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
    <div class="section-title" style="margin-bottom:0;">概览</div>
    <button class="refresh-btn" onclick="refresh()">刷新</button>
  </div>
  <div class="card row" id="overview-cards">
    <div class="stat-box"><div class="stat-label">当前在线</div><div class="stat-value" id="v-online">--</div><div class="stat-unit">人</div></div>
    <div class="stat-box"><div class="stat-label">24h 活跃 (DAU)</div><div class="stat-value" id="v-dau">--</div><div class="stat-unit">人</div></div>
    <div class="stat-box"><div class="stat-label">累计玩家</div><div class="stat-value" id="v-totalPlayers">--</div><div class="stat-unit">人</div></div>
    <div class="stat-box"><div class="stat-label">总对局数</div><div class="stat-value" id="v-totalGames">--</div><div class="stat-unit">局</div></div>
    <div class="stat-box"><div class="stat-label">平均时长</div><div class="stat-value" id="v-avgSurvival">--</div><div class="stat-unit">秒</div></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div class="section-title">过去 24 小时在线趋势</div>
    </div>
    <div class="chart-wrap"><canvas id="trend-chart"></canvas></div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="section-title">地区分布（近 7 天）</div>
      <div style="display:flex;gap:16px;height:250px;">
        <div style="flex:1;min-width:0;"><canvas id="region-chart"></canvas></div>
        <div id="region-legend" style="flex:0 0 auto;overflow-y:auto;font-size:11px;color:#94a3b8;line-height:2;user-select:text;padding-right:4px;"></div>
      </div>
    </div>
    <div class="card">
      <div class="section-title">最近对局</div>
      <div id="recent-games"><div class="loading">加载中...</div></div>
    </div>
  </div>
</div>

<div id="tab-games" class="hidden">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div class="section-title">对局记录</div>
      <button class="refresh-btn" onclick="refreshGames()">刷新</button>
    </div>
    <div id="games-table"><div class="loading">加载中...</div></div>
  </div>
</div>

<div id="tab-errors" class="hidden">
  <div class="card row" id="error-cards">
    <div class="stat-box"><div class="stat-label">7 天错误数</div><div class="stat-value" id="e-total">--</div></div>
    <div class="stat-box"><div class="stat-label">崩溃率</div><div class="stat-value" id="e-rate">--</div><div class="stat-unit">%</div></div>
    <div class="stat-box"><div class="stat-label">7 天总对局</div><div class="stat-value" id="e-games">--</div><div class="stat-unit">局</div></div>
  </div>
  <div class="grid-2">
    <div class="card">
      <div class="section-title">TOP 错误</div>
      <div id="top-errors"><div class="loading">加载中...</div></div>
    </div>
    <div class="card">
      <div class="section-title">7 天错误趋势</div>
      <div class="chart-wrap" style="height:200px;"><canvas id="error-chart"></canvas></div>
    </div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div class="section-title" style="margin-bottom:0;">错误记录</div>
      <button class="refresh-btn" onclick="clearErrors()" style="background:#7f1d1d;color:#fca5a5;">清空全部</button>
    </div>
    <div id="error-list"><div class="loading">加载中...</div></div>
  </div>
</div>

<div id="tab-players" class="hidden">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div class="section-title">玩家列表</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="text" id="player-search" placeholder="搜索玩家 ID / 地区 / 平台..." oninput="filterPlayers()" style="background:#0f172a;border:1px solid #334155;border-radius:6px;padding:6px 12px;color:#e2e8f0;font-size:13px;width:280px;outline:none;">
        <button class="refresh-btn" onclick="refreshPlayers()">刷新</button>
      </div>
    </div>
    <div style="overflow-x:auto;">
      <div id="players-table"><div class="loading">加载中...</div></div>
    </div>
    <div style="margin-top:12px;font-size:12px;color:#64748b;text-align:right;" id="players-count"></div>
  </div>
</div>

<script>
let chart = null, regionChart = null, errorChart = null;

function formatTime(iso) {
  if (!iso) return '--';
  const d = new Date(iso + 'Z');
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function formatDate(iso) {
  if (!iso) return '--';
  const d = new Date(iso + 'Z');
  return d.getMonth()+1 + '/' + d.getDate() + ' ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function fmtMode(m) {
  return m === 'challenge' ? '生存挑战' : '无尽生存';
}

function buildRegionLegend(labels, data, colors) {
  const el = document.getElementById('region-legend');
  if (!el) return;
  el.innerHTML = labels.map((l, i) =>
    `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${colors[i % colors.length]};vertical-align:middle;margin-right:6px;"></span>` +
    `<span style="vertical-align:middle;">${l}</span>` +
    (i < labels.length - 1 ? '<br>' : '')
  ).join('');
}



async function refresh() {
  try {
    const [overviewRes, statsRes, recentRes] = await Promise.all([
      fetch('/api/overview'),
      fetch('/api/online/stats'),
      fetch('/api/game/recent')
    ]);
    const overview = await overviewRes.json();
    const stats = await statsRes.json();
    let recent = [];
    try { recent = await recentRes.json(); } catch(e) {}

    const setText = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
    setText('v-online', overview.online);
    setText('v-dau', overview.dau);
    setText('v-totalPlayers', overview.totalPlayers);
    setText('v-totalGames', overview.totalGames);
    setText('v-avgSurvival', overview.avgSurvival);

    if (stats.length > 0) {
      const values = stats.map(s => s.count);
      const times = stats.map(s => formatTime(s.recorded_at));
      if (chart) {
        chart.data.labels = times;
        chart.data.datasets[0].data = values;
        chart.update();
      } else {
        const ctx = document.getElementById('trend-chart').getContext('2d');
        chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: times,
            datasets: [{
              label: '在线人数',
              data: values,
              borderColor: '#38bdf8',
              backgroundColor: 'rgba(56,189,248,0.1)',
              fill: true, tension: 0.3, pointRadius: 2, pointHoverRadius: 5, borderWidth: 2
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: '#64748b', font: { size: 11 }, maxTicksLimit: 12 }, grid: { color: 'rgba(100,116,139,0.1)' } },
              y: { beginAtZero: true, ticks: { color: '#64748b', font: { size: 11 }, stepSize: 1 }, grid: { color: 'rgba(100,116,139,0.1)' } }
            },
            interaction: { intersect: false, mode: 'index' }
          }
        });
      }
    }

    if (overview.regions && overview.regions.length > 0) {
      const labels = overview.regions.map(r => [r.city, r.region, r.country].filter(Boolean).join(', ') || '未知');
      const data = overview.regions.map(r => r.count);
      const colors = ['#38bdf8','#f472b6','#34d399','#fbbf24','#f87171','#a78bfa','#fb923c','#67e8f9','#c084fc','#2dd4bf','#fde047','#fca5a5','#818cf8','#6ee7b7','#fdba74','#5eead4','#e879f9','#94a3b8'];
      if (regionChart) {
        regionChart.data.labels = labels;
        regionChart.data.datasets[0].data = data;
        regionChart.update();
        buildRegionLegend(labels, data, colors);
      } else {
        const ctx = document.getElementById('region-chart').getContext('2d');
        regionChart = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels,
            datasets: [{ data, backgroundColor: colors.slice(0, labels.length), borderWidth: 0 }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            cutout: '50%',
            plugins: {
              legend: { display: false },
              tooltip: { enabled: false },
            }
          }
        });
        buildRegionLegend(labels, data, colors);
      }
    }

    if (recent.length > 0) {
      document.getElementById('recent-games').innerHTML = '<table><tr><th>玩家</th><th>地区</th><th>平台</th><th>结果</th><th>时长</th><th>目标</th><th>受伤量</th><th>余HP</th><th>模式</th><th>时间</th></tr>' +
        recent.map(g => `<tr>
          <td style="font-family:monospace;font-size:11px;color:#94a3b8;">${(g.player_id || '').slice(0,8)}</td>
          <td style="color:#94a3b8;font-size:11px;">${[g.city, g.region, g.country].filter(Boolean).join(', ') || '-'}</td>
          <td style="color:#64748b;font-size:11px;">${g.platform || '-'}</td>
          <td><span class="badge ${g.result === 'victory' ? 'badge-ok' : 'badge-err'}">${g.result === 'victory' ? '胜利' : '失败'}</span></td>
          <td>${Math.round(g.survival_seconds || 0)}s</td>
          <td style="text-align:center;">${g.challenge_goal > 0 ? g.challenge_goal + 's' : '-'}</td>
          <td>${g.damage_amount || 0}</td>
          <td>${g.remaining_hp != null ? g.remaining_hp : '-'}</td>
          <td>${fmtMode(g.game_mode)}</td>
          <td style="color:#64748b;font-size:11px;">${formatDate(g.ended_at)}</td>
        </tr>`).join('') + '</table>';
    } else {
      document.getElementById('recent-games').innerHTML = '<div style="text-align:center;color:#64748b;padding:20px;">暂无对局数据</div>';
    }
  } catch(e) {
    // 静默失败，保留上次数据
  }
}

async function refreshGames() {
  try {
    const res = await fetch('/api/game/recent?limit=100');
    const data = await res.json();
    if (data.length > 0) {
      function fmtLoc(g) { return [g.city, g.region, g.country].filter(Boolean).join(', ') || '-'; }
      document.getElementById('games-table').innerHTML = '<table style="table-layout:fixed;"><tr><th>玩家</th><th>地区</th><th>平台</th><th>新</th><th>结果</th><th>时长</th><th>目标</th><th>击杀</th><th>受伤量</th><th>余HP</th><th>金币</th><th>难度</th><th>帧率</th><th>法宝</th><th>模式</th><th>时间</th></tr>' +
        data.map(g => `<tr>
          <td style="font-family:monospace;font-size:11px;color:#94a3b8;">${(g.player_id || '').slice(0,8)}</td>
          <td style="color:#94a3b8;font-size:11px;">${fmtLoc(g)}</td>
          <td style="color:#64748b;font-size:11px;">${g.platform || '-'}</td>
          <td style="color:${g.is_new_player ? '#fbbf24' : '#64748b'};font-size:11px;">${g.is_new_player ? '新' : '-'}</td>
          <td><span class="badge ${g.result === 'victory' ? 'badge-ok' : 'badge-err'}">${g.result === 'victory' ? '胜利' : '失败'}</span></td>
          <td>${Math.round(g.survival_seconds || 0)}</td>
          <td>${g.challenge_goal > 0 ? g.challenge_goal + 's' : '-'}</td>
          <td>${g.kills || 0}</td>
          <td>${g.damage_amount || 0}</td>
          <td>${g.remaining_hp != null ? g.remaining_hp : '-'}</td>
          <td>${g.gold_earned || 0}</td>
          <td>${g.difficulty || 0}</td>
          <td style="color:${(g.avg_fps || 0) < 30 ? '#f87171' : '#94a3b8'};font-size:11px;">${g.avg_fps || '-'}</td>
           <td style="font-size:11px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#94a3b8;" title="${(function(){ try{const a=JSON.parse(g.artifacts);return Object.entries(a).filter(e=>e[1]).map(e=>e[0]+'x'+e[1]).join(' ') }catch(e){return g.artifacts||'-'} })()}">${(function(){ try{const a=JSON.parse(g.artifacts);return Object.entries(a).filter(e=>e[1]).map(e=>e[0]+'x'+e[1]).join(' ') }catch(e){return g.artifacts||'-'} })()}</td>
          <td>${fmtMode(g.game_mode)}</td>
          <td style="color:#64748b;font-size:11px;">${formatDate(g.ended_at)}</td>
        </tr>`).join('') + '</table>';
    } else {
      document.getElementById('games-table').innerHTML = '<div style="text-align:center;color:#64748b;padding:20px;">暂无对局数据</div>';
    }
  } catch(e) {
    document.getElementById('games-table').innerHTML = '<div class="error-msg">加载失败: ' + e.message + '</div>';
  }
}

async function refreshErrors() {
  try {
    const res = await fetch('/api/error/stats');
    const data = await res.json();
    document.getElementById('e-total').textContent = data.total;
    document.getElementById('e-rate').textContent = data.crashRate;
    document.getElementById('e-games').textContent = data.totalGames;

    if (data.topErrors && data.topErrors.length > 0) {
      document.getElementById('top-errors').innerHTML = '<table><tr><th>错误消息</th><th>次数</th></tr>' +
        data.topErrors.map(e => `<tr><td style="color:#fca5a5;font-family:monospace;font-size:11px;max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${e.message}</td><td><span class="badge badge-err">${e.count}</span></td></tr>`).join('') + '</table>';
    } else {
      document.getElementById('top-errors').innerHTML = '<div style="text-align:center;color:#64748b;padding:20px;">暂无错误记录</div>';
    }

    if (data.daily && data.daily.length > 0) {
      const labels = data.daily.map(d => d.date);
      const values = data.daily.map(d => d.count);
      if (errorChart) {
        errorChart.data.labels = labels;
        errorChart.data.datasets[0].data = values;
        errorChart.update();
      } else {
        const ctx = document.getElementById('error-chart').getContext('2d');
        errorChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [{
              label: '错误数',
              data: values,
              backgroundColor: '#f87171',
              borderRadius: 4
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: '#64748b', font: { size: 11 } }, grid: { color: 'rgba(100,116,139,0.1)' } },
              y: { beginAtZero: true, ticks: { color: '#64748b', font: { size: 11 }, stepSize: 1 }, grid: { color: 'rgba(100,116,139,0.1)' } }
            }
          }
        });
      }
    }

    if (data.list && data.list.length > 0) {
      document.getElementById('error-list').innerHTML = '<table style="table-layout:fixed;"><tr><th style="width:40px;">ID</th><th>消息</th><th style="width:80px;">存活(s)</th><th style="width:80px;">时间</th><th style="width:50px;"></th></tr>' +
        data.list.map(e => `<tr>
          <td style="color:#64748b;font-size:11px;font-family:monospace;">${e.id}</td>
          <td style="color:#fca5a5;font-family:monospace;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${e.message} ${e.player_id ? '[' + e.player_id.slice(0,6) + ']' : ''}</td>
          <td style="color:#94a3b8;font-size:11px;">${e.survival_time || 0}</td>
          <td style="color:#64748b;font-size:11px;">${formatDate(e.created_at)}</td>
          <td><button class="refresh-btn" onclick="deleteError(${e.id})" style="padding:2px 8px;font-size:11px;">删除</button></td>
        </tr>`).join('') + '</table>';
    } else {
      document.getElementById('error-list').innerHTML = '<div style="text-align:center;color:#64748b;padding:20px;">暂无错误记录</div>';
    }
  } catch(e) {
    document.querySelector('#error-cards').innerHTML = '<div class="error-msg">加载失败: ' + e.message + '</div>';
  }
}

async function clearErrors() {
  if (!confirm('确定清空所有错误记录？')) return;
  await fetch('/api/error/log', { method: 'DELETE' });
  refreshErrors();
}

async function deleteError(id) {
  if (!confirm('确定删除此错误记录？')) return;
  await fetch('/api/error/log?id=' + id, { method: 'DELETE' });
  refreshErrors();
}

function formatPlayTime(seconds) {
  if (!seconds || seconds <= 0) return '-';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return m + 'm ' + s + 's';
  return s + 's';
}

function pct(a, b) {
  if (!b || b <= 0) return '-';
  return (a / b * 100).toFixed(1) + '%';
}

let _allPlayers = [];

async function refreshPlayers() {
  const el = document.getElementById('players-table');
  if (!el) return;
  el.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const res = await fetch('/api/players?limit=500');
    const data = await res.json();
    _allPlayers = data || [];
    filterPlayers();
  } catch(e) {
    el.innerHTML = '<div class="error-msg">加载失败: ' + e.message + '</div>';
  }
}

function filterPlayers() {
  const q = (document.getElementById('player-search')?.value || '').toLowerCase().trim();
  const filtered = q ? _allPlayers.filter(p =>
    (p.player_id || '').toLowerCase().includes(q) ||
    (p.country || '').toLowerCase().includes(q) ||
    (p.region || '').toLowerCase().includes(q) ||
    (p.city || '').toLowerCase().includes(q) ||
    (p.platform || '').toLowerCase().includes(q)
  ) : _allPlayers;

  const el = document.getElementById('players-table');
  if (!el) return;

  if (filtered.length === 0) {
    el.innerHTML = '<div style="text-align:center;color:#64748b;padding:40px;font-size:14px;">暂无玩家数据' + (q ? '，匹配不到结果' : '') + '</div>';
    document.getElementById('players-count').textContent = '';
    return;
  }

  function fmtLoc(p) {
    return [p.city, p.region, p.country].filter(Boolean).join(', ') || '-';
  }

  function fmtDate(iso) {
    if (!iso) return '-';
    const d = new Date(iso + 'Z');
    return d.getFullYear() + '/' + (d.getMonth()+1).toString().padStart(2,'0') + '/' + d.getDate().toString().padStart(2,'0') + ' ' +
      d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }

  el.innerHTML = '<table style="table-layout:auto;">' +
    '<tr>' +
      '<th>玩家</th>' +
      '<th>地区</th>' +
      '<th>平台</th>' +
      '<th>总局数</th>' +
      '<th>胜</th>' +
      '<th>负</th>' +
      '<th>胜率</th>' +
      '<th>总在线</th>' +
      '<th>平均存活</th>' +
      '<th>最佳存活</th>' +
      '<th>平均帧率</th>' +
      '<th>首次上线</th>' +
      '<th>最后上线</th>' +
    '</tr>' +
    filtered.map(p => '<tr>' +
      '<td style="font-family:monospace;font-size:11px;color:#94a3b8;max-width:120px;overflow:hidden;text-overflow:ellipsis;" title="' + (p.player_id || '') + '">' + (p.player_id || '').slice(0, 8) + '</td>' +
      '<td style="font-size:12px;color:#94a3b8;white-space:nowrap;">' + fmtLoc(p) + '</td>' +
      '<td style="font-size:12px;color:#64748b;white-space:nowrap;">' + (p.platform || '-') + '</td>' +
      '<td>' + (p.games_played || 0) + '</td>' +
      '<td style="color:#86efac;">' + (p.wins || 0) + '</td>' +
      '<td style="color:#fca5a5;">' + (p.losses || 0) + '</td>' +
      '<td style="color:#fde047;">' + pct(p.wins, p.games_played) + '</td>' +
      '<td style="white-space:nowrap;">' + formatPlayTime(p.total_play_time) + '</td>' +
      '<td style="white-space:nowrap;">' + (p.avg_survival != null ? Math.round(p.avg_survival) + 's' : '-') + '</td>' +
      '<td style="white-space:nowrap;">' + (p.best_survival != null ? Math.round(p.best_survival) + 's' : '-') + '</td>' +
      '<td>' + (p.avg_fps != null ? p.avg_fps : '-') + '</td>' +
      '<td style="font-size:11px;color:#64748b;white-space:nowrap;">' + fmtDate(p.first_seen) + '</td>' +
      '<td style="font-size:11px;color:#64748b;white-space:nowrap;">' + fmtDate(p.last_seen) + '</td>' +
    '</tr>').join('') + '</table>';

  document.getElementById('players-count').textContent = filtered.length + ' / ' + _allPlayers.length + ' 位玩家';
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('[id^="tab-"]').forEach(t => t.classList.add('hidden'));
    document.getElementById('tab-' + tab.dataset.tab).classList.remove('hidden');
    if (tab.dataset.tab === 'games') refreshGames();
    if (tab.dataset.tab === 'errors') refreshErrors();
    if (tab.dataset.tab === 'players') refreshPlayers();
  });
});

refresh();
</script>
</body>
</html>

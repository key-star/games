<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>蛋蛋快跑 - 番茄大追杀</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-touch-callout: none; }
body { background: #e8e8e8; display: flex; justify-content: center; align-items: center; height: 100dvh; font-family: Arial, sans-serif; overflow: auto; touch-action: none; }
canvas { display: block; border-radius: 12px; box-shadow: 0 0 40px rgba(0,0,0,.5); touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
let CW, CH, SIZE, UI_SIZE, CX, CY;
let UNIT, BOUNDARY_MODE, PLATE_MARGIN, EGG_R;
const DEBUG = true;
let BASE_W, BASE_H;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
    const r = typeof radii === 'number' ? radii : (Array.isArray(radii) ? radii[0] : 0);
    const maxR = Math.min(w / 2, h / 2, r);
    this.moveTo(x + maxR, y);
    this.lineTo(x + w - maxR, y);
    this.arcTo(x + w, y, x + w, y + maxR, maxR);
    this.lineTo(x + w, y + h - maxR);
    this.arcTo(x + w, y + h, x + w - maxR, y + h, maxR);
    this.lineTo(x + maxR, y + h);
    this.arcTo(x, y + h, x, y + h - maxR, maxR);
    this.lineTo(x, y + maxR);
    this.arcTo(x, y, x + maxR, y, maxR);
    this.closePath();
    return this;
  };
}
function resizeCanvas() {
  const availW = window.innerWidth - 32;
  const availH = window.innerHeight - 32;
  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  if (isTouch) {
    CW = availW;
    CH = availH;
  } else {
    if (!BASE_W) { BASE_W = availW; BASE_H = availH; }
    CW = BASE_W;
    CH = BASE_H;
  }
  SIZE = Math.min(CW, CH);
  UI_SIZE = Math.min(SIZE, 480);
  CX = CW / 2;
  CY = CH / 2;
  PLATE_MARGIN = Math.max(SIZE * .03, 8);
  EGG_R = SIZE * .045;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = CW * dpr;
  canvas.height = CH * dpr;
  if (isTouch) {
    canvas.style.width = CW + 'px';
    canvas.style.height = CH + 'px';
  } else {
    const scale = Math.min(1, availW / CW, availH / CH);
    canvas.style.width = Math.floor(CW * scale) + 'px';
    canvas.style.height = Math.floor(CH * scale) + 'px';
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  window.__CW = CW;
  window.__CH = CH;
  window.__CX = CX;
  window.__CY = CY;
  window.__SIZE = SIZE;
}
resizeCanvas();

function wrapText(ctx, text, maxWidth) {
  const lines = [];
  let line = '';
  for (const ch of text) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line.length > 0) {
      lines.push(line);
      line = ch;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

const TUTORIAL_CARDS = [
  { icon: '👆', title: '拖拽移动', desc: '按住蛋蛋到处溜达~ 滑到哪滚到哪，番茄追不上你！' },
  { icon: '💥', title: '松手攻击', desc: '松手瞬间嘭💥！蛋液炸开，周围的番茄全被弹飞！' },
  { icon: '🍅', title: '躲避番茄', desc: '被番茄撞到会掉❤️，\n三颗心用完就 Game Over 啦… 快溜！' },
  { icon: '⚡', title: '双击冲刺', desc: '快速点击远处↗️嗖一下闪出去！\n躲开番茄围攻的神技！' },
  { icon: '🚀', title: '蓄力跳跃', desc: '快速点击蛋蛋两下进入蓄力→\n憋大招→松手飞高高，坐扁番茄超解压！' },
  { icon: '🎁', title: '金币和道具', desc: '打番茄赚金币💰，开局前去商店买❤️回血🛡️护盾！\n地上闪光物捡起来就有效果，⚡🌀🔥吃到赚到！' },
];
let game = null;
let touchId = null;
let touchX = 0, touchY = 0;
let tapTime = 0;

class Vec2 {
  constructor(x=0, y=0) { this.x = x; this.y = y; }
  add(v) { return new Vec2(this.x + v.x, this.y + v.y); }
  sub(v) { return new Vec2(this.x - v.x, this.y - v.y); }
  scale(s) { return new Vec2(this.x * s, this.y * s); }
  len() { return Math.hypot(this.x, this.y); }
  norm() { const l = this.len(); return l > 0 ? this.scale(1 / l) : new Vec2(); }
  distTo(v) { return this.sub(v).len(); }
}

const PARTICLE_POOL = [];
let PARTICLE_POOL_MAX = 0;

class Particle {
  constructor(x, y, vx, vy, r, color, life) {
    this.reset(x, y, vx, vy, r, color, life);
  }
  reset(x, y, vx, vy, r, color, life) {
    if (!this.pos) this.pos = new Vec2();
    this.pos.x = x; this.pos.y = y;
    if (!this.vel) this.vel = new Vec2();
    this.vel.x = vx; this.vel.y = vy;
    this.r = r;
    this.color = color;
    this.life = life;
    this.maxLife = life;
    this.glow = 0;
    return this;
  }
  update() {
    this.pos = this.pos.add(this.vel);
    this.vel = this.vel.scale(.97);
    this.life--;
  }
  draw() {
    const a = this.life / this.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = this.color;
    if (this.glow) {
      ctx.shadowColor = this.color;
      ctx.shadowBlur = this.glow;
    }
    ctx.beginPath();
    ctx.arc(this.pos.x, this.pos.y, this.r * a, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  release() {
    this.life = 0;
    if (PARTICLE_POOL.length < 200) PARTICLE_POOL.push(this);
  }
}

function acquireParticle(x, y, vx, vy, r, color, life) {
  const p = PARTICLE_POOL.length > 0 ? PARTICLE_POOL.pop() : new Particle();
  p.reset(x, y, vx, vy, r, color, life);
  return p;
}

class Egg {
  constructor() {
    this.pos = new Vec2(CX, CY);
    this.vel = new Vec2(0, 0);
    this.r = EGG_R;
    this.skin = '普通蛋';
    this.slipping = 0;
    this.combo = 0;
    this.comboTimer = 0;
    this.hp = 3;
    this.maxHp = 3;
    this.invincible = 0;
    this.target = null;
    this.splashRangeBuff = 0;
    this.splashPowerBuff = 0;
    this.speedMult = 1;
  }

  getSkinColor() {
    const s = { 普通蛋: ['#ebd6b0','#c9a87c'], 溏心蛋: ['#fff5cc','#ffb300'], 煎荷包蛋: ['#fff','#ff8f00'], 茶叶蛋: ['#c4956a','#6d4c00'] };
    return s[this.skin] || s.普通蛋;
  }

  draw(charge = 0) {
    const [base, shadow] = this.getSkinColor();
    ctx.save();
    if (charge > 0) {
      const t = charge * charge * 0.8 + charge * 0.2;
      const sy = 1 - t * 0.22;
      const sx = 1 + t * 0.1;
      const bottomY = this.pos.y + this.r * 1.05;
      ctx.translate(this.pos.x, bottomY);
      ctx.scale(sx, sy);
      ctx.translate(-this.pos.x, -bottomY);
    }
    ctx.shadowColor = 'rgba(0,0,0,.15)';
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.ellipse(this.pos.x, this.pos.y, this.r * 1.05, this.r * 1.1, 0, 0, Math.PI * 2);
    ctx.fillStyle = shadow;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.ellipse(this.pos.x, this.pos.y - this.r * .05, this.r, this.r * 1.05, 0, 0, Math.PI * 2);
    ctx.fillStyle = base;
    ctx.fill();
    // 3D shading
    const grad = ctx.createRadialGradient(
      this.pos.x - this.r * .25, this.pos.y - this.r * .3, 0,
      this.pos.x, this.pos.y, this.r * 1.0);
    grad.addColorStop(0, 'rgba(255,255,255,.2)');
    grad.addColorStop(.4, 'rgba(255,255,255,0)');
    grad.addColorStop(.7, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,.1)');
    ctx.fillStyle = grad;
    ctx.fill();
    // Glossy highlight
    ctx.beginPath();
    ctx.ellipse(this.pos.x - this.r * .25, this.pos.y - this.r * .4, this.r * .2, this.r * .09, -0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.fill();
    if (this.skin === '煎荷包蛋') {
      ctx.beginPath();
      ctx.arc(this.pos.x, this.pos.y + this.r * .05, this.r * .55, 0, Math.PI * 2);
      ctx.fillStyle = '#ffb300';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(this.pos.x, this.pos.y + this.r * .05, this.r * .45, 0, Math.PI * 2);
      ctx.fillStyle = '#ff8f00';
      ctx.fill();
    } else if (this.skin === '溏心蛋') {
      // Yolk drips
      ctx.fillStyle = '#ffb300';
      ctx.beginPath();
      ctx.arc(this.pos.x, this.pos.y + this.r * .02, this.r * .4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff8f00';
      ctx.beginPath();
      ctx.arc(this.pos.x, this.pos.y + this.r * .02, this.r * .3, 0, Math.PI * 2);
      ctx.fill();
    }
    // Eyes (white + pupil)
    const eyeY = this.pos.y - this.r * .12;
    const eyeSep = this.r * .28;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(this.pos.x - eyeSep, eyeY, this.r * .15, this.r * .18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(this.pos.x + eyeSep, eyeY, this.r * .15, this.r * .18, 0, 0, Math.PI * 2);
    ctx.fill();
    // Pupils
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(this.pos.x - eyeSep, eyeY, this.r * .09, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(this.pos.x + eyeSep, eyeY, this.r * .09, 0, Math.PI * 2);
    ctx.fill();
    // Eye shine
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.pos.x - eyeSep - this.r * .03, eyeY - this.r * .04, this.r * .035, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(this.pos.x + eyeSep - this.r * .03, eyeY - this.r * .04, this.r * .035, 0, Math.PI * 2);
    ctx.fill();
    // Blush
    ctx.fillStyle = 'rgba(255,140,140,.25)';
    ctx.beginPath();
    ctx.ellipse(this.pos.x - this.r * .36, this.pos.y + this.r * .08, this.r * .14, this.r * .09, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(this.pos.x + this.r * .36, this.pos.y + this.r * .08, this.r * .14, this.r * .09, 0, 0, Math.PI * 2);
    ctx.fill();
    // Cute mouth
    ctx.fillStyle = '#e07040';
    ctx.beginPath();
    ctx.moveTo(this.pos.x - this.r * .08, this.pos.y + this.r * .14);
    ctx.quadraticCurveTo(this.pos.x, this.pos.y + this.r * .22, this.pos.x + this.r * .08, this.pos.y + this.r * .14);
    ctx.lineTo(this.pos.x - this.r * .08, this.pos.y + this.r * .14);
    ctx.fill();
    if (this.slipping > 0) {
      ctx.strokeStyle = '#ff0';
      ctx.lineWidth = 2;
      ctx.globalAlpha = .5 + Math.sin(Date.now() / 50) * .3;
      for (let i = 0; i < 3; i++) {
        const a = Math.PI * 2 / 3 * i + Date.now() / 300;
        ctx.beginPath();
        ctx.arc(this.pos.x, this.pos.y, this.r * 1.3 + i * 4, a - .3, a + .3);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    if (this.combo >= 3) {
      const intensity = Math.min(1, this.combo / 15);
      ctx.strokeStyle = `rgba(255, ${255 - Math.floor(intensity * 100)}, 0, ${.3 + intensity * .3})`;
      ctx.lineWidth = 2 + intensity * 3;
      ctx.beginPath();
      ctx.arc(this.pos.x, this.pos.y, this.r * (1.2 + Math.sin(Date.now() / 150) * .1 * intensity), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  update(dt) {
    if (this.vel.len() > 0) {
      this.pos = this.pos.add(this.vel.scale(dt));
      this.vel = this.vel.scale(Math.pow(.85, dt));
      if (this.vel.len() < .3) this.vel = new Vec2();
    }
    if (this.target) {
      const diff = this.target.sub(this.pos);
      if (diff.len() > 1) {
        this.pos = this.pos.add(diff.scale(.85 * this.speedMult * dt));
      }
    }
    if (BOUNDARY_MODE === 'circle') {
      const toCenter = this.pos.sub(new Vec2(CX, CY));
      if (toCenter.len() > UNIT - this.r) {
        this.pos = new Vec2(CX, CY).add(toCenter.norm().scale(UNIT - this.r));
        this.vel = new Vec2();
      }
    } else {
      const cx = Math.max(PLATE_MARGIN + this.r, Math.min(CW - PLATE_MARGIN - this.r, this.pos.x));
      const cy = Math.max(PLATE_MARGIN + this.r, Math.min(CH - PLATE_MARGIN - this.r, this.pos.y));
      if (cx !== this.pos.x || cy !== this.pos.y) {
        this.pos = new Vec2(cx, cy);
        this.vel = new Vec2();
      }
    }
    if (this.slipping > 0) this.slipping--;
    if (this.invincible > 0) this.invincible--;
    if (this.comboTimer > 0) this.comboTimer--;
    else this.combo = 0;
    if (this.splashRangeBuff > 0) this.splashRangeBuff--;
    if (this.splashPowerBuff > 0) this.splashPowerBuff--;
  }

  moveTo(tx, ty) {
    this.vel = new Vec2();
    let target = new Vec2(tx, ty);
    if (BOUNDARY_MODE === 'circle') {
      const toCenter = target.sub(new Vec2(CX, CY));
      if (toCenter.len() > UNIT - this.r) {
        target = new Vec2(CX, CY).add(toCenter.norm().scale(UNIT - this.r));
      }
    } else {
      target.x = Math.max(PLATE_MARGIN + this.r, Math.min(CW - PLATE_MARGIN - this.r, target.x));
      target.y = Math.max(PLATE_MARGIN + this.r, Math.min(CH - PLATE_MARGIN - this.r, target.y));
    }
    this.target = target;
  }

  knockback(dir, force) {
    this.vel = dir.scale(force);
  }
}

class Tomato {
  constructor(type) {
    this.type = type;
    if (type === 'seed') {
      this.r = EGG_R * .5;
      this.hp = 1;
      this.maxHp = 1;
      this.speed = .8 + Math.random() * .6;
      const angle = Math.random() * Math.PI * 2;
      const dist = EGG_R * 2 + Math.random() * 20;
      this.pos = new Vec2(CX + Math.cos(angle) * dist, CY + Math.sin(angle) * dist);
    } else {
      this.r = type === 'big' ? EGG_R * 1.6 : type === 'boss' ? EGG_R * 2.0 : type === 'shield' || type === 'explosive' ? EGG_R * 1.3 : type === 'splitter' ? EGG_R * 1.1 : EGG_R * .9;
      this.hp = type === 'boss' ? 8 : type === 'big' ? 3 : type === 'shield' ? 2 : 1;
      this.maxHp = this.hp;
      this.speed = type === 'boss' ? .8 : type === 'big' ? .7 : type === 'seed' ? 1.5 : .6 + Math.random() * .4;
      const angle = Math.random() * Math.PI * 2;
      if (BOUNDARY_MODE === 'rect') {
        const m = PLATE_MARGIN;
        const w = CW - m * 2, h = CH - m * 2;
        const side = Math.floor(Math.random() * 4);
        if (side === 0) this.pos = new Vec2(m + Math.random() * w, m - this.r - 10 - Math.random() * 40);
        else if (side === 1) this.pos = new Vec2(m + w + this.r + 10 + Math.random() * 40, m + Math.random() * h);
        else if (side === 2) this.pos = new Vec2(m + Math.random() * w, m + h + this.r + 10 + Math.random() * 40);
        else this.pos = new Vec2(m - this.r - 10 - Math.random() * 40, m + Math.random() * h);
      } else {
        const dist = UNIT + this.r + 10 + Math.random() * 30;
        this.pos = new Vec2(CX + Math.cos(angle) * dist, CY + Math.sin(angle) * dist);
      }
    }
    this.target = new Vec2(CX, CY);
    this.vel = new Vec2(0, 0);
    this.shootTimer = type === 'boss' ? 60 : 0;
    this.flash = 0;
    this.chargeTimer = 0;
    this.shielded = type === 'shield';
    this.knockbackTimer = 0;
    this.stunTimer = 0;
    this.gravityTx = 0;
    this.gravityTy = 0;
    this.gravityPull = 0;
    this.burnTimer = 0;
    const lifetimeMap = { normal: 400, big: 500, shield: 450, splitter: 350, explosive: 300, seed: 200, boss: 600 };
    this.life = (lifetimeMap[type] || 400) + Math.random() * 100;
  }

  draw() {
    const isShield = this.type === 'shield';
    const isSplitter = this.type === 'splitter';
    const isExplosive = this.type === 'explosive';
    const isSeed = this.type === 'seed';
    const c = this.type === 'boss' ? '#e63946' : this.type === 'big' ? '#f44336' : isShield ? '#4fc3f7' : isSplitter ? '#ab47bc' : isExplosive ? '#ff7043' : isSeed ? '#ffab91' : '#ff6b6b';
    const c2 = this.type === 'boss' ? '#c1121f' : this.type === 'big' ? '#d32f2f' : isShield ? '#0288d1' : isSplitter ? '#7b1fa2' : isExplosive ? '#d84315' : isSeed ? '#ff6e40' : '#ee5a24';
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.15)';
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.arc(this.pos.x, this.pos.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = c;
    ctx.fill();
    ctx.shadowBlur = 0;
    // 3D shading
    const grad2 = ctx.createRadialGradient(
      this.pos.x - this.r * .25, this.pos.y - this.r * .3, 0,
      this.pos.x, this.pos.y, this.r * 1.0);
    grad2.addColorStop(0, 'rgba(255,255,255,.2)');
    grad2.addColorStop(.4, 'rgba(255,255,255,0)');
    grad2.addColorStop(.7, 'rgba(0,0,0,0)');
    grad2.addColorStop(1, 'rgba(0,0,0,.1)');
    ctx.fillStyle = grad2;
    ctx.fill();
    // Glossy highlight
    ctx.beginPath();
    ctx.ellipse(this.pos.x - this.r * .25, this.pos.y - this.r * .38, this.r * .22, this.r * .1, -0.4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    ctx.fill();
    if (!isSeed) {
      // Stem
      ctx.fillStyle = '#388e3c';
      ctx.beginPath();
      ctx.ellipse(this.pos.x, this.pos.y - this.r * .85, this.r * .12, this.r * .18, 0, 0, Math.PI * 2);
      ctx.fill();
      // Leaf
      ctx.fillStyle = '#43a047';
      ctx.beginPath();
      ctx.ellipse(this.pos.x - this.r * .15, this.pos.y - this.r * .82, this.r * .2, this.r * .08, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(this.pos.x + this.r * .15, this.pos.y - this.r * .82, this.r * .2, this.r * .08, 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    // Cute face
    const eyeY = this.pos.y - this.r * .1;
    const eyeSep = this.r * .28;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(this.pos.x - eyeSep, eyeY, this.r * .16, this.r * .19, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(this.pos.x + eyeSep, eyeY, this.r * .16, this.r * .19, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(this.pos.x - eyeSep, eyeY, this.r * .1, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(this.pos.x + eyeSep, eyeY, this.r * .1, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.pos.x - eyeSep - this.r * .03, eyeY - this.r * .04, this.r * .04, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(this.pos.x + eyeSep - this.r * .03, eyeY - this.r * .04, this.r * .04, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,120,120,.2)';
    ctx.beginPath();
    ctx.ellipse(this.pos.x - this.r * .38, this.pos.y + this.r * .1, this.r * .15, this.r * .1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(this.pos.x + this.r * .38, this.pos.y + this.r * .1, this.r * .15, this.r * .1, 0, 0, Math.PI * 2);
    ctx.fill();
    // Expression: normal smile or sad/crying in victory mode
    const isSad = typeof game !== 'undefined' && (game.state === 'victory' || game.state === 'victoryscreen');
    ctx.lineWidth = 1.5;
    if (isSad) {
      // smaller, downturned mouth (frown)
      ctx.strokeStyle = '#c62828';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.pos.x, this.pos.y + this.r * .32, this.r * .12, Math.PI - 0.25, Math.PI * 2 + 0.25);
      ctx.stroke();
      // smaller pupils for sad look
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(this.pos.x - eyeSep, eyeY, this.r * .08, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(this.pos.x + eyeSep, eyeY, this.r * .08, 0, Math.PI * 2);
      ctx.fill();
      // tears
      ctx.fillStyle = 'rgba(135,206,250,0.95)';
      ctx.beginPath();
      ctx.ellipse(this.pos.x - eyeSep, eyeY + this.r * .24, this.r * .06, this.r * .09, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(this.pos.x + eyeSep, eyeY + this.r * .24, this.r * .06, this.r * .09, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Mischievous smile (original)
      ctx.strokeStyle = this.type === 'shield' ? '#0277bd' : '#c62828';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(this.pos.x, this.pos.y + this.r * .18, this.r * .12, 0.1, Math.PI - 0.1);
      ctx.stroke();
    }
    if (this.hp < this.maxHp) {
      const bw = this.r * 1.2;
      ctx.fillStyle = '#333';
      ctx.fillRect(this.pos.x - bw / 2, this.pos.y - this.r - 8, bw, 4);
      ctx.fillStyle = '#4caf50';
      ctx.fillRect(this.pos.x - bw / 2, this.pos.y - this.r - 8, bw * this.hp / this.maxHp, 4);
    }
    if (this.shielded) {
      ctx.strokeStyle = 'rgba(79,195,247,.6)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(this.pos.x, this.pos.y, this.r + 4 + Math.sin(Date.now() / 100) * 2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(79,195,247,.3)';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(this.pos.x, this.pos.y, this.r + 8 + Math.sin(Date.now() / 120) * 3, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (isExplosive) {
      ctx.strokeStyle = '#ff7043';
      ctx.lineWidth = 2;
      ctx.globalAlpha = .3 + Math.sin(Date.now() / 80) * .2;
      ctx.beginPath();
      ctx.arc(this.pos.x, this.pos.y, this.r + 5 + Math.sin(Date.now() / 60) * 4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (this.burnTimer > 0) {
      const pulse = Math.sin(Date.now() / 60 + this.burnTimer) * 0.3 + 0.7;
      ctx.save();
      ctx.shadowColor = 'rgba(255,80,0,.5)';
      ctx.shadowBlur = 8;
      ctx.strokeStyle = `rgba(255,${120 + pulse * 80},0,${0.3 + pulse * 0.3})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(this.pos.x, this.pos.y, this.r + 4 + Math.sin(Date.now() / 80) * 3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
      // Fire particles around tomato
      for (let i = 0; i < 4; i++) {
        const a = Date.now() / 100 + i * 1.8 + this.burnTimer * 0.1;
        const dist = this.r * (0.8 + Math.sin(Date.now() / 70 + i * 2) * 0.4);
        const fs = ctx.fillStyle;
        ctx.fillStyle = `rgba(255,${Math.floor(100 + Math.random() * 100)},0,${0.3 + Math.random() * 0.4})`;
        ctx.beginPath();
        ctx.arc(this.pos.x + Math.cos(a) * dist, this.pos.y + Math.sin(a) * dist, 2 + Math.random() * 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = fs;
      }
    }
    if (this.type === 'big' && this.chargeTimer > 0) {
      ctx.strokeStyle = '#ff0';
      ctx.lineWidth = 2;
      ctx.globalAlpha = .5 + Math.sin(this.chargeTimer) * .3;
      ctx.beginPath();
      ctx.arc(this.pos.x, this.pos.y, this.r + 5 + Math.sin(this.chargeTimer * .2) * 3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (this.flash > 0) {
      ctx.fillStyle = '#fff';
      ctx.globalAlpha = .4;
      ctx.beginPath();
      ctx.arc(this.pos.x, this.pos.y, this.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (this.stunTimer > 0) {
      ctx.save();
      ctx.strokeStyle = 'rgba(79,195,247,.5)';
      ctx.lineWidth = 2;
      ctx.setLineDash([3, 4]);
      ctx.beginPath();
      ctx.arc(this.pos.x, this.pos.y, this.r + 3 + Math.sin(Date.now() / 80) * 2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      ctx.fillStyle = '#4fc3f7';
      ctx.font = `${this.r * .6}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText('💫', this.pos.x, this.pos.y - this.r - 6);
    }
    if (this.life !== undefined && this.life < 80 && this.life > 0) {
      ctx.fillStyle = 'rgba(150,100,50,.3)';
      ctx.globalAlpha = .2 + Math.sin(Date.now() / 60) * .15;
      ctx.beginPath();
      ctx.arc(this.pos.x, this.pos.y, this.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#966432';
      ctx.font = `${this.r * .8}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText('💨', this.pos.x, this.pos.y + this.r * .3);
    }
    ctx.restore();
  }

  update(dt, egg, particles) {
    if (this.flash > 0) this.flash--;
    if (this.hp <= 0) return false;
    this.life--;
    if (this.life <= 0) return false;
    if (this.stunTimer > 0) { this.stunTimer--; return true; }
    if (this.gravityPull > 0) {
      const dx = this.pos.x - this.gravityTx, dy = this.pos.y - this.gravityTy;
      const d = Math.hypot(dx, dy);
      if (d > 3) {
        const nx = dx / d, ny = dy / d;
        const tx = -ny, ty = nx;
        // Stronger tangential for visible spiral; moderate inward pull
        const tangSpeed = 8 + 280 / (d + 8);
        this.pos.x += tx * tangSpeed * dt * 0.25;
        this.pos.y += ty * tangSpeed * dt * 0.25;
        this.pos.x -= nx * (3 + 30 / (d + 5)) * dt;
        this.pos.y -= ny * (3 + 30 / (d + 5)) * dt;
      } else {
        this.pos.x = this.gravityTx;
        this.pos.y = this.gravityTy;
      }
      this.gravityPull -= dt;
      return true;
    }

    if (this.burnTimer > 0) {
      this.burnTimer--;
      // Flee from egg
      const fleeDir = this.pos.sub(egg.pos).norm();
      this.vel = fleeDir.scale(6);
      this.pos = this.pos.add(this.vel.scale(dt));
      if (this.burnTimer <= 0) {
        // Damage after 1s
        if (this.shielded) { this.shielded = false; this.flash = 20; }
        else { this.hp--; this.flash = 16; }
      }
      return true;
    }

    if (this.type === 'boss' && this.shootTimer > 0) this.shootTimer--;
    if (this.type === 'big') {
      const d = this.pos.distTo(egg.pos);
      if (d < UNIT * .4 && this.chargeTimer === 0) this.chargeTimer = 30;
      if (this.chargeTimer > 0) {
        this.chargeTimer--;
        if (this.chargeTimer === 19) {
          const dir = egg.pos.sub(this.pos).norm();
          this.vel = dir.scale(8);
        }
      }
    }
    const decayMult = this.life < 80 ? 0.4 : 1;
    if (this.chargeTimer >= 20) {
    } else if (this.chargeTimer > 0) {
      this.pos = this.pos.add(this.vel.scale(dt));
      this.vel = this.vel.scale(.95);
      if (this.vel.len() < .5) this.vel = new Vec2();
    } else if (this.knockbackTimer > 0) {
      this.knockbackTimer--;
      this.pos = this.pos.add(this.vel.scale(dt));
      this.vel = this.vel.scale(.9);
    } else {
      const dir = egg.pos.sub(this.pos).norm();
      this.pos = this.pos.add(dir.scale(this.speed * dt * 2 * decayMult));
    }

    if (this.type === 'boss' && this.shootTimer === 0) {
      this.shootTimer = 80;
      const dir = egg.pos.sub(this.pos).norm();
      particles.push(acquireParticle(this.pos.x, this.pos.y, dir.x * 5, dir.y * 5, 6, '#e63946', 40));
    }

    return true;
  }

  isOnPlate() {
    if (BOUNDARY_MODE === 'circle') return this.pos.sub(new Vec2(CX, CY)).len() < UNIT - this.r;
    const m = PLATE_MARGIN;
    return this.pos.x > m && this.pos.x < CW - m && this.pos.y > m && this.pos.y < CH - m;
  }
}

// ───── Sound Manager (Web Audio API + WAV files for BGM/jingles) ─────
const SFX = {
  _ctx: null,
  _gain: null,
  _bgmPlaying: false,
  _bgmBuffer: null,
  _bgmSource: null,
  _victoryBuffer: null,
  muted: false,
  // Debug: toggle BGM layers with Shift+1..4
  _bgmLayers: { pad: 1, bass: 1, mel: 1, kick: 1 },
  _log(name) {
    if (typeof game !== 'undefined' && game && game.debugInfo) {
      game.debugInfo.audioLog.push({ t: game.survivalTime, s: name });
    }
  },

  _init() {
    if (this._ctx) return;
    try {
      this._ctx = new (window.AudioContext || window.webkitAudioContext)();
      this._gain = this._ctx.createGain();
      const isAndroid = /android/i.test(navigator.userAgent) && !/iphone|ipad|ipod/i.test(navigator.userAgent);
      this._gain.gain.value = isAndroid ? 0.55 : 0.25;
      this._gain.connect(this._ctx.destination);
      this._dest = this._ctx.createMediaStreamDestination();
      this._gain.connect(this._dest);
      if (this._ctx.state === 'suspended') this._ctx.resume();
      this._buildBGMBuffer();
    } catch(e) { console.warn('SFX._init failed:', e); }
  },

  // Pre-render 8s BGM loop into AudioBuffer (no file deps, always works)
  _buildBGMBuffer() {
    const sr = this._ctx.sampleRate;
    const dur = 8;
    const n = Math.ceil(sr * dur);
    const buf = this._ctx.createBuffer(1, n, sr);
    const d = buf.getChannelData(0);
    const bpm = 120, beat = 60 / bpm;
    const nf = (name) => {
      const c = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
      const [a, o] = name.length < 3 ? [name[0], +name[1]] : [name.slice(0,2), +name[2]];
      return 440 * Math.pow(2, (c[a] - 9 + (o - 4) * 12) / 12);
    };
    // Chord pads (sine): C, G, Am, F (4 bars, 8 beats each)
    const chordRoots = [[nf('C3'),nf('E3'),nf('G3')],[nf('G3'),nf('B3'),nf('D4')],[nf('A3'),nf('C4'),nf('E4')],[nf('F3'),nf('A3'),nf('C4')]];
    // Melody (square): 8 notes per bar
    const melodies = [
      [nf('C5'),nf('E5'),nf('G5'),nf('E5'),nf('D5'),nf('C5'),nf('D5'),nf('E5')],
      [nf('G4'),nf('B4'),nf('D5'),nf('B4'),nf('A4'),nf('G4'),nf('A4'),nf('B4')],
      [nf('A4'),nf('C5'),nf('E5'),nf('C5'),nf('B4'),nf('A4'),nf('B4'),nf('C5')],
      [nf('G4'),nf('B4'),nf('D5'),nf('B4'),nf('C5'),nf('D5'),nf('E5'),nf('G5')],
    ];
    for (let i = 0; i < n; i++) {
      const t = i / sr;
      const bar = Math.floor(t / (beat * 4)) % 4;
      const beatInBar = (t % (beat * 4)) / beat;
      const noteIdx = Math.floor(beatInBar * 2) % 8;
      // Pad (warm sine)
      const chord = chordRoots[bar];
      let s = 0;
      if (this._bgmLayers.pad) {
        for (let k = 0; k < 3; k++) s += 0.06 * Math.sin(2 * Math.PI * chord[k] * t);
        s += 0.04 * Math.sin(2 * Math.PI * chord[0] * 2 * t);
      }
      // Bass (square, root every 2 beats)
      if (this._bgmLayers.bass) {
        const bassFreq = chord[0] / 2;
        const bPhase = (t * bassFreq) % 1;
        s += 0.08 * (bPhase < 0.5 ? 1 : -1) * Math.max(0, 1 - (t % beat) / beat);
      }
      // Melody (quiet sine, soft envelope — no harshness)
      if (this._bgmLayers.mel) {
        const melFreq = melodies[bar][noteIdx];
        const notePhase = (t % (beat / 2)) / (beat / 2);
        const melEnv = Math.max(0, 1 - notePhase) * Math.min(1, notePhase * 8);
        s += 0.03 * Math.sin(2 * Math.PI * melFreq * t) * melEnv;
      }
      // Kick on beats 1 & 3 (proper freq sweep: 200→30Hz, phase-integral, no artifact)
      if (this._bgmLayers.kick && ((beatInBar % 4) < 1 || ((beatInBar % 4) >= 2 && (beatInBar % 4) < 3))) {
        const kickT = (t % beat) / beat;
        if (kickT < 0.18) {
          const localT = t % beat;
          // phase = ∫freq dt with freq(t)=200*exp(-20*t)
          // integral = 200/20 * (1-exp(-20*t)) = 10*(1-exp(-20*t))
          const phase = 2 * Math.PI * 10 * (1 - Math.exp(-20 * localT));
          const env = Math.max(0, 1 - kickT / 0.18);
          s += 0.18 * Math.sin(phase) * env;
        }
      }
      d[i] = Math.max(-1, Math.min(1, s));
    }
    this._bgmBuffer = buf;
  },



  // Debug: toggle a BGM layer by name, rebuild & restart  // Debug: toggle a BGM layer by name, rebuild & restart
  toggleBGMLayer(name) {
    if (!this._bgmLayers.hasOwnProperty(name)) return;
    this._bgmLayers[name] = !this._bgmLayers[name];
    const wasPlaying = this._bgmPlaying;
    this.stopBGM();
    this._buildBGMBuffer();
    if (wasPlaying) this.startBGM();
    console.warn('BGM layer', name, '=', this._bgmLayers[name]);
  },

  // Simple tone (no sweep)
  _tone(freq, dur, type = 'sine', vol = 0.3, delay = 0) {
    if (this.muted) return;
    if (!this._ctx) this._init();
    if (!this._ctx) return;
    try {
      const t = this._ctx.currentTime + delay;
      const osc = this._ctx.createOscillator();
      const g = this._ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g);
      g.connect(this._gain);
      osc.start(t);
      osc.stop(t + dur);
    } catch(e) { console.warn('_tone err:', e); }
  },

  // Tone with frequency sweep start→end
  _sweep(freqStart, freqEnd, dur, type = 'sine', vol = 0.3, delay = 0) {
    if (this.muted) return;
    if (!this._ctx) this._init();
    if (!this._ctx) return;
    const t = this._ctx.currentTime + delay;
    const osc = this._ctx.createOscillator();
    const g = this._ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freqStart, t);
    osc.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g);
    g.connect(this._gain);
    osc.start(t);
    osc.stop(t + dur);
  },

  // Noise with optional filter
  _noise(dur, vol = 0.12, delay = 0, filterFreq = 0) {
    if (this.muted) return;
    if (!this._ctx) this._init();
    if (!this._ctx) return;
    const t = this._ctx.currentTime + delay;
    const sr = this._ctx.sampleRate;
    const buf = this._ctx.createBuffer(1, Math.ceil(sr * dur), sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = this._ctx.createBufferSource();
    src.buffer = buf;
    const g = this._ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    let chain = src;
    if (filterFreq > 0) {
      const f = this._ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(filterFreq, t);
      src.connect(f);
      chain = f;
    }
    chain.connect(g);
    g.connect(this._gain);
    src.start(t);
  },

  // Noise with sweeping bandpass filter (for firework whoosh etc.)
  _noiseSweep(dur, vol, filterStart, filterEnd, delay = 0) {
    if (this.muted) return;
    if (!this._ctx) this._init();
    const t = this._ctx.currentTime + delay;
    const sr = this._ctx.sampleRate;
    const buf = this._ctx.createBuffer(1, Math.ceil(sr * dur), sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = this._ctx.createBufferSource();
    src.buffer = buf;
    const f = this._ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.Q.setValueAtTime(1, t);
    f.frequency.setValueAtTime(filterStart, t);
    f.frequency.linearRampToValueAtTime(filterEnd, t + dur);
    const g = this._ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f);
    f.connect(g);
    g.connect(this._gain);
    src.start(t);
  },

  // Bright bell/chime for positive feedback (PvZ sun collection style)
  _chime(freq, dur = 0.12, vol = 0.08, delay = 0) {
    if (this.muted) return;
    if (!this._ctx) this._init();
    if (!this._ctx) { console.warn('_chime: no ctx'); return; }
    try {
      const t = this._ctx.currentTime + delay;
      [1, 2.01, 3.02, 4.03].forEach((mult, i) => {
        const osc = this._ctx.createOscillator();
        const g = this._ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq * mult, t);
        const hVol = vol * (0.5 / (i + 1));
        g.gain.setValueAtTime(hVol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur * (1 + i * 0.3));
        osc.connect(g);
        g.connect(this._gain);
        osc.start(t);
        osc.stop(t + dur * (1 + i * 0.5));
      });
    } catch(e) { console.warn('_chime err:', e); }
  },

  // Squish/splat noise (PvZ zombie death style)

    if (!this._ctx) this._init();
    const t = this._ctx.currentTime;
    const sr = this._ctx.sampleRate;
    const dur = 0.1;
    const buf = this._ctx.createBuffer(1, Math.ceil(sr * dur), sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      const env = 1 - i / d.length;
      d[i] = (Math.random() * 2 - 1) * env * env;
    }
    const src = this._ctx.createBufferSource();
    src.buffer = buf;
    const f = this._ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(800, t);
    f.frequency.exponentialRampToValueAtTime(200, t + dur);
    const g = this._ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f);
    f.connect(g);
    g.connect(this._gain);

      const g = this._ctx.createGain();
      g.gain.value = isAndroid ? 0.90 : 0.15; // Android speaker compensation
      src.connect(g);

const HLRecorder = {
  clips: [],
  _db: null,
  _recording: false,
  _stream: null,
  _rollingRecorders: [],
  _rollingTimer: null,
  _mime: '',

  init() {
    try {
      const req = indexedDB.open('egg_tomato_highlights', 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('clips')) {
          db.createObjectStore('clips', { keyPath: 'id' });
        }
      };
      req.onsuccess = (e) => {
        this._db = e.target.result;
        this._loadClipsFromDB();
      };
    } catch(e) {}
  },

  _loadClipsFromDB() {
    if (!this._db) return;
    const tx = this._db.transaction('clips', 'readonly');
    const req = tx.objectStore('clips').getAll();
    req.onsuccess = (e) => {
      this.clips = (e.target.result || []).map(c => ({
        id: c.id, timestamp: c.timestamp, type: c.type,
        label: c.label, icon: c.icon, duration: c.duration, blob: c.blob,
      }));
      this.clips.sort((a, b) => b.timestamp - a.timestamp);
      if (this.clips.length > 10) {
        const toRemove = this.clips.splice(10);
        for (const c of toRemove) this._deleteClipFromDB(c.id);
      }
    };
  },

  _saveClipToDB(clipData, meta) {
    if (!this._db) return;
    const id = Date.now() + '_' + Math.random().toString(36).slice(2);
    const tx = this._db.transaction('clips', 'readwrite');
    tx.objectStore('clips').put({ id, blob: clipData, ...meta });
    this.clips.push({ id, ...meta, blob: clipData });
    this.clips.sort((a, b) => b.timestamp - a.timestamp);
    if (this.clips.length > 10) {
      const toRemove = this.clips.splice(10);
      for (const c of toRemove) this._deleteClipFromDB(c.id);
    }
  },

  _deleteClipFromDB(id) {
    if (!this._db) return;
    const tx = this._db.transaction('clips', 'readwrite');
    tx.objectStore('clips').delete(id);
  },

  isSupported() { return typeof MediaRecorder !== 'undefined' && typeof canvas !== 'undefined' && canvas.captureStream; },

  _createRollingRecorder() {
    if (!this._recording || !this._stream) return;
    const t0 = performance.now();
    const chunks = [];
    const startTime = t0;
    const mrOpts = this._mime ? { mimeType: this._mime } : {};
    const r = new MediaRecorder(this._stream, mrOpts);
    r.ondataavailable = (e) => { if (e.data && e.data.size > 0 && entry.inUse) chunks.push(e.data); };
    r.start();
    const entry = { recorder: r, chunks, startTime, timer: null };
    entry.timer = setTimeout(() => {
      if (entry.inUse) return;
      if (r.state !== 'inactive') { try { r.stop(); } catch(e) {} }
      const idx = this._rollingRecorders.indexOf(entry);
      if (idx !== -1) this._rollingRecorders.splice(idx, 1);
    }, 3000);
    this._rollingRecorders.push(entry);
  },

  _getPlatform() {
    const ua = navigator.userAgent;
    if (/iphone|ipad|ipod/i.test(ua)) return 'ios';
    if (/android/i.test(ua)) return 'android';
    return 'desktop';
  },

  start() {
    if (!this.isSupported()) return;
    if (this._recording) return;
    try {
      const platform = this._getPlatform();
      const captureFps = (platform === 'ios' || platform === 'android') ? 15 : 30;
      const videoTrack = canvas.captureStream(captureFps).getVideoTracks()[0];
      let audioTrack = null;
      try { SFX._init(); if (SFX._dest) audioTrack = SFX._dest.stream.getAudioTracks()[0]; } catch(e) {}
      if (audioTrack) {
        this._stream = new MediaStream([videoTrack, audioTrack]);
      } else {
        this._stream = new MediaStream([videoTrack]);
      }
      let types = [];
      if (platform === 'desktop') {
        types = ['video/mp4;codecs=avc1.4D401E', 'video/mp4;codecs=avc1.42E01E', 'video/mp4',
                 'video/webm;codecs=vp8', 'video/webm;codecs=vp9', 'video/webm',
                 'video/mp4;codecs=hvc1', 'video/mp4;codecs=hev1'];
      } else if (platform === 'ios') {
        types = ['video/mp4;codecs=avc1.4D401E', 'video/mp4;codecs=avc1.42E01E', 'video/mp4',
                 'video/mp4;codecs=mp4v', 'video/webm',
                 'video/mp4;codecs=hvc1', 'video/mp4;codecs=hev1'];
      } else {
        types = ['video/mp4;codecs=avc1.4D401E', 'video/mp4;codecs=avc1.42E01E', 'video/mp4',
                 'video/webm;codecs=vp8', 'video/webm;codecs=vp9', 'video/webm',
                 'video/mp4;codecs=hvc1', 'video/mp4;codecs=hev1'];
      }
      let mime = '';
      for (const t of types) { if (MediaRecorder.isTypeSupported(t)) { mime = t; break; } }
      if (!mime) {
        console.warn('HL: no specific mime supported, trying default');
      }
      this._mime = mime;
      this._recording = true;
      this._createRollingRecorder();
      this._rollingTimer = setInterval(() => this._createRollingRecorder(), 1500);
    } catch(e) { console.warn('HL: start fail', e); }
  },

  reportFps(_fps) {},

  stop() {
    this._recording = false;
    if (this._rollingTimer) { clearInterval(this._rollingTimer); this._rollingTimer = null; }
    for (const entry of this._rollingRecorders) {
      if (entry.timer) { clearTimeout(entry.timer); }
      if (entry.recorder && entry.recorder.state !== 'inactive') {
        try { entry.recorder.stop(); } catch(e) {}
      }
    }
    this._rollingRecorders = [];
    if (this._stream) { this._stream.getVideoTracks().forEach(t => t.stop()); this._stream = null; }
  },

  saveHighlight(type, label, icon, duration = 10) {
    if (!this._recording) return;
    const t0 = performance.now();
    const now = Date.now();
    for (const c of this.clips) {
      if (c.type === type && now - c.timestamp < 10000) return;
    }
    if (this._rollingRecorders.length === 0) return;

    const perfNow = performance.now();
    const targetStart = perfNow - 3000;
    let best = null, bestDiff = Infinity;
    for (const entry of this._rollingRecorders) {
      if (entry.inUse) continue;
      const diff = Math.abs(entry.startTime - targetStart);
      if (diff < bestDiff) { bestDiff = diff; best = entry; }
    }
    if (!best) return;

    best.inUse = true;
    if (best.timer) { clearTimeout(best.timer); best.timer = null; }

    try { best.recorder.requestData(); } catch(e) {}
    const ri = setInterval(() => {
      if (best.recorder && best.recorder.state !== 'inactive') {
        try { best.recorder.requestData(); } catch(e) {}
      }
    }, 3000);

    const preludeMs = perfNow - best.startTime;
    const totalDuration = Math.round((preludeMs + duration * 1000) / 1000);

    best.recorder.onstop = () => {
      clearInterval(ri);
      const idx = this._rollingRecorders.indexOf(best);
      if (idx !== -1) this._rollingRecorders.splice(idx, 1);
      if (best.chunks.length > 0) {
        const actualDur = Math.max(1, best.chunks.length);
        const actualType = best.chunks[0].type || this._mime;
        const blob = new Blob(best.chunks, { type: actualType });
        this._saveClipToDB(blob, { type, label, icon, timestamp: now, duration: totalDuration });
      }
    };

    setTimeout(() => {
      if (best.recorder && best.recorder.state !== 'inactive') {
        try { best.recorder.stop(); } catch(e) {}
      }
    }, duration * 1000);
  },

  patchWebMDuration(blob) {
    return Promise.resolve(blob);
  },

  downloadClip(clip) {
    if (!clip || !clip.blob) return;
    const ts = new Date(); const fmt = ts.getFullYear() + ('0'+(ts.getMonth()+1)).slice(-2) + ('0'+ts.getDate()).slice(-2) + '_' + ('0'+ts.getHours()).slice(-2) + ('0'+ts.getMinutes()).slice(-2) + ('0'+ts.getSeconds()).slice(-2);
    const mt = (clip.blob.type || '').split(';')[0].split('/')[1] || 'webm';
    const name = `highlight_${clip.type}_${fmt}.${mt}`;
    this._showClipOverlay(null, '上传中...');
    (async () => {
      try {
        const res = await fetch(`/api/clips?name=${encodeURIComponent(name)}`, { method: 'POST', body: clip.blob });
        const data = await res.json();
        if (data.url) { this._showClipOverlay(data.url, null); }
        else { this._hideClipOverlay(); this._fallbackDownload(clip.blob, name); }
      } catch(e) { this._hideClipOverlay(); this._fallbackDownload(clip.blob, name); }
    })();
  },
  _clipOverlay: null,
  _showClipOverlay(url, loadingText) {
    this._hideClipOverlay();
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;';
    const close = document.createElement('div');
    close.textContent = '✕';
    close.style.cssText = 'position:absolute;top:16px;right:20px;font-size:24px;color:#fff;cursor:pointer;z-index:10000;padding:8px;';
    close.onclick = () => this._hideClipOverlay();
    overlay.appendChild(close);
    if (url) {
      const v = document.createElement('video');
      v.controls = true; v.playsinline = true;
      v.style.cssText = 'max-width:92vw;max-height:60vh;border-radius:8px;background:#000;';
      v.src = url; v.play().catch(() => {});
      overlay.appendChild(v);
      const dl = document.createElement('div');
      dl.textContent = '保存到手机';
      dl.style.cssText = 'margin-top:20px;padding:12px 36px;background:#ff6600;color:#fff;border-radius:8px;font-size:16px;cursor:pointer;';
      dl.onclick = () => { window.open(url + (url.includes('?') ? '&' : '?') + 'dl=1'); };
      overlay.appendChild(dl);
    } else {
      const p = document.createElement('p');
      p.style.cssText = 'color:#fff;font-size:16px;';
      p.textContent = loadingText || '处理中...';
      overlay.appendChild(p);
    }
    document.body.appendChild(overlay);
    this._clipOverlay = overlay;
  },
  _hideClipOverlay() {
    if (this._clipOverlay) { document.body.removeChild(this._clipOverlay); this._clipOverlay = null; }
  },
  _fallbackDownload(blob, name) {
    const url = URL.createObjectURL(blob);
    this._hideClipOverlay();
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;';
    const close = document.createElement('div');
    close.textContent = '✕';
    close.style.cssText = 'position:absolute;top:16px;right:20px;font-size:24px;color:#fff;cursor:pointer;z-index:10000;padding:8px;';
    close.onclick = () => { document.body.removeChild(overlay); URL.revokeObjectURL(url); };
    overlay.appendChild(close);
    const v = document.createElement('video');
    v.controls = true; v.playsinline = true;
    v.style.cssText = 'max-width:92vw;max-height:60vh;border-radius:8px;background:#000;';
    v.src = url; v.play().catch(() => {});
    overlay.appendChild(v);
    const hint = document.createElement('p');
    hint.style.cssText = 'color:#ff6600;font-size:14px;margin-top:16px;text-align:center;line-height:1.6;';
    hint.textContent = '无服务器环境无法下载\n请连接服务器后再试';
    overlay.appendChild(hint);
    document.body.appendChild(overlay);
  },

  playClip(clip) {
    if (!clip || !clip.blob || clip.blob.size === 0) return;
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:9999;display:flex;align-items:center;justify-content:center;';
    const v = document.createElement('video');
    v.controls = true;
    v.style.cssText = 'max-width:95vw;max-height:90vh;border-radius:8px;';
    const url = URL.createObjectURL(clip.blob);
    v.src = url;
    v.addEventListener('ended', () => { v.pause(); });
    const close = document.createElement('div');
    close.textContent = '✕';
    close.style.cssText = 'position:absolute;top:16px;right:20px;font-size:28px;color:#fff;cursor:pointer;z-index:10000;';
    close.onclick = () => { document.body.removeChild(overlay); URL.revokeObjectURL(url); };
    overlay.appendChild(v);
    overlay.appendChild(close);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) { document.body.removeChild(overlay); URL.revokeObjectURL(url); } });
    document.body.appendChild(overlay);
    v.play().catch(() => {});
  },

  deleteClipFromList(id) {
    this.clips = this.clips.filter(c => c.id !== id);
    this._deleteClipFromDB(id);
  },

  getStats() {
    let active = 0, inUse = 0, chunks = 0, bytes = 0, codec = this._mime;
    for (const e of this._rollingRecorders) {
      if (e.recorder && e.recorder.state !== 'inactive') active++;
      if (e.inUse) inUse++;
      chunks += e.chunks.length;
      for (const c of e.chunks) bytes += c.size;
    }
    return { active, inUse, chunks, bytes, codec };
  },
};

  drawPillText(text, x, y, { bg, fg, size, radius, padX, padY, align, bold } = {}) {
    const fs = size || SIZE * .028;
    ctx.font = (bold ? 'bold ' : '') + fs + 'px Arial';
    ctx.textAlign = align || 'left';
    const pw = padX || fs * .6;
    const ph = padY || fs * .3;
    ctx.textBaseline = 'middle';
    const tw = ctx.measureText(text).width;
    const rx = align === 'center' ? x - tw / 2 - pw : x - pw;
    const ry = y - fs / 2 - ph;
    const rw = tw + pw * 2;
    const rh = fs + ph * 2;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.08)';
    ctx.shadowBlur = 4;
    ctx.fillStyle = bg || 'rgba(255,255,255,.85)';
    ctx.beginPath();
    ctx.roundRect(rx, ry, rw, rh, radius || 6);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = fg || '#333';
    ctx.fillText(text, x, y);
    ctx.restore();
    ctx.textBaseline = 'alphabetic';
  }

  setState(newState) {
    if (this.state === newState) return;
    const oldState = this.state;
    this.state = newState;
    if (newState === 'playing') {
      this.startGame();
    } else if (oldState === 'playing') {
      // transitioning away from playing
    }
    this.transitionState = 'fadeOut';
    this.transitionTimer = 10;
  }

  drawGlassOverlay() {
    const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, SIZE * .7);
    grad.addColorStop(0, 'rgba(0,0,0,.25)');
    grad.addColorStop(.5, 'rgba(0,0,0,.55)');
    grad.addColorStop(1, 'rgba(0,0,0,.75)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, CW, CH);
  }

    if (!this.showTutorial) return;
    const card = TUTORIAL_CARDS[this.tutorialIndex];
    if (!card) { this.showTutorial = false; return; }

    const cardW = SIZE * .7, cardH = SIZE * .4;
    const cx = CX, cy = CY;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.3)';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.roundRect(cx - cardW / 2, cy - cardH / 2, cardW, cardH, 16);

    ctx.textAlign = 'center';

  drawJoystick() {

    const innerR = SIZE * .06;
    const knobX = this.joystickActive ? this.joystickKnobX : jcX;
    const knobY = this.joystickActive ? this.joystickKnobY : jcY;
    ctx.save();
    // Dark backdrop

    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(jcX, jcY, outerR + 4, 0, Math.PI * 2);
    ctx.fill();
    // Outer ring
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = 'rgba(255,255,255,.8)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(jcX, jcY, outerR, 0, Math.PI * 2);
    ctx.stroke();
    // Inner knob
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(knobX, knobY, innerR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  drawButton(label, x, y, w, h, { bg, hoverBg, fg, hoverFg, fontSize, radius } = {}) {
    const hovered = this.hoverBtn === label;
    const fb = hovered ? (hoverBg || '#a5d6a7') : (bg || '#81c784');
    const ff = hovered ? (hoverFg || '#fff') : (fg || '#fff');
    const fs = fontSize || SIZE * .045;
    ctx.save();
    ctx.shadowColor = hovered ? 'rgba(129,199,132,.5)' : 'rgba(0,0,0,.1)';
    ctx.shadowBlur = hovered ? 10 : 5;
    ctx.fillStyle = fb;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, radius || 10);
    ctx.fill();
    ctx.shadowBlur = 0;
    if (hovered) {
      ctx.strokeStyle = 'rgba(255,255,255,.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, radius || 10);
      ctx.stroke();
    }
    ctx.fillStyle = ff;
    ctx.font = `bold ${fs}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x + w / 2, y + h / 2);
    ctx.restore();
    ctx.textBaseline = 'alphabetic';
  }

  getSpawnInterval() {
    if (this.gameMode === 'endless') {
      return Math.max(40, Math.floor(80 - this.difficulty * 1.5));
    }
    let base = Math.max(25, 80 - this.wave * 5);
    if (this.survivalTime > 120) {
      base = Math.max(20, base - Math.floor((this.survivalTime - 120) / 15));
    }
    return base;
  }

  getTomatoSpeedMult() {
    if (this.gameMode === 'endless') {
      return (1 + this.difficulty * 0.03) * (SIZE / 400);
    }
    let waveMult = 1 + this.wave * 0.02;
    if (this.wave > 6) waveMult += (this.wave - 6) * 0.02;
    return waveMult * (SIZE / 400);
  }

  getTomatoCap() {
    if (this.gameMode === 'endless') {
      return Math.floor(5 + this.difficulty * 0.8);
    }
    return Math.min(10 + this.wave, 20);
  }

  generateGoal() {
    const tiers = [
      { goal: 60, label: '小试牛刀', base: 40 },
      { goal: 120, label: '渐入佳境', base: 30 },
      { goal: 180, label: '硬核挑战', base: 20 },
      { goal: 300, label: '终极考验', base: 7 },
      { goal: 600, label: '传说级', base: 3 },
    ];
    // Use dynamic weights if enough history
    let weights = tiers.map(t => t.base);
    if (this.survivalHistory.length >= 3) {
      const hist = this.survivalHistory;
      const n = hist.length;
      weights = tiers.map((t, i) => {
        const prevGoal = i > 0 ? tiers[i - 1].goal : 0;
        // frequency of survival times in this tier's difficulty bucket
        const bucketFreq = i === tiers.length - 1
          ? hist.filter(v => v >= prevGoal).length / n
          : hist.filter(v => v >= prevGoal && v < t.goal).length / n;
        return t.base * 0.3 + bucketFreq * 100 * 0.7;
      });
    }
    const total = weights.reduce((s, w) => s + w, 0);
    let r = Math.random() * total;
    let chosen = tiers[0];
    for (let i = 0; i < tiers.length; i++) {
      r -= weights[i];
      if (r <= 0) { chosen = tiers[i]; break; }
    }
    this.challengeGoal = chosen.goal;
    this.challengeLabel = chosen.label;
  }

  // Jump system — replaces old splash charge
  computeJumpPath(startX, startY, dirX, dirY, totalDist) {
    const segs = [];
    let cx = startX, cy = startY;
    let dx = dirX, dy = dirY;
    let remaining = totalDist;
    const L = PLATE_MARGIN + EGG_R, R = CW - PLATE_MARGIN - EGG_R;
    const T = PLATE_MARGIN + EGG_R, B = CH - PLATE_MARGIN - EGG_R;
    const maxSegs = 20;
    let iter = 0;
    if (DEBUG) console.log(`jumpPath: start=(${cx.toFixed(1)},${cy.toFixed(1)}) dir=(${dx.toFixed(3)},${dy.toFixed(3)}) dist=${remaining.toFixed(1)} bounds_L=${L.toFixed(1)}_R=${R.toFixed(1)}_T=${T.toFixed(1)}_B=${B.toFixed(1)}`);
    while (remaining > 2 && segs.length < maxSegs) {
      iter++;
      const len = Math.sqrt(dx * dx + dy * dy);
      if (len < 0.001) break;
      dx /= len; dy /= len;
      const ex = cx + dx * remaining;
      const ey = cy + dy * remaining;
      if (ex >= L && ex <= R && ey >= T && ey <= B) {
        segs.push({ x1: cx, y1: cy, x2: ex, y2: ey });
        if (DEBUG) console.log(`jumpPath iter${iter}: final seg to (${ex.toFixed(1)},${ey.toFixed(1)})`);
        break;
      }
      // Find earliest wall hit (with epsilon for simultaneous corner hits)
      let tMin = remaining + 1;
      let hitX = false, hitY = false;
      if (dx > 0) { const t = (R - cx) / dx; if (t < tMin - 0.001) { tMin = t; hitX = true; hitY = false; } else if (Math.abs(t - tMin) < 0.001) { hitX = true; } }
      else if (dx < 0) { const t = (L - cx) / dx; if (t < tMin - 0.001) { tMin = t; hitX = true; hitY = false; } else if (Math.abs(t - tMin) < 0.001) { hitX = true; } }
      if (dy > 0) { const t = (B - cy) / dy; if (t < tMin - 0.001) { tMin = t; hitY = true; hitX = false; } else if (Math.abs(t - tMin) < 0.001) { hitY = true; } }
      else if (dy < 0) { const t = (T - cy) / dy; if (t < tMin - 0.001) { tMin = t; hitY = true; hitX = false; } else if (Math.abs(t - tMin) < 0.001) { hitY = true; } }
      if (tMin > remaining) {
        if (DEBUG) console.log(`jumpPath iter${iter}: tMin(${tMin.toFixed(2)}) > remaining(${remaining.toFixed(1)}), break`);
        break;
      }
      if (tMin <= 0.001) {
        if (DEBUG) console.log(`jumpPath iter${iter}: at-wall reflect hitX=${hitX} hitY=${hitY}`);
        if (hitX) dx = -dx;
        if (hitY) dy = -dy;
        continue;
      }
      const hx = cx + dx * tMin;
      const hy = cy + dy * tMin;
      segs.push({ x1: cx, y1: cy, x2: hx, y2: hy });
      if (DEBUG) console.log(`jumpPath iter${iter}: seg to (${hx.toFixed(1)},${hy.toFixed(1)}) tMin=${tMin.toFixed(2)} hitX=${hitX} hitY=${hitY} remaining=${(remaining-tMin).toFixed(1)}`);
      if (hitX) dx = -dx;
      if (hitY) dy = -dy;
      cx = hx; cy = hy;
      remaining -= tMin;
    }
    if (DEBUG) console.log(`jumpPath: done, ${segs.length} segs`);
    return segs;
  }

  findSafestDirection() {
    const slices = 8;
    let bestDir = { x: 1, y: 0 };
    let bestCount = Infinity;
    for (let i = 0; i < slices; i++) {
      const angle = Math.PI * 2 / slices * i;
      const dx = Math.cos(angle), dy = Math.sin(angle);
      let count = 0;
      for (const t of this.tomatoes) {
        const tdx = t.pos.x - this.egg.pos.x, tdy = t.pos.y - this.egg.pos.y;
        const td = Math.sqrt(tdx * tdx + tdy * tdy);
        if (td < UNIT * 0.5) {
          const dot = (tdx * dx + tdy * dy) / Math.max(td, 1);
          if (dot > 0.7) count++;
        }
      }
      if (count < bestCount) { bestCount = count; bestDir = { x: dx, y: dy }; }
    }
    return bestDir;
  }

  doJump() {
    const elapsed = Date.now() - this.chargeStartTime;
    const charge = Math.max(0, Math.min(1, (elapsed - 200) / 1800));
    const pw = CW - PLATE_MARGIN * 2, ph = CH - PLATE_MARGIN * 2;
    const totalDist = Math.sqrt(pw * pw + ph * ph) * charge;
    try { SFX.jumpRelease(); } catch(e) {}
    if (totalDist < 5) {
      if (DEBUG) console.log('doJump: totalDist < 5, abort');
      this.isCharging = false;
      this.chargeActive = false;
      return;
    }
    let dir = this.chargeDirection;
    let len = Math.sqrt(dir.x * dir.x + dir.y * dir.y);
    if (len < 1) {
      if (DEBUG) console.log('doJump: direction too short, use safestDir');
      dir = this.findSafestDirection();
      len = Math.sqrt(dir.x * dir.x + dir.y * dir.y);
      if (len < 0.01) { dir = { x: 1, y: 0 }; len = 1; }
    }
    const normX = dir.x / len;
    const normY = dir.y / len;
    if (DEBUG) console.log(`doJump: egg=(${this.egg.pos.x.toFixed(1)},${this.egg.pos.y.toFixed(1)}) dir=(${normX.toFixed(3)},${normY.toFixed(3)}) dist=${totalDist.toFixed(1)} charge=${charge.toFixed(3)}`);
    this.jumpPath = this.computeJumpPath(this.egg.pos.x, this.egg.pos.y, normX, normY, totalDist);
    if (this.jumpPath.length === 0) {
      if (DEBUG) console.log('doJump: path empty, abort');
      this.isCharging = false;
      this.chargeActive = false;
      return;
    }
    if (DEBUG) console.log(`doJump: path has ${this.jumpPath.length} segs`);
    this.isJumping = true;
    this.isCharging = false;
    this.chargeActive = false;
    this.egg.invincible = 120;
    this.splashUsedThisRound = true;
    SFX.splash();
    // Takeoff particles
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2;
      this.particles.push(acquireParticle(this.egg.pos.x, this.egg.pos.y + 5, Math.cos(a) * (1 + Math.random() * 3), -Math.random() * 4 - 2, 3 + Math.random() * 3, '#b3e5fc', 10 + Math.random() * 10));
    }
    let totalLen = 0;
    for (const s of this.jumpPath) {
      const ddx = s.x2 - s.x1, ddy = s.y2 - s.y1;
      totalLen += Math.sqrt(ddx * ddx + ddy * ddy);
    }
    this.jumpTotalDist = totalLen;
    this.jumpTotalFrames = Math.max(10, Math.floor(totalLen / 10));
    this.jumpTimer = 0;
    this.jumpCharge = charge;
    if (charge >= 0.85) HLRecorder.saveHighlight('long_jump', '超级跳跃', '🦘', 7);
  }

  jumpLanding() {
    this.isJumping = false;
    this.egg.invincible = 30;
    const m = PLATE_MARGIN + this.egg.r;
    this.egg.pos.x = Math.max(m, Math.min(CW - m, this.egg.pos.x));
    this.egg.pos.y = Math.max(m, Math.min(CH - m, this.egg.pos.y));
    const chargeMult = 1 + this.jumpCharge;
    const hasRange = this.egg.splashRangeBuff > 0;
    const landRange = UNIT * 0.25 * chargeMult * (hasRange ? 2 : 1);
    SFX.hit();
    // Landing splash particles
    const numP = (hasRange ? 70 : 40) + Math.floor(this.jumpCharge * 30);
    for (let i = 0; i < numP; i++) {
      const a = Math.PI * 2 / numP * i + Math.random() * 0.15;
      const spd = (hasRange ? 5 : 3) + Math.random() * (hasRange ? 8 : 5) * chargeMult;
      this.particles.push(acquireParticle(this.egg.pos.x, this.egg.pos.y, Math.cos(a) * spd, Math.sin(a) * spd, 3 + Math.random() * 4, '#ffab00', 15 + Math.random() * 15));
    }
    // Corner escape boost
    const distCenter = this.egg.pos.distTo(new Vec2(CX, CY));
    const edgeMargin = UNIT - distCenter;
    const edgeBoost = edgeMargin < UNIT * 0.3 ? 1 + (1 - edgeMargin / (UNIT * 0.3)) * 0.6 : 1;
    // Kncokback tomatoes in range
    const splitterSpawns = [];
    let landKillCount = 0;
    for (const t of this.tomatoes) {
      const d = t.pos.distTo(this.egg.pos);
      if (d < landRange) {
        const dir = t.pos.sub(this.egg.pos).norm();
        const power = 1 - d / landRange;
        t.vel = dir.scale((8 + power * 12 * chargeMult) * edgeBoost);
        t.flash = 12;
        for (let i2 = 0; i2 < 4; i2++) {
          const a2 = Math.random() * Math.PI * 2;
          this.particles.push(acquireParticle(t.pos.x, t.pos.y, Math.cos(a2) * (2 + Math.random() * 3), Math.sin(a2) * (2 + Math.random() * 3), 2 + Math.random() * 2, '#ff6d00', 8 + Math.random() * 8));
        }
        if (t.shielded) {
          t.shielded = false;
          t.flash = 20;
        } else {
          t.hp -= Math.ceil(1 + power * (this.egg.splashPowerBuff > 0 ? 2 : 1));
        }
        if (t.hp <= 0) {
          landKillCount++;
          if (t.type === 'splitter') {
            for (let i = 0; i < 2; i++) {
              const seed = new Tomato('seed');
              seed.pos = new Vec2(t.pos.x + (Math.random() - 0.5) * 30, t.pos.y + (Math.random() - 0.5) * 30);
              splitterSpawns.push(seed);
            }
          }
          this.killTomato(t);
        }
      }
    }
    for (const s of splitterSpawns) this.tomatoes.push(s);
    if (landKillCount > 0) this.triggerChainLightning(this.egg.pos.x, this.egg.pos.y);
  }

  triggerChainLightning(cx, cy) {
    if (this.chainLightningStored <= 0) return;
    const targets = this.tomatoes.filter(t => t.hp > 0);
    if (targets.length < 2) return;
    this.chainLightningStored--;
    // Pick 2 alive tomatoes nearest to the kill point
    targets.sort((a, b) => a.pos.distTo({x: cx, y: cy}) - b.pos.distTo({x: cx, y: cy}));
    const chain = targets.slice(0, Math.min(5, targets.length));
    // Lightning arc visual: kill point → target 1 → target 2
    const points = [{x: cx, y: cy}];
    for (const t of chain) points.push({x: t.pos.x, y: t.pos.y});
    this.lightningBolts.push({ points, timer: 60 });
    // Apply splash-like damage & knockback to chained targets
    for (const t of chain) {
      const dir = t.pos.sub({x: cx, y: cy}).norm();
      t.vel = dir.scale(8 + 10);
      t.flash = 40;
      if (t.shielded) {
        t.shielded = false;
        t.flash = 50;
      } else {
        t.hp -= 1;
      }
      // Lightning strike burst at hit position
      for (let k = 0; k < 30; k++) {
        const a2 = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 6;
        this.particles.push(acquireParticle(t.pos.x, t.pos.y, Math.cos(a2) * spd, Math.sin(a2) * spd, 4 + Math.random() * 4, '#fff', 15 + Math.random() * 15));
      }
      for (let k = 0; k < 16; k++) {
        const a2 = Math.random() * Math.PI * 2;
        const spd = 0.5 + Math.random() * 2;
        this.particles.push(acquireParticle(t.pos.x, t.pos.y, Math.cos(a2) * spd, Math.sin(a2) * spd, 4 + Math.random() * 4, '#ffeb3b', 30 + Math.random() * 20));
      }
      if (t.hp <= 0) this.killTomato(t);
    }
    SFX.thunder();
    this.showMessage(`⚡ 闪电链命中${chain.length}个番茄！`, 200);
    if (chain.length >= 3) HLRecorder.saveHighlight('chain_lightning', '闪电链', '⚡', 4);
  }

  quickSplash() {
    if (this.splashCooldown > 0) return;
    this.splashCooldown = 6;
    const hasRange = this.egg.splashRangeBuff > 0;
    const splashRange = UNIT * 0.32 * (hasRange ? 2 : 1);
    const powerMult = this.egg.splashPowerBuff > 0 ? 2 : 1;
    SFX.splash();
    this.egg.invincible = 8;
    const cx = this.egg.pos.x, cy = this.egg.pos.y;
    // Spray burst: glowing particles reaching around splashRange with fuzzy boundary
    const numP = hasRange ? 45 : 32;
    for (let i = 0; i < numP; i++) {
      const a = Math.PI * 2 / numP * i + Math.random() * 0.12;
      const life = 16 + Math.floor(Math.random() * 10);
      const distRatio = (1 - Math.pow(0.97, life)) / 0.03;
      const targetDist = splashRange * (0.5 + Math.random() * 0.6);
      const spd = targetDist / distRatio;
      const p = acquireParticle(cx, cy, Math.cos(a) * spd, Math.sin(a) * spd, 4 + Math.random() * 3, '#ff6f00', life);
      p.glow = 8;
      this.particles.push(p);
    }
    // Corner escape boost for quick splash
    const distCenter = this.egg.pos.distTo(new Vec2(CX, CY));
    const edgeMargin = UNIT - distCenter;
    const edgeBoost = edgeMargin < UNIT * 0.3 ? 1 + (1 - edgeMargin / (UNIT * 0.3)) * 0.6 : 1;
    // Damage & knockback
    let splashKillCount = 0;
    for (const t of this.tomatoes) {
      const d = t.pos.distTo(this.egg.pos);
      if (d < splashRange) {
        const dir = t.pos.sub(this.egg.pos).norm();
        const power = 1 - d / splashRange;
        t.vel = dir.scale((6 + power * 10) * edgeBoost);
        t.flash = 10;
        if (t.shielded) {
          t.shielded = false;
          t.flash = 20;
        } else {
          t.hp -= Math.ceil(1 + power * powerMult);
        }
        if (t.hp <= 0) {
          splashKillCount++;
          this.killTomato(t);
        }
      }
    }
    if (splashKillCount > 0) this.triggerChainLightning(cx, cy);
  }

  dash(dirX, dirY) {
    if (this.dashCooldown > 0) return;
    this.dashCooldown = 120;
    const len = Math.sqrt(dirX * dirX + dirY * dirY);
    if (len < 0.01) return;
    const nx = dirX / len, ny = dirY / len;
    const dist = UNIT * 0.225;
    let dx = this.egg.pos.x + nx * dist;
    let dy = this.egg.pos.y + ny * dist;
    dx = Math.max(PLATE_MARGIN + this.egg.r, Math.min(CW - PLATE_MARGIN - this.egg.r, dx));
    dy = Math.max(PLATE_MARGIN + this.egg.r, Math.min(CH - PLATE_MARGIN - this.egg.r, dy));
    this.egg.pos = new Vec2(dx, dy);
    this.egg.invincible = 12;
    this.isDashing = true;
    this.dashTimer = 8;
    this.dashDir = new Vec2(nx, ny);
    SFX.hit();
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = 3 + Math.random() * 5;
      this.particles.push(acquireParticle(this.egg.pos.x, this.egg.pos.y, Math.cos(a) * speed, Math.sin(a) * speed, 3, '#e0f7fa', 12 + Math.random() * 10));
    }
  }

  killTomato(t, silent = false) {
    const idx = this.tomatoes.indexOf(t);
    if (idx >= 0) this.tomatoes.splice(idx, 1);
    if (silent) {
      // Only death particles, no gold/combo
      const colorMap = { boss: '#e63946', big: '#f44336', shield: '#4fc3f7', splitter: '#ab47bc', explosive: '#ff7043', seed: '#ffab91' };
      const color = colorMap[t.type] || '#ff6b6b';
      for (let i = 0; i < 15; i++) {
        const a = Math.random() * Math.PI * 2;
        const spd = 1 + Math.random() * 4;
        this.particles.push(acquireParticle(t.pos.x, t.pos.y, Math.cos(a) * spd, Math.sin(a) * spd, 2 + Math.random() * 4, color, 20 + Math.random() * 20));
      }
      return;
    }
    this.totalKills++;
    this.sessionKills++;
    this.comboCount++;
    this.egg.combo++;
    this.egg.comboTimer = 90;
    if (this.comboCount > this.maxCombo) this.maxCombo = this.comboCount;
    if (this.comboCount === 20) HLRecorder.saveHighlight('combo_20', '20连击', '🎖️', 8);
    if (this.comboCount === 50) HLRecorder.saveHighlight('combo_50', '50连击', '🏆', 10);
    if (t.type === 'boss') HLRecorder.saveHighlight('boss_kill', 'BOSS击杀', '👾', 10);
    let pts = 1;
    if (t.type === 'big') pts = 4;
    if (t.type === 'boss') pts = 5;
    if (t.type === 'explosive' || t.type === 'splitter') pts = 2;
    if (t.type === 'shield') pts = 3;
    if (this.comboCount > 1) pts = Math.floor(pts * (1 + this.comboCount * .05));
    const goldPts = this.goldBoostTimer > 0 ? Math.floor(pts * 1.5) : pts;
    this.gold += goldPts;
    this.skinPoints += pts;
    SFX.kill();
    if (goldPts > 0) SFX.gold();
    // Gold popup and coin particles
    this.goldPopups.push({ x: t.pos.x, y: t.pos.y - 10, text: `+${goldPts}g`, timer: 40, vy: -1.5 });
    for (let i = 0; i < Math.min(goldPts, 6); i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 3;
      this.particles.push(acquireParticle(t.pos.x, t.pos.y, Math.cos(a) * speed, Math.sin(a) * speed,
        2 + Math.random() * 2, '#ffd700', 20 + Math.random() * 15));
    }
    const colorMap = { boss: '#e63946', big: '#f44336', shield: '#4fc3f7', splitter: '#ab47bc', explosive: '#ff7043', seed: '#ffab91' };
    const color = colorMap[t.type] || '#ff6b6b';
    const pCount = t.type === 'boss' || t.type === 'explosive' ? 30 : 15;
    for (let i = 0; i < pCount; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 4;
      this.particles.push(acquireParticle(t.pos.x, t.pos.y, Math.cos(a) * speed, Math.sin(a) * speed, 2 + Math.random() * 4, color, 20 + Math.random() * 20));
    }
    if (this.comboCount >= 3) {
      if (this.comboCount >= 3) SFX.combo(this.comboCount);
    // this.showMessage(`连击 x${this.comboCount}！`, 40);
    }

    // Explosive tomato: explosion damages nearby tomatoes and egg
    if (t.type === 'explosive') {
      const blastR = UNIT * .35;
      for (let i = 0; i < 25; i++) {
        const a = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 6;
        this.particles.push(acquireParticle(t.pos.x, t.pos.y, Math.cos(a) * speed, Math.sin(a) * speed, 3 + Math.random() * 4, '#ff6d00', 25 + Math.random() * 20));
      }
      // Copy array to safely handle recursive kills (chain reaction)
      const blastTargets = [...this.tomatoes];
      for (let other of blastTargets) {
        const d = other.pos.distTo(t.pos);
        if (d < blastR) {
          const power = 1 - d / blastR;
          other.vel = other.pos.sub(t.pos).norm().scale(6 + power * 10);
          other.flash = 12;
          other.hp -= Math.ceil(1 + power * 2);
          if (other.hp <= 0) {
            this.killTomato(other);
          }
        }
      }
      // Damage egg if caught in blast
      const eggD = this.egg.pos.distTo(t.pos);
      if (eggD < blastR && this.egg.invincible <= 0) {
        const power = 1 - eggD / blastR;
        this.egg.hp -= Math.ceil(power * 2);
        this.egg.invincible = 15;
        for (let i = 0; i < 8; i++) {
          const a = Math.random() * Math.PI * 2;
          this.particles.push(acquireParticle(this.egg.pos.x, this.egg.pos.y, Math.cos(a) * 5, Math.sin(a) * 5, 4, '#ff6d00', 20));
        }
        if (this.egg.hp <= 0) {
          this.gameOver();
          return;
        }
      }
      // this.showMessage('爆炸！', 30);
    }

    this.checkUnlocks();
    this.checkAchievements();
    this.saveProgress();
  }

  showMessage(msg, time) {
    this.message = msg;
    this.messageTimer = time || 60;
  }

  spawnArtifact() {
    const healWeight = this.egg.hp < this.egg.maxHp ? Math.min(5, (this.egg.maxHp - this.egg.hp) * 3) : 0;
    const types = this._artifactTypes || (this._artifactTypes = [
      { id: 'heal', icon: '❤️', label: '回血', weight: 0 },
      { id: 'shield', icon: '🛡️', label: '护盾', weight: 3 },
      { id: 'splash_range', icon: '💫', label: '溅射', weight: 5 },
      { id: 'splash_power', icon: '💢', label: '猛攻', weight: 3 },
      { id: 'fire_shell', icon: '🔥', label: '火焰蛋壳', weight: 6 },
      { id: 'gravity', icon: '🌀', label: '引力漩涡', weight: 2 },
      { id: 'chain_lightning', icon: '⚡', label: '闪电链', weight: 2 },
      { id: 'repulse', icon: '💥', label: '斥力震波', weight: 3 },
      { id: 'tomato_apocalypse', icon: '🍅', label: '番茄末日', weight: 2 },
    ]);
    const tomatoCount = this.tomatoes.length;
    const progress = Math.min(1, Math.max(0, (tomatoCount - 3) / 12));
    const eased = progress <= 0 ? 0 : progress < 1 ? Math.pow(progress, 1.6) : 1;
    const startWeights = {
      shield: 24,
      splash_range: 14,
      splash_power: 10,
      fire_shell: 8,
      gravity: 4,
      chain_lightning: 18,
      repulse: 6,
      tomato_apocalypse: 2,
    };
    const fullWeights = {
      shield: 20,
      splash_range: 7,
      splash_power: 4,
      fire_shell: 18,
      gravity: 14,
      chain_lightning: 10,
      repulse: 12,
      tomato_apocalypse: 15,
    };
    const interp = (start, end) => start + (end - start) * eased;
    // heal weight is dynamic based on HP
    types[0].weight = healWeight;
    for (let i = 1; i < types.length; i++) {
      const t = types[i];
      const startWeight = startWeights[t.id] || 0;
      const fullWeight = fullWeights[t.id] || 0;
      t.weight = Math.max(0, interp(startWeight, fullWeight));
    }
    const totalWeight = types.reduce((s, t) => s + t.weight, 0);
    if (totalWeight <= 0) return;
    let r = Math.random() * totalWeight;
    let chosen = types[0];
    for (const t of types) {
      r -= t.weight;
      if (r <= 0) { chosen = t; break; }
    }
    const margin = EGG_R * 3;
    // Pick position farthest from nearest tomato
    const candidates = 16;
    let bestX, bestY, bestDist = -1;
    for (let c = 0; c < candidates; c++) {
      let px, py;
      if (BOUNDARY_MODE === 'circle') {
        const angle = Math.random() * Math.PI * 2;
        const dist = margin + Math.random() * Math.max(0, UNIT - margin - EGG_R);
        px = CX + Math.cos(angle) * dist;
        py = CY + Math.sin(angle) * dist;
      } else {
        px = PLATE_MARGIN + margin + Math.random() * Math.max(0, CW - PLATE_MARGIN * 2 - margin * 2);
        py = PLATE_MARGIN + margin + Math.random() * Math.max(0, CH - PLATE_MARGIN * 2 - margin * 2);
      }
      let minDist = 1e9;
      for (const t of this.tomatoes) {
        const d = Math.hypot(t.pos.x - px, t.pos.y - py);
        if (d < minDist) minDist = d;
      }
      if (minDist > bestDist) { bestDist = minDist; bestX = px; bestY = py; }
    }
    this.artifacts.push({ x: bestX, y: bestY, type: chosen, r: EGG_R * .8, phase: Math.random() * Math.PI * 2, life: 600 });
  }

  collectArtifact(a) {
    if (a.type.id === 'heal') {
      this.egg.hp = Math.min(this.egg.hp + 1, this.egg.maxHp);
      SFX.healArtifact();
      this.showMessage('❤️ 回血圣光！蛋清下肚满血复活，番茄看了干瞪眼！', 200);
    } else if (a.type.id === 'shield') {
      this.storedShield++;
      SFX.shieldArtifact();
      this.showMessage('🛡️ 护盾屏障！番茄撞我我不疼，气哭一堆小番茄！', 200);
    } else if (a.type.id === 'splash_range') {
      this.egg.splashRangeBuff = 360;
      SFX.splashRangeArtifact();
      this.showMessage('💫 溅射范围！蛋花泼出去，番茄全淋浴！', 200);
    } else if (a.type.id === 'splash_power') {
      this.egg.splashPowerBuff = 360;
      SFX.splashPowerArtifact();
      this.showMessage('💢 猛攻之力！蛋黄暴击，番茄秒变番茄酱！', 200);
    } else if (a.type.id === 'fire_shell') {
      this.fireShellTimer = 300;
      SFX.fireIgnite();
      this.showMessage('🔥 火焰蛋壳！敢碰我就请你吃烤番茄！', 200);
      HLRecorder.saveHighlight('fire_kill', '火焰蛋壳', '🔥', 8);
    } else if (a.type.id === 'gravity') {
      const gx = a.x, gy = a.y;
      HLRecorder.saveHighlight('gravity_use', '引力漩涡', '🌀', 8);
      this.gravityField = { x: gx, y: gy, timer: 180 };
      for (const t of this.tomatoes) {
        t.gravityTx = gx;
        t.gravityTy = gy;
        t.gravityPull = 180;
      }
      // Vortex visual at artifact position (burst)
      for (let i = 0; i < 40; i++) {
        const a2 = Math.random() * Math.PI * 2;
        const spd = 3 + Math.random() * 6;
        this.particles.push(acquireParticle(gx, gy, Math.cos(a2) * spd, Math.sin(a2) * spd, 3 + Math.random() * 3, '#4fc3f7', 30 + Math.random() * 30));
      }
      SFX.gravityArtifact();
      this.showMessage('🌀 引力漩涡！番茄身不由己，进来蹦迪！', 200);
    } else if (a.type.id === 'chain_lightning') {
      this.chainLightningStored++;
      SFX.chainLightningArtifact();
      this.showMessage('⚡ 闪电之链！电一个传一串，番茄全家做电疗！', 200);
    } else if (a.type.id === 'repulse') {
      for (const t of this.tomatoes) {
        const dx = t.pos.x - this.egg.pos.x, dy = t.pos.y - this.egg.pos.y;
        const d = Math.hypot(dx, dy);
        if (d > 1) {
          const force = UNIT * 0.6 * Math.max(0.25, 1 - d / (UNIT * 1.2));
          t.vel = new Vec2(dx / d * force, dy / d * force);
          t.knockbackTimer = 30;
          t.flash = 20;
        }
      }
      SFX.repulse();
      // Expanding shockwave ring (drawn each frame)
      this.repulseRing = { radius: 0, maxRadius: UNIT * 2, alpha: 1, timer: 40 };
      // Ground ripple + burst particles
      for (let i = 0; i < 80; i++) {
        const a2 = Math.PI * 2 / 80 * i + Math.random() * 0.06;
        const spd = 4 + Math.random() * 10;
        const dist = Math.random();
        const hue = 200 + Math.floor(dist * 40);
        this.particles.push(acquireParticle(
          this.egg.pos.x + Math.cos(a2) * dist * 15,
          this.egg.pos.y + Math.sin(a2) * dist * 15,
          Math.cos(a2) * spd, Math.sin(a2) * spd, 3 + Math.random() * 5,
          `hsl(${hue},${Math.floor(50 + dist * 50)}%,${Math.floor(60 + dist * 35)}%)`,
          15 + Math.floor(dist * 20)));
      }
      this.showMessage('💥 斥力震波！番茄有多远滚多远，一个不留！', 200);
      HLRecorder.saveHighlight('repulse_use', '斥力震波', '💥', 6);
    } else if (a.type.id === 'tomato_apocalypse') {
      this.apocalypseTimer = 180;
      this.showMessage('🍅💥 3...', 60);
      try { SFX._tone(400, 0.15, 'sine', 0.1); } catch(e) {}
    }
    for (let i = 0; i < 12; i++) {
      const a2 = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 3;
      this.particles.push(acquireParticle(a.x, a.y, Math.cos(a2) * speed, Math.sin(a2) * speed, 3, '#ffd700', 20));
    }
  }

  generateShopItems() {
    SFX.shopOpen();
    const pool = [...SHOP_BUFFS];
    const count = Math.min(3, pool.length);
    for (let i = 0; i < count; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      this.shopItems.push(pool[idx]);
      pool.splice(idx, 1);
    }
  }

  buyShopItem(index) {
    if (index < 0 || index >= this.shopItems.length) return;
    const item = this.shopItems[index];
    if (this.gold < item.cost) return;
    this.gold -= item.cost;
    switch (item.id) {
      case 'heal':
        this.egg.maxHp++;
        this.egg.hp = this.egg.maxHp;
        break;
      case 'shield':
        this.storedShield++;
        break;
    }
    SFX.shopBuy();
    this.showMessage(`✅ ${item.name}！`, 200);
  }

  closeShop() {
    this.shopQtys = [];
    if (this.isPreShop) {
      this.isPreShop = false;
      this.state = 'playing';
      if (this.highlightRecording) HLRecorder.start();
      this.waveState = this.gameMode === 'endless' ? 'endless' : 'preparing';
      this.wavePrepTimer = 90;
      if (this.gameMode === 'challenge') {
        this.showMessage(`🎯 坚守 ${this.challengeGoal} 秒！蛋军援军正在路上！`, 200);
      } else {
        this.showMessage(`♾️ 无尽生存 · 蛋碎为止！`, 180);
      }
      return;
    }
    this.shopQtys = [];
    this.state = 'playing';
    if (this.highlightRecording) HLRecorder.start();
    if (this.gameMode === 'endless') {
      this.waveState = 'playing';
      this.spawnTimer = 0;
    } else {
      this.wave++;
      this.waveState = 'preparing';
      const basePrep = this.gameMode === 'endless' ? 40 : 80;
      this.wavePrepTimer = Math.max(25, basePrep - this.wave * 3);
    }
  }

  checkUnlocks() {
    const prev = this.currentSkin;
    if (this.skinPoints >= 1000) this.currentSkin = '溏心蛋';
    else if (this.skinPoints >= 500) this.currentSkin = '煎荷包蛋';
    else if (this.skinPoints >= 100) this.currentSkin = '茶叶蛋';
    else this.currentSkin = '普通蛋';
    if (this.currentSkin !== prev && !this.unlockedSkins.includes(this.currentSkin)) {
      this.unlockedSkins.push(this.currentSkin);
      SFX.secretUnlock();

    ctx.font = `bold ${cardH * .024}px Arial`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.fillText(`📹 精彩回放 (${HLRecorder.clips.length})`, CX, galOutY - galBtnH2 * .15);
    // Download debug data
    const dbgOutY = galOutY + SIZE * .05;
    ctx.fillStyle = '#90a4ae';
    ctx.font = `${cardH * .024}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('📥 导出调试数据', CX, dbgOutY);
    // === Footer ===
    const fLineY = cardY + cardH * .92;
    ctx.strokeStyle = 'rgba(200,200,200,.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cardX + cardW * .1, fLineY);
    ctx.lineTo(cardX + cardW * .9, fLineY);
    ctx.stroke();
    ctx.fillStyle = 'rgba(74,124,89,.5)';
    ctx.font = `bold ${cardH * .024}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText('🥚 蛋蛋快跑 · 🍅 番茄大追杀', CX, cardY + cardH * .96);
  }  getSystemInfo() {
    const ua = navigator.userAgent;
    let platform = 'unknown';
    if (/android/i.test(ua)) platform = 'android';
    else if (/iphone|ipad|ipod/i.test(ua)) platform = 'ios';
    else if (/win/i.test(ua)) platform = 'windows';
    else if (/mac/i.test(ua)) platform = 'macos';
    else if (/linux/i.test(ua)) platform = 'linux';
    let browser = 'unknown';
    if (/micromessenger/i.test(ua)) browser = 'wechat';
    else if (/edg/i.test(ua)) browser = 'edge';
    else if (/chrome/i.test(ua) && !/edg/i.test(ua)) browser = 'chrome';
    else if (/safari/i.test(ua) && !/chrome/i.test(ua) && !/edg/i.test(ua) && !/micromessenger/i.test(ua)) browser = 'safari';
    else if (/firefox/i.test(ua)) browser = 'firefox';
    else if (/crios/i.test(ua)) browser = 'chrome';
    else if (/fxios/i.test(ua)) browser = 'firefox';
    const isMobile = /mobile|android|iphone|ipad|ipod/i.test(ua);
    const screenW = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
    const screenH = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
    return { platform, browser, isMobile, userAgent: ua, screenWidth: screenW, screenHeight: screenH };
  }

  pushDebugData() {
    const sys = this.getSystemInfo();
    const r = this.debugInfo.record;
    const artTypes = this._artifactTypes || [];
    const artTotalW = artTypes.reduce((s, t) => s + t.weight, 0);
    const summary = r.length > 0 ? {
      survivalTime: this.survivalTime,
      frames: r.length,
      avgDt: (r.reduce((s, f) => s + f.dt, 0) / r.length).toFixed(3),
      avgFps: r.length > 0 ? r[r.length - 1].fps : 0,
      tomatoesKilled: this.sessionKills,
      goldEarned: this.gold,
      jumps: r.filter(f => f.jumping).length,
      avgVel: (r.reduce((s, f) => s + Math.abs(f.vx) + Math.abs(f.vy), 0) / r.length).toFixed(1),
      artifactWeights: Object.fromEntries(artTypes.map(t => [t.label, { w: t.weight, pct: artTotalW > 0 ? (t.weight / artTotalW * 100).toFixed(1) + '%' : '0%' }])),
    } : { survivalTime: this.survivalTime, gold: this.gold, kills: this.sessionKills };
    const gameState = {
      gold: this.gold, skinPoints: this.skinPoints, currentSkin: this.currentSkin,
      wave: this.wave, difficulty: this.difficulty,
      survivalTime: this.survivalTime, hp: this.egg?.hp, maxHp: this.egg?.maxHp,
      state: this.state, gameMode: this.gameMode,
      comboCount: this.comboCount, maxCombo: this.maxCombo
    };
    const recorderState = HLRecorder._recording ? (() => { const s = HLRecorder.getStats(); return { recording: true, active: s.active, inUse: s.inUse, chunks: s.chunks, bytes: s.bytes, mime: s.codec }; })() : { recording: false };
    const highlights = HLRecorder.clips.map(c => ({ type: c.type, label: c.label, icon: c.icon, timestamp: c.timestamp, duration: c.duration, bytes: c.blob?.size || 0, mime: c.blob?.type || '' }));
    const platformTag = sys.platform + '_' + sys.browser;
    const dataStr = JSON.stringify({ system: sys, summary, gameState, frames: r.slice(-300), errors: this.debugInfo.errors, audioLog: this.debugInfo.audioLog, recorderState, highlights, ts: Date.now(), platformTag });
    const serverUrl = window.location.origin;
    fetch(serverUrl + '/api/debug', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: dataStr,
    }).then(res => res.json()).then(data => {
      if (data.ok) {
        this.debugInfo.record = [];
        this.debugInfo.audioLog = [];
        this.debugPendingDownload = null;
        this.lastTapX = 0;
        this.lastTapY = 0;
      }
    }).catch(() => {
      this.debugPendingDownload = dataStr;
      this.showMessage('📥 点击"下载调试数据"按钮保存文件', 180);
    });
  }

  drawHighlightGallery() {
    ctx.fillStyle = 'rgba(0,0,0,.75)';
    ctx.fillRect(0, 0, CW, CH);
    const clips = HLRecorder.clips;
    const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    const _s = SIZE * (isMobile ? 1.3 : 1.0);
    const cardW = _s * .75, cardH = _s * .6;
    const cx = CX, cy = CY;
    const scrollY = this._galleryScrollY || 0;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.3)';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.roundRect(cx - cardW / 2, cy - cardH / 2, cardW, cardH, 16);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
    ctx.fillStyle = '#4fc3f7';
    ctx.font = `bold ${_s * .045}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText('📹 精彩回放', cx, cy - cardH / 2 + _s * .07);
    const closeX = cx + cardW / 2 - _s * .05;
    const closeY = cy - cardH / 2 + _s * .05;
    ctx.fillStyle = '#e0e0e0';
    ctx.beginPath();
    ctx.roundRect(closeX - _s * .025, closeY - _s * .025, _s * .05, _s * .05, 6);
    ctx.fill();
    ctx.fillStyle = '#999';
    ctx.font = `bold ${_s * .03}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✕', closeX, closeY);
    const listY = cy - cardH / 2 + _s * .12;
    const listH = cardH - _s * .22;
    const itemH = _s * .075;
    const totalListH = clips.length * itemH;
    const maxScroll = Math.max(0, totalListH - listH);
    if (scrollY > maxScroll) { this._galleryScrollY = maxScroll; }
    if (scrollY < 0) { this._galleryScrollY = 0; }
    const clampedScroll = this._galleryScrollY || 0;
    ctx.save();
    ctx.beginPath();
    ctx.rect(cx - cardW / 2 + _s * .04, listY, cardW - _s * .08, listH);
    ctx.clip();
    if (clips.length === 0) {
      ctx.fillStyle = '#bbb';
      ctx.font = `${_s * .028}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText('暂无精彩回放', cx, listY + listH / 2);
    } else {
      for (let i = 0; i < clips.length; i++) {
        const c = clips[i];
        const iy = listY + i * itemH - clampedScroll;
        if (iy + itemH < listY || iy > listY + listH) continue;
        ctx.fillStyle = i % 2 === 0 ? '#f5f9ff' : '#fff';
        ctx.beginPath();
        ctx.roundRect(cx - cardW / 2 + _s * .04, iy, cardW - _s * .08, itemH - 4, 8);
        ctx.fill();
        ctx.font = `${_s * .032}px Arial`;
        ctx.textAlign = 'left';
        ctx.fillText(c.icon || '📹', cx - cardW / 2 + _s * .07, iy + itemH * .55);
        ctx.fillStyle = '#333';
        ctx.font = `bold ${_s * .022}px Arial`;
        ctx.fillText(c.label || c.type, cx - cardW / 2 + _s * .13, iy + itemH * .42);
        ctx.fillStyle = '#999';
        ctx.font = `${_s * .015}px Arial`;
        const d = new Date(c.timestamp);
        const ts = `${d.getMonth()+1}/${d.getDate()} ${('0'+d.getHours()).slice(-2)}:${('0'+d.getMinutes()).slice(-2)}:${('0'+d.getSeconds()).slice(-2)}`;
        ctx.fillText(ts, cx - cardW / 2 + _s * .13, iy + itemH * .72);
        ctx.fillStyle = '#aaa';
        ctx.font = `${_s * .015}px Arial`;
        ctx.fillText(`${Math.round(c.duration || 10)}s`, cx + cardW / 2 - _s * .29, iy + itemH * .55);
        ctx.fillStyle = '#4fc3f7';
        ctx.beginPath();
        ctx.roundRect(cx + cardW / 2 - _s * .245, iy + itemH * .12, _s * .055, itemH * .76, 6);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${_s * .022}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('▶', cx + cardW / 2 - _s * .2175, iy + itemH * .5);
        ctx.fillStyle = '#81c784';
        ctx.beginPath();
        ctx.roundRect(cx + cardW / 2 - _s * .175, iy + itemH * .12, _s * .055, itemH * .76, 6);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = `${_s * .02}px Arial`;
        ctx.textBaseline = 'middle';
        ctx.fillText('⬇', cx + cardW / 2 - _s * .1475, iy + itemH * .5);
        ctx.fillStyle = '#ef9a9a';
        ctx.beginPath();
        ctx.roundRect(cx + cardW / 2 - _s * .105, iy + itemH * .12, _s * .055, itemH * .76, 6);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = `${_s * .02}px Arial`;
        ctx.fillText('✕', cx + cardW / 2 - _s * .0775, iy + itemH * .5);
      }
    }
    ctx.restore();
    if (maxScroll > 0) {
      const sbW = _s * .012, sbX = cx + cardW / 2 - _s * .02;
      ctx.fillStyle = 'rgba(0,0,0,.1)';
      ctx.beginPath();
      ctx.roundRect(sbX, listY, sbW, listH, sbW / 2);
      ctx.fill();
      const thumbH = Math.max(_s * .02, listH * (listH / totalListH));
      const thumbY = listY + (clampedScroll / maxScroll) * (listH - thumbH);
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath();
      ctx.roundRect(sbX, thumbY, sbW, thumbH, sbW / 2);
      ctx.fill();
    }
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'center';
    {
      const clearY = cy + cardH / 2 - _s * .05;
      const hasClips = clips.length > 0;
      ctx.fillStyle = hasClips ? '#e53935' : '#e0e0e0';
      ctx.beginPath();
      ctx.roundRect(cx - _s * .08, clearY - _s * .022, _s * .16, _s * .044, 8);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${_s * .02}px Arial`;
      ctx.textBaseline = 'middle';
      ctx.fillText(hasClips ? '🗑️ 清空所有' : '暂无回放', cx, clearY);
    }
  }

  _handleGalleryClick(x, y) {
    const clips = HLRecorder.clips;
    const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    const _s = SIZE * (isMobile ? 1.3 : 1.0);
    const cardW = _s * .75, cardH = _s * .6;
    const cx = CX, cy = CY;
    const scrollY = this._galleryScrollY || 0;
    const closeX = cx + cardW / 2 - _s * .05;
    const closeY = cy - cardH / 2 + _s * .05;
    if (x > closeX - _s * .025 && x < closeX + _s * .025 && y > closeY - _s * .025 && y < closeY + _s * .025) {
      this.showHighlightGallery = false; return;
    }
    const listY = cy - cardH / 2 + _s * .12;
    const listH = cardH - _s * .22;
    const itemH = _s * .075;
    const totalListH = clips.length * itemH;
    const maxScroll = Math.max(0, totalListH - listH);
    const clampedScroll = this._galleryScrollY || 0;
    if (maxScroll > 0) {
      const sbW = _s * .012, sbX = cx + cardW / 2 - _s * .02;
      if (x > sbX && x < sbX + sbW && y > listY && y < listY + listH) {
        this._galleryScrollY = ((y - listY) / listH) * maxScroll;
        return;
      }
    }
    const clearY = cy + cardH / 2 - _s * .05;
    if (clips.length > 0 && x > cx - _s * .08 && x < cx + _s * .08 && y > clearY - _s * .022 && y < clearY + _s * .022) {
      if (confirm(`确定清空所有 ${clips.length} 个精彩回放吗？`)) {
        for (const c of clips) HLRecorder.deleteClipFromList(c.id);
      }
      return;
    }
    for (let i = 0; i < clips.length; i++) {
      const iy = listY + i * itemH - clampedScroll;
      if (iy + itemH < listY || iy > listY + listH) continue;
      const playX = cx + cardW / 2 - _s * .245;
      const dlX = cx + cardW / 2 - _s * .175;
      const delX = cx + cardW / 2 - _s * .105;
      const btnW = _s * .055;
      if (x > playX && x < playX + btnW && y > iy + itemH * .12 && y < iy + itemH * .12 + itemH * .76) {
        HLRecorder.playClip(clips[i]); return;
      }
      if (x > dlX && x < dlX + btnW && y > iy + itemH * .12 && y < iy + itemH * .12 + itemH * .76) {
        HLRecorder.downloadClip(clips[i]); return;
      }
      if (x > delX && x < delX + btnW && y > iy + itemH * .12 && y < iy + itemH * .12 + itemH * .76) {
        if (confirm(`确定删除此精彩回放吗？`)) HLRecorder.deleteClipFromList(clips[i].id);
        return;
      }
    }
  }

    const ts = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '_' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0') + String(d.getSeconds()).padStart(2,'0');
    a.download = `egg_debug_${sys.platform}_${sys.browser}_${ts}.json`;
    a.style.display = 'none';

    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);

  }

  downloadDebugFile() {
    if (!this.debugPendingDownload) return;
    try {
      const blob = new Blob([this.debugPendingDownload], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const sys = this.getSystemInfo();
      const d = new Date();
      const ts = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '_' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0') + String(d.getSeconds()).padStart(2,'0');
      a.download = `egg_debug_${sys.platform}_${sys.browser}_${ts}.json`;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);

  gameOver() {
    this.pushDebugData();
    HLRecorder.stop();
    this.survivalHistory.push(Math.floor(this.survivalTime));
    if (this.survivalHistory.length > 50) this.survivalHistory.shift();
    this.state = 'gameover';
    SFX.stopBGM();
    SFX.gameOver();
    const secs = Math.floor(this.survivalTime);
    if (secs > this.bestTime) {
      this.bestTime = secs;
    }
    this.totalGamesPlayed++;
    this.totalSurvivalTime += this.survivalTime;
    if (!this.splashUsedThisRound && this.survivalTime > this.bestNoSplashTime) {
      this.bestNoSplashTime = this.survivalTime;
    }
    if (this.perfectRoundThisRound && this.survivalTime > this.bestPerfectTime) {
      this.bestPerfectTime = this.survivalTime;
    }
    this.checkAchievements();
    this.saveProgress();
  }

  drawShopField() {
    ctx.fillStyle = '#f5f5f5';
    ctx.fillRect(0, 0, CW, CH);
    const pw = CW - PLATE_MARGIN * 2, ph = CH - PLATE_MARGIN * 2;
    ctx.shadowColor = 'rgba(0,0,0,.1)';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.roundRect(PLATE_MARGIN, PLATE_MARGIN, pw, ph, 14);
    ctx.fillStyle = '#fafffe';
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.roundRect(PLATE_MARGIN, PLATE_MARGIN, pw, ph, 14);
    ctx.strokeStyle = '#c8e6c9';
    ctx.lineWidth = 3;
    ctx.stroke();
    for (let t of this.tomatoes) t.draw();
    this.egg.draw();
    for (let p of this.particles) p.draw();
  }

  drawShop() {
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fillRect(0, 0, CW, CH);
    const sw = SIZE * .88, sh = SIZE * .7;
    const sx = CX - sw / 2, sy = CY - sh / 2;
    // Panel backdrop — fully rounded, warm pastel
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.4)';
    ctx.shadowBlur = 50;
    ctx.shadowOffsetY = 8;
    ctx.fillStyle = '#fffaed';
    ctx.beginPath();
    ctx.roundRect(sx, sy, sw, sh, 24);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#ffdbb5';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(sx, sy, sw, sh, 24);
    ctx.stroke();
    // Cute header banner — no sharp corners
    ctx.fillStyle = '#ffb174';
    ctx.beginPath();
    ctx.roundRect(sx + SIZE * .04, sy + SIZE * .03, sw - SIZE * .08, SIZE * .09, 16);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${SIZE * .045}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🏪 金币商店', CX, sy + SIZE * .075);
    // Gold display — cute pill
    ctx.save();
    ctx.shadowColor = 'rgba(255,183,77,.4)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#ffe0b2';
    ctx.beginPath();
    ctx.roundRect(CX - SIZE * .14, sy + SIZE * .135, SIZE * .28, SIZE * .042, 21);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#e65100';
    ctx.font = `bold ${SIZE * .024}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`💰 ${this.gold}`, CX, sy + SIZE * .156);
    // Subtitle
    ctx.fillStyle = '#bcaaa4';
    ctx.font = `${SIZE * .02}px Arial`;
    ctx.fillText(this.isPreShop ? '出发前选购物资' : (this.gameMode === 'endless' ? '每30秒购物机会' : '每5波购物机会'), CX, sy + SIZE * .195);
    // Item cards — 2 columns, fully rounded
    const cardW = SIZE * .32;
    const cardH = SIZE * .29;
    const cardGap = SIZE * .05;
    const totalW2 = cardW * 2 + cardGap;
    const startX2 = CX - totalW2 / 2;
    const cardY = sy + SIZE * .215;
    const maxQty = 99;
    for (let i = 0; i < 2; i++) {
      const cx2 = startX2 + i * (cardW + cardGap);
      if (i < this.shopItems.length) {
        const item = this.shopItems[i];
        const qty = this.shopQtys[i] || 0;
        const canAffordMore = this.gold >= (qty + 1) * item.cost;
        // Card shadow
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,.1)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 3;
        // Card fill — pastel gradient
        const grad = ctx.createLinearGradient(cx2, cardY, cx2, cardY + cardH);
        if (qty > 0) {
          grad.addColorStop(0, '#e8eaf6');
          grad.addColorStop(1, '#c5cae9');
        } else if (this.gold >= item.cost) {
          grad.addColorStop(0, '#fff8e1');
          grad.addColorStop(1, '#ffecb3');
        } else {
          grad.addColorStop(0, '#f5f5f5');
          grad.addColorStop(1, '#e0e0e0');
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(cx2, cardY, cardW, cardH, 16);
        ctx.fill();
        ctx.restore();
        // Card border
        ctx.strokeStyle = qty > 0 ? '#7986cb' : (this.gold >= item.cost ? '#ffcc02' : '#cfd8dc');
        ctx.lineWidth = qty > 0 ? 2.5 : 1.5;
        ctx.beginPath();
        ctx.roundRect(cx2, cardY, cardW, cardH, 16);
        ctx.stroke();
        // Icon circle — cute pastel
        const iconR = SIZE * .042;
        const iconCX = cx2 + cardW / 2;
        const iconCY = cardY + SIZE * .065;
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,.08)';
        ctx.shadowBlur = 6;
        ctx.fillStyle = qty > 0 ? '#c5cae9' : (this.gold >= item.cost ? '#fff3cd' : '#eee');
        ctx.beginPath();
        ctx.arc(iconCX, iconCY, iconR, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.font = `${SIZE * .03}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(item.icon, iconCX, iconCY);
        // Item name + desc
        ctx.fillStyle = qty > 0 ? '#283593' : (this.gold >= item.cost ? '#4e342e' : '#999');
        ctx.font = `bold ${SIZE * .028}px Arial`;
        ctx.textBaseline = 'middle';
        ctx.fillText(item.name, iconCX, cardY + SIZE * .125);
        ctx.fillStyle = qty > 0 ? '#5c6bc0' : (this.gold >= item.cost ? '#8d6e63' : '#bbb');
        ctx.font = `${SIZE * .017}px Arial`;
        ctx.fillText(item.desc, iconCX, cardY + SIZE * .16);
        ctx.fillStyle = this.gold >= item.cost ? '#e65100' : '#ccc';
        ctx.font = `bold ${SIZE * .019}px Arial`;
        ctx.fillText(`💰 ${item.cost}/个`, iconCX, cardY + SIZE * .195);
        // - / qty / + row — bigger, cuter buttons
        const rowY = cardY + SIZE * .24;
        const btnR = SIZE * .03;
        const minusX2 = cx2 + cardW * 0.22;
        const plusX2 = cx2 + cardW * 0.78;
        const qtyX2 = cx2 + cardW / 2;
        // Minus button
        const canMinus = qty > 0;
        ctx.save();
        ctx.shadowColor = canMinus ? 'rgba(239,154,154,.5)' : 'transparent';
        ctx.shadowBlur = 6;
        ctx.fillStyle = canMinus ? '#ef9a9a' : '#e0e0e0';
        ctx.beginPath();
        ctx.arc(minusX2, rowY, btnR, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = canMinus ? '#fff' : '#bbb';
        ctx.font = `bold ${SIZE * .022}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('−', minusX2, rowY);
        // Quantity number
        ctx.fillStyle = qty > 0 ? '#283593' : '#999';
        ctx.font = `bold ${SIZE * .034}px Arial`;
        ctx.fillText(`${qty}`, qtyX2, rowY);
        // Plus button
        const canPlus = qty < maxQty && canAffordMore;
        ctx.save();
        ctx.shadowColor = canPlus ? 'rgba(165,214,167,.5)' : 'transparent';
        ctx.shadowBlur = 6;
        ctx.fillStyle = canPlus ? '#81c784' : '#e0e0e0';
        ctx.beginPath();
        ctx.arc(plusX2, rowY, btnR, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = canPlus ? '#fff' : '#bbb';
        ctx.font = `bold ${SIZE * .022}px Arial`;
        ctx.fillText('+', plusX2, rowY);
        ctx.textBaseline = 'alphabetic';
      }
    }
    // Bottom bar: subtotal / buy / continue
    const totalCost = this.shopQtys.reduce((s, q, i) => s + q * (this.shopItems[i]?.cost || 0), 0);
    const canBuy = totalCost > 0 && this.gold >= totalCost;
    const barY = sy + sh - SIZE * .12;
    const barH = SIZE * .075;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.05)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = canBuy ? '#e8f5e9' : (totalCost > 0 ? '#fce4ec' : '#f5f5f5');
    ctx.beginPath();
    ctx.roundRect(sx + SIZE * .03, barY, sw - SIZE * .06, barH, 12);
    ctx.fill();
    ctx.restore();
    // Total cost
    ctx.fillStyle = canBuy ? '#2e7d32' : (totalCost > 0 ? '#c62828' : '#999');
    ctx.font = `bold ${SIZE * .024}px Arial`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(`总计`, sx + SIZE * .07, barY + barH / 2);
    ctx.textAlign = 'center';
    ctx.fillText(`💰 ${totalCost}`, sx + SIZE * .18, barY + barH / 2);
    // Buy button (right side)
    const buyW = SIZE * .16;
    const continueW = SIZE * .16;
    const continueX = CX + sw / 2 - continueW - SIZE * .06;
    const buyBtnX = continueX - buyW - SIZE * .025;
    ctx.save();
    ctx.shadowColor = canBuy ? 'rgba(102,187,106,.3)' : 'transparent';
    ctx.shadowBlur = 8;
    ctx.fillStyle = canBuy ? '#66bb6a' : '#cfd8dc';
    ctx.beginPath();
    ctx.roundRect(buyBtnX, barY + (barH - SIZE * .05) / 2, buyW, SIZE * .05, 8);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = canBuy ? '#fff' : '#999';
    ctx.font = `bold ${SIZE * .022}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('购买', buyBtnX + buyW / 2, barY + barH / 2);
    // Continue button
    ctx.save();
    ctx.shadowColor = 'rgba(129,199,132,.3)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = canBuy ? '#a5d6a7' : '#81c784';
    ctx.beginPath();
    ctx.roundRect(continueX, barY + (barH - SIZE * .05) / 2, continueW, SIZE * .05, 8);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${SIZE * .022}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.isPreShop ? '开始战斗 ▶' : '继续 ▶', continueX + continueW / 2, barY + barH / 2);
    ctx.textBaseline = 'alphabetic';
  }

  drawSkinPreview(x, y, r, skinName) {
    const colors = { 普通蛋: ['#ebd6b0','#c9a87c'], 溏心蛋: ['#fff5cc','#ffb300'], 煎荷包蛋: ['#fff','#ff8f00'], 茶叶蛋: ['#c4956a','#6d4c00'] };
    const [base, shadow] = colors[skinName] || colors.普通蛋;
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x, y, r * 1.1, r * 1.15, 0, 0, Math.PI * 2);
    ctx.fillStyle = shadow;
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x, y - r * .05, r * 1.05, r * 1.1, 0, 0, Math.PI * 2);
    ctx.fillStyle = base;
    ctx.fill();
    // 3D shading
    const g = ctx.createRadialGradient(x - r * .25, y - r * .3, 0, x, y, r * 1.0);
    g.addColorStop(0, 'rgba(255,255,255,.2)');
    g.addColorStop(.4, 'rgba(255,255,255,0)');
    g.addColorStop(.7, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,.1)');
    ctx.fillStyle = g;
    ctx.fill();
    // Glossy highlight
    ctx.beginPath();
    ctx.ellipse(x - r * .25, y - r * .4, r * .2, r * .09, -0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.fill();
    if (skinName === '煎荷包蛋') {
      ctx.beginPath();
      ctx.arc(x, y + r * .05, r * .55, 0, Math.PI * 2);
      ctx.fillStyle = '#ffb300';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y + r * .05, r * .45, 0, Math.PI * 2);
      ctx.fillStyle = '#ff8f00';
      ctx.fill();
    } else if (skinName === '溏心蛋') {
      ctx.fillStyle = '#ffb300';
      ctx.beginPath();
      ctx.arc(x, y + r * .02, r * .4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff8f00';
      ctx.beginPath();
      ctx.arc(x, y + r * .02, r * .3, 0, Math.PI * 2);
      ctx.fill();
    }
    // Eyes
    const eyeY = y - r * .12;
    const eyeSep = r * .28;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(x - eyeSep, eyeY, r * .15, r * .18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + eyeSep, eyeY, r * .15, r * .18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(x - eyeSep, eyeY, r * .09, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + eyeSep, eyeY, r * .09, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x - eyeSep - r * .03, eyeY - r * .04, r * .035, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + eyeSep - r * .03, eyeY - r * .04, r * .035, 0, Math.PI * 2);
    ctx.fill();
    // Blush
    ctx.fillStyle = 'rgba(255,140,140,.25)';
    ctx.beginPath();
    ctx.ellipse(x - r * .36, y + r * .08, r * .14, r * .09, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + r * .36, y + r * .08, r * .14, r * .09, 0, 0, Math.PI * 2);
    ctx.fill();
    // Mouth
    ctx.fillStyle = '#e07040';
    ctx.beginPath();
    ctx.moveTo(x - r * .08, y + r * .14);
    ctx.quadraticCurveTo(x, y + r * .22, x + r * .08, y + r * .14);
    ctx.lineTo(x - r * .08, y + r * .14);
    ctx.fill();
    ctx.restore();
  }

  drawCuteTomato(x, y, r) {
    ctx.save();
    // Body (red circle)
    const grad = ctx.createRadialGradient(x - r * .25, y - r * .3, 0, x, y, r);
    grad.addColorStop(0, '#ff8a80');
    grad.addColorStop(.5, '#ef5350');
    grad.addColorStop(1, '#c62828');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    // 3D shading
    const grad2 = ctx.createRadialGradient(x - r * .25, y - r * .3, 0, x, y, r);
    grad2.addColorStop(0, 'rgba(255,255,255,.25)');
    grad2.addColorStop(.4, 'rgba(255,255,255,0)');
    grad2.addColorStop(.7, 'rgba(0,0,0,0)');
    grad2.addColorStop(1, 'rgba(0,0,0,.12)');
    ctx.fillStyle = grad2;
    ctx.fill();
    // Glossy highlight
    ctx.beginPath();
    ctx.ellipse(x - r * .25, y - r * .35, r * .2, r * .08, -0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    ctx.fill();
    // Stem
    ctx.fillStyle = '#43a047';
    ctx.beginPath();
    ctx.ellipse(x, y - r * .88, r * .1, r * .18, 0, 0, Math.PI * 2);
    ctx.fill();
    // Leaves
    ctx.fillStyle = '#66bb6a';
    ctx.beginPath();
    ctx.ellipse(x - r * .15, y - r * .85, r * .2, r * .07, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + r * .15, y - r * .85, r * .2, r * .07, 0.5, 0, Math.PI * 2);
    ctx.fill();
    // Crying eyes (downward arcs ∩ ∩)
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = r * .1;
    ctx.lineCap = 'round';
    const eyeSep = r * .26;
    const eyeY = y - r * .12;
    ctx.beginPath();
    ctx.arc(x - eyeSep, eyeY + r * .04, r * .13, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + eyeSep, eyeY + r * .04, r * .13, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
    // Blush
    ctx.fillStyle = 'rgba(255,100,100,.25)';
    ctx.beginPath();
    ctx.ellipse(x - r * .36, y + r * .22, r * .16, r * .09, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + r * .36, y + r * .22, r * .16, r * .09, 0, 0, Math.PI * 2);
    ctx.fill();
    // Sad wobbly mouth
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = r * .08;
    ctx.beginPath();
    ctx.arc(x, y + r * .42, r * .08, Math.PI * 1.2, Math.PI * 1.8);
    ctx.stroke();
    // Big teardrop
    ctx.fillStyle = 'rgba(100,180,255,.5)';
    ctx.beginPath();
    ctx.ellipse(x + r * .32, eyeY + r * .14, r * .05, r * .09, 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + r * .32, eyeY);
    ctx.quadraticCurveTo(x + r * .40, eyeY + r * .12, x + r * .32, eyeY + r * .16);
    ctx.quadraticCurveTo(x + r * .24, eyeY + r * .12, x + r * .32, eyeY);
    ctx.fill();
    ctx.restore();
  }

    pctx.strokeStyle = '#5d4037';
    pctx.lineWidth = r * .08;
    pctx.beginPath();
    pctx.arc(x, y + r * .42, r * .08, Math.PI * 1.2, Math.PI * 1.8);
    pctx.stroke();
    pctx.fillStyle = 'rgba(100,180,255,.5)';
    pctx.beginPath();
    pctx.ellipse(x + r * .32, eyeY + r * .14, r * .05, r * .09, 0.1, 0, Math.PI * 2);
    pctx.fill();
    pctx.beginPath();
    pctx.moveTo(x + r * .32, eyeY);
    pctx.quadraticCurveTo(x + r * .40, eyeY + r * .12, x + r * .32, eyeY + r * .16);
    pctx.quadraticCurveTo(x + r * .24, eyeY + r * .12, x + r * .32, eyeY);
    pctx.fill();
  }

  resetData() {
    if (confirm('确定重置所有数据吗？（分数、皮肤、成就、记录全部清零）')) {
      localStorage.removeItem('egg_defense');
      localStorage.removeItem('egghasPlayed');
      this.unlockedSkins = ['普通蛋'];
      this.skinPoints = 0;
      this.maxCombo = 0;
      this.bestTime = 0;
      this.currentSkin = '普通蛋';
      this.achievements = [];
      this.totalKills = 0;
      this.totalSurvivalTime = 0;
      this.totalGamesPlayed = 0;
      this.bestNoSplashTime = 0;
      this.bestPerfectTime = 0;
      this.bonusHp = 0;
      this.gold = 0;
      this.claimedMilestones = [];
    this.survivalHistory = [];
    this.showHighlightGallery = false;
    this._galleryScrollY = 0;
      // Also clear server save file
      try { fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => {}); } catch(e) {}
    }
  }

  handleClick(x, y) {
    if (this.showHighlightGallery) {
      this._handleGalleryClick(x, y);
      this.draw();
      return;
    }
    // Tutorial overlay intercepts all clicks (with 300ms debounce)
    if (this.showTutorial) {
      const now2 = Date.now();
      if (this._lastTutClick && now2 - this._lastTutClick < 300) {
        this.logError('tutorial_debounce_skip', `index=${this.tutorialIndex} elapsed=${now2 - this._lastTutClick}ms`);
        return;
      }
      this.logError('tutorial_advance', `from=${this.tutorialIndex} state=${this.state}`);
      this._lastTutClick = now2;
      this.tutorialIndex++;
      if (this.tutorialIndex >= TUTORIAL_CARDS.length) {
        this.showTutorial = false;
        try { localStorage.setItem('egghasPlayed', '1'); } catch(e) {}
      }
      return;
    }
    if (this.state === 'menu') {
      const V = Math.max(SIZE, CH * .7);
      // Top-left toggle buttons: sound + debug
      const toggleSize = SIZE * .07;
      const togglePad = SIZE * .02;
      const toggleY = togglePad;
      const soundX = togglePad;
      const debugX = soundX + toggleSize + togglePad * .5;
      if (x > soundX && x < soundX + toggleSize && y > toggleY && y < toggleY + toggleSize) {
        SFX.muted = !SFX.muted;
        if (SFX.muted) SFX.stopBGM();
        this.saveSettings();
        this.draw();
        return;
      }
      if (x > debugX && x < debugX + toggleSize && y > toggleY && y < toggleY + toggleSize) {
        this.debugInfo.showDebug = !this.debugInfo.showDebug;
        this.saveSettings();
        this.draw();
        return;
      }
      const joyX = debugX + toggleSize + togglePad * .5;
      if (x > joyX && x < joyX + toggleSize && y > toggleY && y < toggleY + toggleSize) {
        this.joystickEnabled = !this.joystickEnabled;
        this.saveSettings();
        this.draw();
        return;
      }
      const recX = joyX + toggleSize + togglePad * .5;
      if (x > recX && x < recX + toggleSize && y > toggleY && y < toggleY + toggleSize) {
        this.highlightRecording = !this.highlightRecording;
        this.saveSettings();
        this.draw();
        return;
      }
      const modeBtnW = SIZE * .16, modeBtnH = SIZE * .055;
      const modeBtnY = CY + V * .17, modeGap = SIZE * .02;
      const chalX = CX - modeBtnW - modeGap / 2;
      const endX = CX + modeGap / 2;
      // Challenge button
      if (y > modeBtnY && y < modeBtnY + modeBtnH && x > chalX && x < chalX + modeBtnW) {
        this.gameMode = 'challenge';
        return;
      }
      // Endless button
      if (y > modeBtnY && y < modeBtnY + modeBtnH && x > endX && x < endX + modeBtnW) {
        this.gameMode = 'endless';
        return;
      }
      // Start button
      const startBtnY = CY + V * .24;
      const startBtnH = SIZE * .07;
      if (x > CX - SIZE * .18 && x < CX + SIZE * .18 && y > startBtnY && y < startBtnY + startBtnH) {
        this.startGame();
      }
      // Reset data
      const resetY = startBtnY + startBtnH + SIZE * .06;
      const resetH = SIZE * .035;
      if (y > resetY - resetH && y < resetY + resetH / 2 && x > CX - SIZE * .1 && x < CX + SIZE * .1) {
        this.resetData();
      }
    } else if (this.state === 'shop' || this.state === 'preshop') {
      const sw = SIZE * .88, sh = SIZE * .7;
      const sx = CX - sw / 2, sy = CY - sh / 2;
      const cardW = SIZE * .32;
      const cardGap = SIZE * .05;
      const totalW2 = cardW * 2 + cardGap;
      const startX2 = CX - totalW2 / 2;
      const cardY = sy + SIZE * .215;
      const maxQty = 99;
      const btnR = SIZE * .03;
      // +/- buttons on each item
      for (let i = 0; i < this.shopItems.length; i++) {
        const cx2 = startX2 + i * (cardW + cardGap);
        const qty = this.shopQtys[i] || 0;
        const rowY = cardY + SIZE * .24;
        const minusX2 = cx2 + cardW * 0.22;
        const plusX2 = cx2 + cardW * 0.78;
        if (x > minusX2 - btnR && x < minusX2 + btnR && y > rowY - btnR && y < rowY + btnR) {
          if (qty > 0) {
            this.shopQtys[i] = qty - 1;
            this.draw();
          }
          return;
        }
        if (x > plusX2 - btnR && x < plusX2 + btnR && y > rowY - btnR && y < rowY + btnR) {
          const canAffordMore = this.gold >= (qty + 1) * this.shopItems[i].cost;
          if (qty < maxQty && canAffordMore) {
            this.shopQtys[i] = qty + 1;
            this.draw();
          }
          return;
        }
      }
      const barY = sy + sh - SIZE * .12;
      const barH = SIZE * .075;
      const totalCost = this.shopQtys.reduce((s, q, i) => s + q * (this.shopItems[i]?.cost || 0), 0);
      const canBuy = totalCost > 0 && this.gold >= totalCost;
      const continueW = SIZE * .16;
      const continueX = CX + sw / 2 - continueW - SIZE * .06;
      const buyW = SIZE * .16;
      // Buy button
      const buyBtnX = continueX - buyW - SIZE * .025;
      if (canBuy && x > buyBtnX && x < buyBtnX + buyW && y > barY + (barH - SIZE * .05) / 2 && y < barY + (barH + SIZE * .05) / 2) {
        for (let i = 0; i < this.shopItems.length; i++) {
          const qty = this.shopQtys[i] || 0;
          for (let n = 0; n < qty; n++) this.buyShopItem(i);
        }
        this.shopQtys = this.shopItems.map(() => 0);
        return;
      }
      // Continue button
      if (x > continueX && x < continueX + continueW && y > barY + (barH - SIZE * .05) / 2 && y < barY + (barH + SIZE * .05) / 2) {
        this.closeShop();
      }
    } else if (this.state === 'gameover') {
      const V = Math.max(SIZE, CH * .7);
      const btnW = SIZE * .4;
      if (x > CX - btnW / 2 && x < CX + btnW / 2 && y > CY + V * .10 && y < CY + V * .10 + SIZE * .08) {
        this.setState('playing');
      }
      if (x > CX - btnW / 2 && x < CX + btnW / 2 && y > CY + V * .23 && y < CY + V * .23 + SIZE * .07) {
        this.sharePoster();
      }
      const galBtnH = SIZE * .055;
      const galBtnW = SIZE * .28;
      const galBtnY = CY + V * .35;
      if (x > CX - galBtnW / 2 && x < CX + galBtnW / 2 && y > galBtnY - galBtnH * .65 && y < galBtnY - galBtnH * .65 + galBtnH) {
        this._galleryTouchStartY = undefined; this.showHighlightGallery = true;
      }
      const dbgY = galBtnY + SIZE * .05;
      if (x > CX - SIZE * .14 && x < CX + SIZE * .14 && y > dbgY - SIZE * .012 && y < dbgY + SIZE * .012) {
        this.downloadDebugData();
      }
    } else if (this.state === 'victoryscreen') {
      const cardH = CH * .72;
      const cardW = Math.min(CW * .85, cardH * .58);
      const cardY = CY - cardH / 2;
      const btnW = cardW * .38, btnGap = cardW * .04, btnH = cardH * .078;
      const btnY = cardY + cardH * .83;
      const leftL = CX - btnW - btnGap / 2, leftR = CX - btnGap / 2;
      const rightL = CX + btnGap / 2, rightR = CX + btnW + btnGap / 2;
      if (x > leftL && x < leftR && y > btnY && y < btnY + btnH) {
        this.setState('playing');
      }
      if (x > rightL && x < rightR && y > btnY && y < btnY + btnH) {
        this.sharePoster();
      }
      const galBtnH2 = cardH * .04;
      const galBtnW2 = cardW * .32;
      const galOutY = cardY + cardH + SIZE * .08;
      if (x > CX - galBtnW2 / 2 && x < CX + galBtnW2 / 2 && y > galOutY - galBtnH2 * .65 && y < galOutY - galBtnH2 * .65 + galBtnH2) {
        this._galleryTouchStartY = undefined; this.showHighlightGallery = true;
      }
      const dbgOutY = galOutY + SIZE * .05;
      const dbgH2 = cardH * .028;
      if (x > CX - SIZE * .14 && x < CX + SIZE * .14 && y > dbgOutY - dbgH2 && y < dbgOutY + dbgH2 / 2) {
        this.downloadDebugData();
      }
      if (x > CX - galBtnW2 / 2 && x < CX + galBtnW2 / 2 && y > galOutY - galBtnH2 * .65 && y < galOutY - galBtnH2 * .65 + galBtnH2) {
        this._galleryTouchStartY = undefined; this.showHighlightGallery = true;
      }
    }
  }

  sharePoster() {
    const PW = 540, PH = 780;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const c = document.createElement('canvas');
    c.width = PW * dpr; c.height = PH * dpr;
    const pctx = c.getContext('2d');
    pctx.scale(dpr, dpr);
    const skinLabel = { 普通蛋: '普通蛋', 茶叶蛋: '茶叶蛋', 煎荷包蛋: '煎荷包蛋', 溏心蛋: '溏心蛋' };
    const secs = Math.floor(this.survivalTime);
    const isNewBest = secs >= this.bestTime;
    // === Background ===
    const bgGrad = pctx.createLinearGradient(0, 0, 0, PH);
    bgGrad.addColorStop(0, '#fef9e7');
    bgGrad.addColorStop(0.5, '#f0faf0');
    bgGrad.addColorStop(1, '#e3f0e4');
    pctx.fillStyle = bgGrad;
    pctx.fillRect(0, 0, PW, PH);
    // Decorative tomato footprints
    pctx.globalAlpha = 0.06;
    for (let i = 0; i < 20; i++) {
      const fx = 20 + Math.random() * (PW - 40), fy = 20 + Math.random() * (PH - 40);
      pctx.fillStyle = '#e53935';
      pctx.beginPath();
      pctx.arc(fx, fy, 3 + Math.random() * 5, 0, Math.PI * 2);
      pctx.fill();
    }
    pctx.globalAlpha = 1;
    // Sparkle decorations
    for (let i = 0; i < 15; i++) {
      const sx = 10 + Math.random() * (PW - 20), sy = 10 + Math.random() * (PH - 20);
      const sr = 1 + Math.random() * 2.5;
      pctx.fillStyle = `rgba(255,215,0,${0.1 + Math.random() * 0.2})`;
      pctx.beginPath();
      // 4-point star
      for (let j = 0; j < 4; j++) {
        const a = Math.PI / 4 + j * Math.PI / 2;
        const ax = sx + Math.cos(a) * sr * 2;
        const ay = sy + Math.sin(a) * sr * 2;
        if (j === 0) pctx.moveTo(ax, ay);
        else pctx.lineTo(ax, ay);
        const a2 = a + Math.PI / 4;
        pctx.lineTo(sx + Math.cos(a2) * sr, sy + Math.sin(a2) * sr);
      }
      pctx.closePath();
      pctx.fill();
    }
    // === Card frame ===
    const margin = 18;
    pctx.save();
    pctx.shadowColor = 'rgba(0,0,0,.12)';
    pctx.shadowBlur = 20;
    pctx.shadowOffsetY = 4;
    pctx.fillStyle = '#fff';
    pctx.beginPath();
    pctx.roundRect(margin, margin, PW - margin * 2, PH - margin * 2, 24);
    pctx.fill();
    pctx.shadowBlur = 0;
    pctx.shadowOffsetY = 0;
    // Inner border
    pctx.strokeStyle = 'rgba(255,215,0,.25)';
    pctx.lineWidth = 2;
    pctx.beginPath();
    pctx.roundRect(margin + 6, margin + 6, PW - margin * 2 - 12, PH - margin * 2 - 12, 20);
    pctx.stroke();
    pctx.restore();
    // === Header banner ===
    const bannerGrad = pctx.createLinearGradient(0, 0, PW, 0);
    bannerGrad.addColorStop(0, '#ffcc02');
    bannerGrad.addColorStop(0.5, '#ffb300');
    bannerGrad.addColorStop(1, '#ff8f00');
    pctx.fillStyle = bannerGrad;
    pctx.beginPath();
    pctx.roundRect(40, 32, PW - 80, 56, 12);
    pctx.fill();
    pctx.shadowBlur = 0;
    pctx.fillStyle = '#fff';
    pctx.font = 'bold 32px Arial';
    pctx.textAlign = 'center';
    pctx.textBaseline = 'middle';
    pctx.fillText('🥚 蛋蛋快跑 · 战绩', PW / 2, 60);
    // === Survival tag ===
    pctx.fillStyle = '#8aa899';
    pctx.font = '15px Arial';
    pctx.textBaseline = 'top';
    pctx.fillText(getSurvivalTag(secs), PW / 2, 100);
    pctx.textBaseline = 'alphabetic';
    // === Egg preview (larger) ===
    const colors = { 普通蛋: ['#ebd6b0','#c9a87c'], 溏心蛋: ['#fff5cc','#ffb300'], 煎荷包蛋: ['#fff','#ff8f00'], 茶叶蛋: ['#c4956a','#6d4c00'] };
    const [base, shadow] = colors[this.currentSkin] || colors.普通蛋;
    const px = PW / 2, py = 265, pr = 65;
    // Glow behind egg
    const glowGrad = pctx.createRadialGradient(px, py - 10, 0, px, py - 10, pr * 2);
    glowGrad.addColorStop(0, 'rgba(255,215,0,.12)');
    glowGrad.addColorStop(1, 'rgba(255,215,0,0)');
    pctx.fillStyle = glowGrad;
    pctx.beginPath();
    pctx.arc(px, py - 10, pr * 2, 0, Math.PI * 2);
    pctx.fill();
    // Draw egg
    pctx.save();
    pctx.beginPath();
    pctx.ellipse(px, py, pr * 1.1, pr * 1.15, 0, 0, Math.PI * 2);
    pctx.fillStyle = shadow;
    pctx.fill();
    pctx.beginPath();
    pctx.ellipse(px, py - pr * .05, pr * 1.05, pr * 1.1, 0, 0, Math.PI * 2);
    pctx.fillStyle = base;
    pctx.fill();
    // Cheek blush
    pctx.fillStyle = 'rgba(255,150,150,.25)';
    pctx.beginPath();
    pctx.ellipse(px - pr * .5, py + pr * .15, pr * .18, pr * .1, 0, 0, Math.PI * 2);
    pctx.fill();
    pctx.beginPath();
    pctx.ellipse(px + pr * .5, py + pr * .15, pr * .18, pr * .1, 0, 0, Math.PI * 2);
    pctx.fill();
    if (this.currentSkin === '煎荷包蛋') {
      pctx.beginPath();
      pctx.arc(px, py + pr * .05, pr * .55, 0, Math.PI * 2);
      pctx.fillStyle = '#ffb300';
      pctx.fill();
      pctx.beginPath();
      pctx.arc(px, py + pr * .05, pr * .45, 0, Math.PI * 2);
      pctx.fillStyle = '#ff8f00';
      pctx.fill();
      pctx.fillStyle = '#333';
      pctx.beginPath();
      pctx.arc(px - pr * .25, py + pr * .05, pr * .1, 0, Math.PI * 2);
      pctx.arc(px + pr * .25, py + pr * .05, pr * .1, 0, Math.PI * 2);
      pctx.fill();
      // Mouth
      pctx.beginPath();
      pctx.arc(px, py + pr * .25, pr * .12, 0, Math.PI);
      pctx.strokeStyle = '#333';
      pctx.lineWidth = 2;
      pctx.stroke();
    } else {
      pctx.fillStyle = '#333';
      pctx.beginPath();
      pctx.arc(px - pr * .3, py - pr * .15, pr * .12, 0, Math.PI * 2);
      pctx.arc(px + pr * .3, py - pr * .15, pr * .12, 0, Math.PI * 2);
      pctx.fill();
      // Happy mouth
      pctx.beginPath();
      pctx.arc(px, py + pr * .12, pr * .15, 0.1, Math.PI - 0.1);
      pctx.strokeStyle = '#333';
      pctx.lineWidth = 2.5;
      pctx.stroke();
    }
    pctx.restore();
    // Coins around egg
    const coinPositions = [
      [px - pr * 1.8, py - pr * 0.5], [px + pr * 1.8, py - pr * 0.3],
      [px - pr * 1.5, py + pr * 1.0], [px + pr * 1.5, py + pr * 0.9],
      [px - pr * 0.8, py - pr * 1.6], [px + pr * 0.8, py - pr * 1.5],
    ];
    for (const [cpx, cpy] of coinPositions) {
      pctx.save();
      pctx.fillStyle = '#ffd54f';
      pctx.shadowColor = 'rgba(0,0,0,.1)';
      pctx.shadowBlur = 6;
      pctx.beginPath();
      pctx.arc(cpx, cpy, 8, 0, Math.PI * 2);
      pctx.fill();
      pctx.fillStyle = '#ff8f00';
      pctx.shadowBlur = 0;
      pctx.font = 'bold 10px Arial';
      pctx.textAlign = 'center';
      pctx.textBaseline = 'middle';
      pctx.fillText('$', cpx, cpy + 1);
      pctx.restore();
    }
    // === Defeated tomato (right of egg) ===
    this.drawPosterTomato(pctx, px + 160, py - 10, 36);
    // === Time display ===
    pctx.save();
    pctx.shadowColor = 'rgba(239,83,80,.3)';
    pctx.shadowBlur = 10;
    pctx.fillStyle = '#ef5350';
    pctx.font = 'bold 72px Arial';
    pctx.textAlign = 'center';
    pctx.textBaseline = 'alphabetic';
    pctx.fillText(`⏱ ${secs}`, PW / 2, 415);
    pctx.shadowBlur = 0;
    pctx.fillStyle = '#8aa899';
    pctx.font = '20px Arial';
    pctx.fillText('存活秒数', PW / 2, 445);
    pctx.restore();
    // === Stats cards ===
    const cardW = 140, cardH = 70;
    const cardGap = 16;
    const cardY = 498;
    const totalW = cardW * 3 + cardGap * 2;
    const startX = (PW - totalW) / 2;
    const stats = [
      { icon: '🎯', label: '目标', value: `${this.challengeGoal || '-'}秒`, color: '#66bb6a', bg: 'rgba(102,187,106,.12)', border: 'rgba(102,187,106,.2)' },
      { icon: '💀', label: '击杀', value: `${this.sessionKills}`, color: '#e53935', bg: 'rgba(229,57,53,.1)', border: 'rgba(229,57,53,.15)' },
      { icon: '💰', label: '金币', value: `${this.gold}`, color: '#f0a500', bg: 'rgba(255,213,79,.15)', border: 'rgba(255,160,0,.2)' },
    ];
    for (let i = 0; i < 3; i++) {
      const cx = startX + i * (cardW + cardGap);
      pctx.fillStyle = stats[i].bg;
      pctx.beginPath();
      pctx.roundRect(cx, cardY, cardW, cardH, 12);
      pctx.fill();
      pctx.strokeStyle = stats[i].border;
      pctx.lineWidth = 1.5;
      pctx.beginPath();
      pctx.roundRect(cx, cardY, cardW, cardH, 12);
      pctx.stroke();
      pctx.fillStyle = stats[i].color;
      pctx.font = 'bold 28px Arial';
      pctx.textAlign = 'center';
      pctx.fillText(stats[i].value, cx + cardW / 2, cardY + 28);
      pctx.fillStyle = '#999';
      pctx.font = '15px Arial';
      pctx.fillText(`${stats[i].icon} ${stats[i].label}`, cx + cardW / 2, cardY + 56);
    }
    // === Skin + Goal ===
    pctx.textAlign = 'center';
    pctx.fillStyle = '#6a9c79';
    pctx.font = '17px Arial';
    pctx.fillText(`🏆 ${skinLabel[this.currentSkin] || '普通蛋'}`, PW / 2, 605);
    // === Record ribbon ===
    if (isNewBest && secs > 0) {
      const rby = 642;
      pctx.save();
      pctx.shadowColor = 'rgba(255,215,0,.4)';
      pctx.shadowBlur = 10;
      // Ribbon banner
      const rbGrad = pctx.createLinearGradient(PW / 2 - 90, 0, PW / 2 + 90, 0);
      rbGrad.addColorStop(0, '#ff8f00');
      rbGrad.addColorStop(0.5, '#ffd700');
      rbGrad.addColorStop(1, '#ff8f00');
      pctx.fillStyle = rbGrad;
      pctx.beginPath();
      pctx.roundRect(PW / 2 - 90, rby, 180, 32, 8);
      pctx.fill();
      pctx.shadowBlur = 0;
      pctx.fillStyle = '#fff';
      pctx.font = 'bold 16px Arial';
      pctx.textAlign = 'center';
      pctx.textBaseline = 'middle';
      pctx.fillText('🌟 新纪录！', PW / 2, rby + 16);
      pctx.textBaseline = 'alphabetic';
      pctx.restore();
    } else if (this.bestTime > 0) {
      pctx.fillStyle = '#888';
      pctx.font = '15px Arial';
      pctx.textAlign = 'center';
      pctx.fillText(`🏅 最高纪录: ${Math.floor(this.bestTime)} 秒`, PW / 2, 662);
    }
    // === Footer decoration ===
    pctx.strokeStyle = 'rgba(200,200,200,.4)';
    pctx.lineWidth = 1;
    pctx.beginPath();
    pctx.moveTo(80, 698);
    pctx.lineTo(460, 698);
    pctx.stroke();
    pctx.fillStyle = 'rgba(74,124,89,.6)';
    pctx.font = 'bold 15px Arial';
    pctx.textAlign = 'center';
    pctx.fillText('🥚 蛋蛋快跑 · 🍅 番茄大追杀', PW / 2, 726);
    // Generate & share
    c.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'egg_vs_tomato_result.png';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
    });
  }
}

function calcJoystickMag(rawMag) {
  return Math.min(1, Math.max(0, rawMag));
}

function handleTouchStart(e) {
  e.preventDefault();
  const t = e.touches[0];
  touchId = t.identifier;
  touchX = t.clientX;
  touchY = t.clientY;
  if (game && game.showHighlightGallery) {
    game._galleryTouchStartY = t.clientY;
    game._galleryTouchBaseScroll = game._galleryScrollY || 0;
  }
  const now = Date.now();
  if (game && game.state === 'playing') {
    if (game.showTutorial) { game.handleClick(0, 0); e.preventDefault(); return; }
    if (game.isJumping) return;
    const rect = canvas.getBoundingClientRect();
    const x = (t.clientX - rect.left) / rect.width * CW;
    const y = (t.clientY - rect.top) / rect.height * CH;
    // Joystick check
    if (game.joystickEnabled) {
      const jcX = CW - SIZE * .28;
      const jcY = CH - SIZE * .28;
      const touchDist = Math.hypot(x - jcX, y - jcY);
      if (touchDist < SIZE * .35) {
        game.joystickActive = true;
        game.joystickTouchId = touchId;
        const dx = x - jcX, dy = y - jcY;
        const len = Math.hypot(dx, dy);
        const maxR = SIZE * .14;
        const clamp = Math.min(len, maxR);
        const nx = len > 0 ? dx / len : 0;
        const ny = len > 0 ? dy / len : 0;
        game.joystickDir = { x: nx, y: ny };
        game.joystickMag = calcJoystickMag(clamp / maxR);
        game.joystickKnobX = jcX + nx * clamp;
        game.joystickKnobY = jcY + ny * clamp;
        game.egg.target = null;
        game.egg.vel = new Vec2();
        return;
      }
    }
    game.mouseX = x; game.mouseY = y;
    const doubleTapDist = Math.hypot(x - game.lastTapX, y - game.lastTapY);
    game.lastTapX = x; game.lastTapY = y;
    if (now - tapTime < 300 && doubleTapDist < SIZE * 0.1) {
      // Double-tap (same area)
      const dirX = x - game.egg.pos.x;
      const dirY = y - game.egg.pos.y;
      const distToEgg = Math.sqrt(dirX * dirX + dirY * dirY);
      if (distToEgg > EGG_R && game.dashCooldown <= 0) {
        // Far from egg → dash
        game.dash(dirX, dirY);
        game.pendingDashRelease = true;
        tapTime = now;
        return;
      } else {
        // Near egg → prepare for charge jump (drag to activate)
        game.isCharging = true;
        game.chargeActive = false;
        game.chargeStartTime = Date.now();
        game.chargePressX = x;
        game.chargePressY = y;
        game.egg.target = null;
        game.chargeDirection.x = dirX;
        game.chargeDirection.y = dirY;
        game.draw();
        tapTime = now;
        return;
      }
    }
    // Single tap → near egg = splash, far = move
    const tapDirX = x - game.egg.pos.x;
    const tapDirY = y - game.egg.pos.y;
    const distToTap = Math.sqrt(tapDirX * tapDirX + tapDirY * tapDirY);
    if (distToTap < EGG_R + 10) {
      game.quickSplash();
    } else {
      game.egg.moveTo(x, y);
    }
    game.isCharging = false;
    game.chargeActive = false;
    tapTime = now;
  }
}

function handleTouchMove(e) {
  e.preventDefault();
  for (let t of e.changedTouches) {
    if (t.identifier === touchId) {
      const rect = canvas.getBoundingClientRect();
      const x = (t.clientX - rect.left) / rect.width * CW;
      const y = (t.clientY - rect.top) / rect.height * CH;
      if (game && game.showHighlightGallery) {
        const dy = (game._galleryTouchStartY - t.clientY) / rect.height * CH;
        let sy = (game._galleryTouchBaseScroll || 0) + dy;
        const clips = HLRecorder.clips;
        const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const _s = SIZE * (isMobile ? 1.3 : 1.0);
        const listH = _s * .6 - _s * .22;
        const totalListH = clips.length * _s * .075;
        const maxScroll2 = Math.max(0, totalListH - listH);
        game._galleryScrollY = Math.max(0, Math.min(sy, maxScroll2));
        if (game._galleryScrollY !== game._lastScrollLog) { game._lastScrollLog = game._galleryScrollY; console.log('touchScroll', game._galleryScrollY, maxScroll2); }
        game.draw();
        break;
      }
      if (game && game.state === 'playing' && !game.showTutorial) {
        // Joystick drag
        if (game.joystickActive) {
          const jcX = CW - SIZE * .28;
          const jcY = CH - SIZE * .28;
          const dx = x - jcX, dy = y - jcY;
          const len = Math.hypot(dx, dy);
          const maxR = SIZE * .14;
          const clamp = Math.min(len, maxR);
          const nx = len > 0 ? dx / len : 0;
          const ny = len > 0 ? dy / len : 0;
        game.joystickDir = { x: nx, y: ny };
        game.joystickMag = calcJoystickMag(clamp / maxR);
        game.joystickKnobX = jcX + nx * clamp;
          game.joystickKnobY = jcY + ny * clamp;
          game.egg.target = null;
          break;
        }
        game.mouseX = x; game.mouseY = y;
        if (game.chargeActive || game.isCharging || game.isJumping) {
          // Don't move egg during charge or jump
        } else {
          game.egg.moveTo(x, y);
        }
      }
      break;
    }
  }
}

function handleTouchEnd(e) {
  e.preventDefault();
  for (let t of e.changedTouches) {
    if (t.identifier === touchId) {
      const rect = canvas.getBoundingClientRect();
      const x = (t.clientX - rect.left) / rect.width * CW;
      const y = (t.clientY - rect.top) / rect.height * CH;
      const moved = Math.hypot(t.clientX - touchX, t.clientY - touchY) > 10;
      if (game && game.showHighlightGallery && moved) { return; }
      if (game.state === 'playing') {
        if (game.showTutorial) return;
        if (game.joystickActive) {
          game.joystickActive = false;
          game.joystickDir = { x: 0, y: 0 };
          game.joystickMag = 0;
          game.joystickTouchId = null;
          return;
        }
        if (game.pendingDashRelease) {
          game.pendingDashRelease = false;
          game.isCharging = false;
          game.chargeActive = false;
        } else if (game.chargeActive) {
          game.doJump();
        } else if (game.isCharging) {
          game.isCharging = false;
          const dx = x - game.egg.pos.x;
          const dy = y - game.egg.pos.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < EGG_R + 10) { game.quickSplash(); }
          else { game.egg.moveTo(x, y); }
        } else {
          game.isCharging = false;
        }
        game.egg.target = null;
      } else {
        game.handleClick(x, y);
      }
      break;
    }
  }
  touchId = null;
}

canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

    if (now - tapTime < 300 && doubleTapDist < SIZE * 0.1) {
      // Double-tap (same area)
      const dirX = x - game.egg.pos.x;
      const dirY = y - game.egg.pos.y;
      const distToEgg = Math.sqrt(dirX * dirX + dirY * dirY);
      if (distToEgg > EGG_R && game.dashCooldown <= 0) {
        // Far from egg → dash
        game.dash(dirX, dirY);

        tapTime = now;
        e.preventDefault();
        return;
      } else {
        // Near egg → prepare for charge jump (drag to activate)
        game.isCharging = true;

        game.chargePressX = x;
        game.chargePressY = y;
        game.egg.target = null;
        game.chargeDirection.x = dirX;
        game.chargeDirection.y = dirY;
        game.draw();
        tapTime = now;
        e.preventDefault();
        return;
      }
    }
    // Single tap → near egg = splash, far = move
    const tapDirX = x - game.egg.pos.x;

    const distToTap = Math.sqrt(tapDirX * tapDirX + tapDirY * tapDirY);
    if (distToTap < EGG_R + 10) {
      game.quickSplash();

    }
    game.isCharging = false;
    game.chargeActive = false;
    tapTime = now;
  } else if (game && game.showTutorial) {

  e.preventDefault();
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * CW;
  const y = (e.clientY - rect.top) / rect.height * CH;

      const jcX = CW - SIZE * .28;
      const jcY = CH - SIZE * .28;
      const dx = x - jcX, dy = y - jcY;

      const maxR = SIZE * .14;
      const clamp = Math.min(len, maxR);
      const nx = len > 0 ? dx / len : 0;
      const ny = len > 0 ? dy / len : 0;
      game.joystickDir = { x: nx, y: ny };
      game.joystickMag = calcJoystickMag(clamp / maxR);
      game.joystickKnobX = jcX + nx * clamp;
      game.joystickKnobY = jcY + ny * clamp;
      game.egg.target = null;
    } else if (game.chargeActive || game.isCharging || game.isJumping) {
      // Don't move egg during charge or jump
    } else {

    }
  }
});

function handleMouseUp(e) {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * CW;
  const y = (e.clientY - rect.top) / rect.height * CH;
  if (game) { game.mouseX = x; game.mouseY = y; }
  if (game && game.state === 'playing') {
    if (game.showTutorial) return;
    if (game.joystickActive) {
      game.joystickActive = false;
      game.joystickDir = { x: 0, y: 0 };
      game.joystickMag = 0;
      return;
    }
    if (game.pendingDashRelease) {
      game.pendingDashRelease = false;
      game.isCharging = false;
      game.chargeActive = false;
    } else if (game.chargeActive) {
      game.doJump();
    } else if (game.isCharging) {
      game.isCharging = false;
      const dx = x - game.egg.pos.x;
      const dy = y - game.egg.pos.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < EGG_R + 10) { game.quickSplash(); }
      else { game.egg.moveTo(x, y); }
    } else {
      game.isCharging = false;
    }
    game.egg.target = null;
  } else if (game) {
    game.handleClick(x, y);
  }
}
canvas.addEventListener('mouseup', handleMouseUp);

function gameLoop(time) {
  try {
    const dt = Math.min((time - (game ? game.lastTime : time)) / 16, 2);
    if (game) {
      game.lastTime = time;
      game.debugInfo.dt = dt;
      game.debugInfo.frameCount++;
      if (game.state === 'playing') {
        game.debugInfo.record.push({
          t: game.survivalTime,
          dt,
          fps: game.debugInfo.fps,
          px: game.egg.pos.x,
          py: game.egg.pos.y,
          vx: game.egg.vel.x,
          vy: game.egg.vel.y,
          tomatoes: game.tomatoes.length,
          jumping: game.isJumping,
          charging: game.chargeActive,
          mouseX: game.mouseX,
          mouseY: game.mouseY,
          eDirX: game.chargeDirection.x,
          eDirY: game.chargeDirection.y,
          jumpFrames: game.jumpTotalFrames,
          jumpTimer: game.jumpTimer,
          audioCtx: SFX._ctx ? SFX._ctx.state : 'none',
          gravity: game.gravityField ? game.gravityField.timer : 0,
          fireShell: game.fireShellTimer,
          shield: game.shieldTimer,
          invincible: game.egg.invincible,
          gPull: game.gravityField ? game.tomatoes.filter(t => t.gravityPull > 0).length : 0,
          gAvgV: game.gravityField && game.tomatoes.length > 0
            ? (game.tomatoes.reduce((s, t) => s + t.vel.len(), 0) / game.tomatoes.length).toFixed(1)
            : '0',
          gold: game.gold,
          jActive: game.joystickActive,
          jDirX: game.joystickDir.x,
          jDirY: game.joystickDir.y,
          jMag: game.joystickMag,
        });
        if (game.debugInfo.record.length > 900) game.debugInfo.record.shift();
      }
      if (time - game.debugInfo.fpsTimer > 1000) {
        game.debugInfo.fps = game.debugInfo.frameCount;
        game.debugInfo.frameCount = 0;
        game.debugInfo.fpsTimer = time;
      }
    }
    if (game) {
      if (game.transitionState !== 'none') {
        game.transitionTimer--;
        if (game.transitionTimer <= 0) {
          if (game.transitionState === 'fadeOut') {
            game.transitionState = 'fadeIn';
            game.transitionTimer = 10;
          } else {
            game.transitionState = 'none';
          }
        }
      }
      game.update(dt);
      game.draw();
    }
  } catch(e) {
    console.error('Game crash:', e);
    if (game) {
      const errMsg = e?.message || String(e);
      const errStack = e?.stack || '';
      game.debugInfo.errors.push({ t: game.survivalTime, msg: errMsg, stack: errStack });
      if (game.debugInfo.errors.length > 20) game.debugInfo.errors.shift();
    }
    ctx.clearRect(0, 0, CW, CH);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = '#c00';
    ctx.font = Math.floor(SIZE * .05) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('出错了，请刷新页面', CX, CY);
    ctx.fillStyle = '#666';
    ctx.font = Math.floor(SIZE * .03) + 'px sans-serif';
    ctx.fillText('Error logged to console', CX, CY + SIZE * .06);
  }
  requestAnimationFrame(gameLoop);
}



window.addEventListener('error', e => {
  if (game) {
    game.debugInfo.errors.push({ t: game.survivalTime, msg: e.message, stack: e.error?.stack || '' });
    if (game.debugInfo.errors.length > 20) game.debugInfo.errors.shift();
  }
});
game = new Game();
window.game = game;
game.draw();
HLRecorder.init();
requestAnimationFrame(gameLoop);
canvas.addEventListener('mousemove', e => {
  if (!game) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width * CW;
  const my = (e.clientY - rect.top) / rect.height * CH;
  let found = '';
  if (game.state === 'gameover') {
    const V = Math.max(SIZE, CH * .7);
    const btnW = SIZE * .4, btnH = SIZE * .08;
    if (mx > CX - btnW / 2 && mx < CX + btnW / 2 && my > CY + V * .10 && my < CY + V * .10 + btnH) found = '再来一次';
    if (mx > CX - btnW / 2 && mx < CX + btnW / 2 && my > CY + V * .23 && my < CY + V * .23 + SIZE * .07) found = '📸 生成战绩';
    const galBtnH = SIZE * .055;
    const galBtnW = SIZE * .28;
    const galBtnY = CY + V * .35;
    if (mx > CX - galBtnW / 2 && mx < CX + galBtnW / 2 && my > galBtnY - galBtnH * .65 && my < galBtnY - galBtnH * .65 + galBtnH) found = '📹 精彩回放';
    const dbgY = galBtnY + SIZE * .05;
    if (mx > CX - SIZE * .14 && mx < CX + SIZE * .14 && my > dbgY - SIZE * .012 && my < dbgY + SIZE * .012) found = '📥 导出调试数据';
  } else if (game.state === 'victoryscreen') {
    const cardH = CH * .72;
    const cardW = Math.min(CW * .85, cardH * .58);
    const cardY = CY - cardH / 2;
    const btnW = cardW * .38, btnGap = cardW * .04, btnH = cardH * .078;
    const btnY = cardY + cardH * .83;
    const leftL = CX - btnW - btnGap / 2, leftR = CX - btnGap / 2;
    const rightL = CX + btnGap / 2, rightR = CX + btnW + btnGap / 2;
    if (mx > leftL && mx < leftR && my > btnY && my < btnY + btnH) found = '再来一局';
    if (mx > rightL && mx < rightR && my > btnY && my < btnY + btnH) found = '📸 生成战绩';
    const galBtnH2 = cardH * .04;
    const galBtnW2 = cardW * .32;
    const galOutY = cardY + cardH + SIZE * .08;
    if (mx > CX - galBtnW2 / 2 && mx < CX + galBtnW2 / 2 && my > galOutY - galBtnH2 * .65 && my < galOutY - galBtnH2 * .65 + galBtnH2) found = '📹 精彩回放';
    const dbgOutY = galOutY + SIZE * .05;
    if (mx > CX - SIZE * .14 && mx < CX + SIZE * .14 && my > dbgOutY - cardH * .014 && my < dbgOutY + cardH * .014) found = '📥 导出调试数据';
  } else if (game.state === 'shop' || game.state === 'preshop') {
    const sw2 = SIZE * .88, sh2 = SIZE * .7;
    const sy2 = CY - sh2 / 2;
    const barY2 = sy2 + sh2 - SIZE * .12;
    const barH2 = SIZE * .075;
    const continueW2 = SIZE * .16;
    const continueX2 = CX + sw2 / 2 - continueW2 - SIZE * .06;
    const buyW2 = SIZE * .16;
    const totalCost2 = game.shopQtys.reduce((s, q, i) => s + q * (game.shopItems[i]?.cost || 0), 0);
    const canBuy2 = totalCost2 > 0 && game.gold >= totalCost2;
    const btnTop2 = barY2 + (barH2 - SIZE * .05) / 2;
    const btnBot2 = barY2 + (barH2 + SIZE * .05) / 2;
    if (canBuy2 && mx > continueX2 - buyW2 - SIZE * .025 && mx < continueX2 - SIZE * .025 && my > btnTop2 && my < btnBot2) found = '购买';
    else if (mx > continueX2 && mx < continueX2 + continueW2 && my > btnTop2 && my < btnBot2) found = game.isPreShop ? '开始战斗' : '继续战斗';
  } else if (game.state === 'menu') {
    const V = Math.max(SIZE, CH * .7);
    const modeBtnW = SIZE * .16, modeBtnH = SIZE * .055, modeBtnY = CY + V * .17, modeGap = SIZE * .02;
    const chalX = CX - modeBtnW - modeGap / 2, endX = CX + modeGap / 2;
    const startBtnY = CY + V * .24, startBtnH = SIZE * .07;
    if (mx > chalX && mx < chalX + modeBtnW && my > modeBtnY && my < modeBtnY + modeBtnH) found = '生存挑战';
    else if (mx > endX && mx < endX + modeBtnW && my > modeBtnY && my < modeBtnY + modeBtnH) found = '无尽生存';
    else if (mx > CX - SIZE * .18 && mx < CX + SIZE * .18 && my > startBtnY && my < startBtnY + startBtnH) found = '开始游戏';
    else if (mx > CX - SIZE * .1 && mx < CX + SIZE * .1 && my > startBtnY + startBtnH + SIZE * .06 - SIZE * .035 && my < startBtnY + startBtnH + SIZE * .06 + SIZE * .0175) found = '重置数据';
  }
  if (found !== game.hoverBtn) { game.hoverBtn = found; game.draw(); }
});
window.addEventListener('resize', () => {
  if (!game) return;
  resizeCanvas();
  game._bgCanvas.width = CW;
  game._bgCanvas.height = CH;
  game._bgDirty = true;
  if (game.egg) game.egg.moveTo(game.egg.pos.x, game.egg.pos.y);
  game.draw();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && game && game.showHighlightGallery) {
    game.showHighlightGallery = false; game.draw(); e.preventDefault(); return;
  }
  if (e.key === 'd' || e.key === 'D' || e.key === 'F3') {
    if (game) { game.debugInfo.showDebug = !game.debugInfo.showDebug; game.saveSettings(); game.draw(); }
    e.preventDefault();
  }
  if (e.key === 'r' || e.key === 'R') {
    if (game && game.state !== 'menu') { game.setState('playing'); }
  }
  if (e.key === 'l' || e.key === 'L') {
    if (game) {
      game.pushDebugData();
      console.log(`💾 已导出 ${game.debugInfo.record.length} 帧数据`);
    }
  }
  // Debug BGM layers: Shift+1=和弦 2=贝斯 3=旋律 4=鼓
  if (e.code.startsWith('Digit') && !e.ctrlKey && !e.altKey && !e.metaKey) {
    const idx = +e.code.slice(5) - 1;
    if (idx >= 0 && idx < 4) {
      const names = ['pad','bass','mel','kick'];
      SFX.toggleBGMLayer(names[idx]);
      e.preventDefault();
    }
    e.preventDefault();
  }
});
canvas.addEventListener('wheel', e => {
  if (game && game.showHighlightGallery) {
    let sy = (game._galleryScrollY || 0) + e.deltaY * 0.5;
    const clips = HLRecorder.clips;
    const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    const _s = SIZE * (isMobile ? 1.3 : 1.0);
    const listH = _s * .6 - _s * .22;
    const totalListH = clips.length * _s * .075;
    const maxScroll2 = Math.max(0, totalListH - listH);
    game._galleryScrollY = Math.max(0, Math.min(sy, maxScroll2));
    if (game._galleryScrollY !== game._lastScrollLog) { game._lastScrollLog = game._galleryScrollY; console.log('wheelScroll', game._galleryScrollY, maxScroll2); }
    game.draw();
    e.preventDefault();
  }
}, { passive: false });

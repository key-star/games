      this.showMessage(`解锁皮肤：${this.currentSkin}！`, 200);
    }
  }

  checkAchievements() {
    const hpAchs = { iron_wall: 1, ten_games: 1, max_skin: 1 };
    for (const a of ACHIEVEMENTS) {
      if (this.achievements.includes(a.id)) continue;
      if (a.check(this)) {
        this.achievements.push(a.id);
        SFX.secretUnlock();
        if (hpAchs[a.id]) {
          this.bonusHp += hpAchs[a.id];
          this.showMessage(`🏅 成就解锁：${a.name} · HP+${hpAchs[a.id]}！`, 200);
        } else {
          this.showMessage(`🏅 成就解锁：${a.name}！`, 200);
        }
      }
    }
  }

  update(dt) {
    if (this.state === 'victory') { this.updateVictory(dt); this._updateParticles(); return; }
    if (this.state !== 'playing') return;


    if (this.messageTimer > 0) this.messageTimer--;
    // Tip queue processing
    if (this.tipQueue.length > 0) {
      if (this.tipTimer > 0) {
        this.tipTimer--;
        if (this.tipTimer <= 0) {
          this.tipQueue.shift();
          if (this.tipQueue.length > 0) this.tipTimer = 120;
        }
      } else {
        this.tipTimer = 120;
      }
    }
    if (this.speedBoostTimer > 0) { this.speedBoostTimer--; this.egg.speedMult = 1.5; }
    else { this.egg.speedMult = 1; }
    if (this.shieldTimer > 0) this.shieldTimer--;
    if (this.fireShellTimer > 0) this.fireShellTimer--;
    if (this.goldBoostTimer > 0) this.goldBoostTimer--;
    if (this.dashCooldown > 0) this.dashCooldown--;
    if (this.splashCooldown > 0) this.splashCooldown--;

    // Survival time and difficulty scaling
    this.survivalTime += dt / 60;
    if (this.gameMode === 'endless') {
      this.difficulty = this.survivalTime * 0.12;
    } else {
      this.difficulty = this.wave * 1.0;
      if (this.survivalTime > 60) this.difficulty += (this.survivalTime - 60) * 0.015;
      if (this.survivalTime > 180) this.difficulty += (this.survivalTime - 180) * 0.025;
    }

    // Joystick — set velocity (leveraged by egg physics for smooth feel)
    if (this.joystickActive && !this.isCharging && !this.chargeActive && !this.isJumping) {
      const targetV = 8 * this.egg.speedMult * this.joystickMag;
      this.egg.vel.x = this.joystickDir.x * targetV;
      this.egg.vel.y = this.joystickDir.y * targetV;
    }

    this.egg.update(dt);

    // Boundary clamp with bounce
    if (this.joystickActive) {
      const m = PLATE_MARGIN + this.egg.r;
      if (this.egg.pos.x < m) { this.egg.pos.x = m; this.egg.vel.x *= -0.4; }
      if (this.egg.pos.x > CW - m) { this.egg.pos.x = CW - m; this.egg.vel.x *= -0.4; }
      if (this.egg.pos.y < m) { this.egg.pos.y = m; this.egg.vel.y *= -0.4; }
      if (this.egg.pos.y > CH - m) { this.egg.pos.y = CH - m; this.egg.vel.y *= -0.4; }
    }

    // === Dash after-movement ===
    if (this.dashTimer > 0) {
      this.dashTimer--;
      // Dash trail particles
      for (let i = 0; i < 2; i++) {
        const a = Math.random() * Math.PI * 2;
        this.particles.push(acquireParticle(
          this.egg.pos.x + (Math.random() - 0.5) * 10,
          this.egg.pos.y + (Math.random() - 0.5) * 10,
          Math.cos(a) * 2, Math.sin(a) * 2, 4, '#b3e5fc', 8
        ));
      }
      if (this.dashTimer <= 0) this.isDashing = false;
    }
    // === Charge direction update ===
    if (this.isCharging) {
      const elapsed = Date.now() - this.chargeStartTime;
      if (elapsed < 3000) this.shieldTimer = Math.max(this.shieldTimer, 60);
      const mx = this.mouseX, my = this.mouseY;
      this.chargeDirection.x = mx - this.egg.pos.x;
      this.chargeDirection.y = my - this.egg.pos.y;
      if (!this.chargeActive) {
        const dragDist = Math.hypot(mx - this.chargePressX, my - this.chargePressY);
        if (dragDist > EGG_R) {
          this.chargeActive = true;
        }
      }
      try {
        const now = Date.now();
        if (now - this.lastChargeTickTime > 150) {
          this.lastChargeTickTime = now;
          const elapsed = now - this.chargeStartTime;
          const chg = Math.min(1, Math.max(0, (elapsed - 200) / 1800));
          SFX.chargeTick(chg);
        }
      } catch(e) {}
    }
    // === Jump animation ===
    if (this.isJumping) {
      this.jumpTimer++;
      const p = Math.min(1, this.jumpTimer / this.jumpTotalFrames);
      if (p >= 1) {
        const last = this.jumpPath[this.jumpPath.length - 1];
        this.egg.pos.x = last.x2;
        this.egg.pos.y = last.y2;
        this.jumpLanding();
      } else {
        // Find position at distance p * totalDist along the path
        const targetDist = p * this.jumpTotalDist;
        let accum = 0, segIdx = 0, segP = 0, segLen = 0;
        for (let i = 0; i < this.jumpPath.length; i++) {
          const s = this.jumpPath[i];
          const sdx = s.x2 - s.x1, sdy = s.y2 - s.y1;
          const slen = Math.sqrt(sdx * sdx + sdy * sdy);
          if (accum + slen >= targetDist || i === this.jumpPath.length - 1) {
            segIdx = i;
            segP = slen > 0 ? (targetDist - accum) / slen : 0;
            segLen = slen;
            break;
          }
          accum += slen;
        }
        const seg = this.jumpPath[segIdx];
        const px = seg.x1 + (seg.x2 - seg.x1) * Math.max(0, Math.min(1, segP));
        const py = seg.y1 + (seg.y2 - seg.y1) * Math.max(0, Math.min(1, segP));
        // Per-segment arc: resets to 0 at each wall bounce
        const arcH = Math.sin(segP * Math.PI) * (segLen * 0.12 + 20);
        this.egg.pos.x = px;
        this.egg.pos.y = py;
        this.jumpArcOffset = arcH;
        if (Math.random() < 0.4) {
          this.particles.push(acquireParticle(px + (Math.random() - 0.5) * 6, py + (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 1, (Math.random() - 0.5) * 1, 3, '#81d4fa', 8));
        }
      }
    }

    // === Wave / Spawn system ===
    if (this.gameMode === 'endless') {
      this.updateEndless(dt);
    } else {
      this.updateWaves(dt);
    }

    // === Plate shrinking (disabled - matching 温泉蛋 fixed plate) ===

    // Crack animation timer
    if (this.crackTimer > 0) this.crackTimer--;

    // === Gravity field (affects all tomatoes including new spawns) ===
    if (this.gravityField && this.gravityField.timer > 0) {
      this.gravityField.timer -= dt;
      for (const t of this.tomatoes) {
        if (t.gravityPull <= 0) {
          t.gravityTx = this.gravityField.x;
          t.gravityTy = this.gravityField.y;
        }
        t.gravityPull = this.gravityField.timer;
      }
      if (this.gravityField.timer <= 0) this.gravityField = null;
    }
    // === Repulse shockwave ring ===
    if (this.repulseRing) {
      this.repulseRing.timer -= dt;
      this.repulseRing.radius = (1 - this.repulseRing.timer / 40) * this.repulseRing.maxRadius;
      this.repulseRing.alpha = Math.max(0, this.repulseRing.timer / 20 - 0.2);
      if (this.repulseRing.timer <= 0) this.repulseRing = null;
    }

    // === Apocalypse countdown ===
    if (this.apocalypseTimer > 0) {
      this.apocalypseTimer--;
      if (this.apocalypseTimer === 119) {
        this.showMessage('🍅💥 2...', 60);
        try { SFX._tone(500, 0.15, 'sine', 0.12); } catch(e) {}
      } else if (this.apocalypseTimer === 59) {
        this.showMessage('🍅💥 1...', 60);
        try { SFX._tone(600, 0.15, 'sine', 0.14); } catch(e) {}
      } else if (this.apocalypseTimer === 0) {
        HLRecorder.saveHighlight('apocalypse_kill', '番茄末日', '🍅', 12);
        try {
          SFX._noise(0.3, 0.25, 0, 3000);
          SFX._tone(80, 0.5, 'sawtooth', 0.15);
          SFX._chime(1200, 0.3, 0.08);
        } catch(e) {}
        const targets = [...this.tomatoes];
        const colorMap = { boss: '#e63946', big: '#f44336', shield: '#4fc3f7', splitter: '#ab47bc', explosive: '#ff7043', seed: '#ffab91' };
        for (const t of targets) {
          const color = colorMap[t.type] || '#ff6b6b';
          for (let i = 0; i < 8; i++) {
            const a2 = Math.random() * Math.PI * 2;
            const spd = 1 + Math.random() * 4;
            this.particles.push(acquireParticle(t.pos.x, t.pos.y, Math.cos(a2) * spd, Math.sin(a2) * spd, 2 + Math.random() * 4, color, 15 + Math.random() * 15));
          }
          this.killTomato(t);
        }
        for (let i = 0; i < 60; i++) {
          const a2 = Math.random() * Math.PI * 2;
          const spd = 2 + Math.random() * 8;
          this.particles.push(acquireParticle(CX, CY, Math.cos(a2) * spd, Math.sin(a2) * spd, 3 + Math.random() * 5, '#ffd700', 20 + Math.random() * 20));
        }
        this.showMessage('💥 番茄末日！蛋蛋一跺脚，番茄抖三抖！全部灰飞烟灭！', 200);
      }
    }

    // === Tomato collision (write-index pattern, no splice) ===
    let tw = 0;
    for (let i = 0; i < this.tomatoes.length; i++) {
      const t = this.tomatoes[i];
      if (!t.update(dt, this.egg, this.particles)) {
        if (t.hp > 0) {
          const pts = t.type === 'boss' ? 30 : t.type === 'big' ? 15 : 8;
          this.skinPoints += Math.floor(pts * 0.3);
        } else {
          this.killTomato(t);
        }
        continue;
      }
      const d = t.pos.distTo(this.egg.pos);
      if (d < t.r + this.egg.r) {
        const dir = t.pos.sub(this.egg.pos).norm();
        // Fire shell: tomato catches fire, flees, takes damage after 1s
        if (this.fireShellTimer > 0) {
          if (t.burnTimer <= 0) {
            t.burnTimer = 30;
            t.vel = dir.scale(14);
            t.flash = 16;
            SFX.fireIgnite();
            for (let i2 = 0; i2 < 16; i2++) {
              const a2 = Math.random() * Math.PI * 2;
              const spd = 3 + Math.random() * 6;
              this.particles.push(acquireParticle(t.pos.x, t.pos.y, Math.cos(a2) * spd, Math.sin(a2) * spd, 3 + Math.random() * 3, '#ff6f00', 15 + Math.random() * 15));
            }
          }
        } else if (this.shieldTimer > 0) {
          // Active shield: knockback tomato, no damage
          t.knockbackTimer = 20;
          t.vel = dir.scale(18);
          t.flash = 16;
          for (let i2 = 0; i2 < 6; i2++) {
            const a = Math.random() * Math.PI * 2;
            this.particles.push(acquireParticle(this.egg.pos.x, this.egg.pos.y, Math.cos(a) * 5, Math.sin(a) * 5, 3, '#81d4fa', 15));
          }
        } else if (this.storedShield > 0) {
          // Consume stored shield → activate 3s shield, knockback
          this.storedShield--;
          this.shieldTimer = 180;
          SFX.shieldActivate();
          this.showMessage('🛡️ 护盾激活！持续3秒', 200);
          t.knockbackTimer = 20;
          t.vel = dir.scale(18);
          t.flash = 16;
          for (let i2 = 0; i2 < 8; i2++) {
            const a = Math.random() * Math.PI * 2;
            this.particles.push(acquireParticle(this.egg.pos.x, this.egg.pos.y, Math.cos(a) * 4, Math.sin(a) * 4, 4, '#4fc3f7', 20));
          }
        } else if (this.egg.invincible > 0) {
          // One-time knockback, no gold
          t.vel = dir.scale(t.type === 'big' ? 4 : 2);
          t.flash = 8;
          for (let i2 = 0; i2 < 5; i2++) {
            const a = Math.random() * Math.PI * 2;
            this.particles.push(acquireParticle(t.pos.x, t.pos.y, Math.cos(a) * 3, Math.sin(a) * 3, 3, '#ffd700', 15));
          }
        } else {
          // Take damage
          this.egg.hp--;
          SFX.hit();
          this.egg.invincible = 30;
          this.perfectRoundThisRound = false;
          this.egg.knockback(dir.scale(-1), 5);
          t.vel = dir.scale(t.type === 'big' ? 4 : 2);
          t.flash = 8;
          for (let i2 = 0; i2 < 8; i2++) {
            const a = Math.random() * Math.PI * 2;
            this.particles.push(acquireParticle(this.egg.pos.x, this.egg.pos.y, Math.cos(a) * 4, Math.sin(a) * 4, 4, '#ff4444', 20));
          }
          if (this.egg.hp <= 0) {
            this.gameOver();
            return;
          }
        }
      } else if (d < t.r + this.egg.r + 15 && this.nearMissTimer <= 0) {
        this.nearMissTimer = 40;
        SFX.nearMiss();
        this.nearMissCount = (this.nearMissCount || 0) + 1;
        if (this.nearMissCount >= 7) { this.nearMissCount = 0; HLRecorder.saveHighlight('near_miss', '极限走位', '🏃', 5); }
        for (let i2 = 0; i2 < 3; i2++) {
          const a = Math.random() * Math.PI * 2;
          this.particles.push(acquireParticle(t.pos.x, t.pos.y, Math.cos(a) * 2, Math.sin(a) * 2, 2, '#fff', 10));
        }
      }
      this.tomatoes[tw++] = t;
    }
    this.tomatoes.length = tw;

    // === Particles (pool managed) ===
    this._updateParticles();

    // === Lightning bolts ===
    for (let i = this.lightningBolts.length - 1; i >= 0; i--) {
      this.lightningBolts[i].timer--;
      if (this.lightningBolts[i].timer <= 0) this.lightningBolts.splice(i, 1);
    }

    // === Gold popups ===
    for (let i = this.goldPopups.length - 1; i >= 0; i--) {
      this.goldPopups[i].timer--;
      this.goldPopups[i].y += this.goldPopups[i].vy;
      if (this.goldPopups[i].timer <= 0) this.goldPopups.splice(i, 1);
    }

    // === Artifacts ===
    if (this.artifacts.length === 0) {
      this.artifactTimer--;
      if (this.artifactTimer <= 0) {
        this.spawnArtifact();
      }
    }
    for (let i = this.artifacts.length - 1; i >= 0; i--) {
      const a = this.artifacts[i];
      a.life--;
      if (a.life <= 0) {
        this.artifacts.splice(i, 1);
        this.artifactTimer = 300 + Math.floor(Math.random() * 200);
        continue;
      }
      const d = Math.hypot(a.x - this.egg.pos.x, a.y - this.egg.pos.y);
      if (d < a.r + this.egg.r) {
        this.collectArtifact(a);
        this.artifacts.splice(i, 1);
        this.artifactTimer = 300 + Math.floor(Math.random() * 200);
      }
    }

    if (this.nearMissTimer > 0) this.nearMissTimer--;

    // === Milestone check ===
    this.checkMilestones();

    // === Victory check ===
    if (this.gameMode === 'challenge' && this.challengeGoal > 0 && this.survivalTime >= this.challengeGoal) {
      this.triggerVictory();
    }
  }

  updateWaves(dt) {
    if (this.waveState === 'preparing') {
      if (this._intensityWave !== this.wave) {
        this._intensityWave = this.wave;
        const baseIntensity = 0.7 + this.wave * 0.025;
        const sineWave = Math.sin(this.wave * 0.8) * 0.3;
        this.waveIntensity = Math.max(0.4, Math.min(2.0, baseIntensity + sineWave + (Math.random() - 0.5) * 0.15));
      }
      this.wavePrepTimer--;
      if (this.wavePrepTimer <= 0) {
        this.waveState = 'attacking';
        this.waveSpawnCount = 0;
        let base;
        if (this.wave <= 3) {
          base = 2 + this.wave;
        } else if (this.wave <= 6) {
          base = 4 + (this.wave - 3) * 2;
        } else {
          base = Math.min(8 + (this.wave - 6) * 2, 14);
        }
        this.waveTotalSpawn = Math.max(2, Math.round(base * this.waveIntensity));
        this.spawnTimer = 0;
        this.waveBurstTimer = 0;
        this.waveCleanupMode = Math.random() < 0.5 ? 'A' : 'C';
      }
    } else if (this.waveState === 'attacking') {
      if (this.waveBurstTimer > 0) {
        this.waveBurstTimer--;
      }
      if (this.waveBurstTimer <= 0 && this.waveSpawnCount < this.waveTotalSpawn) {
        const burstSize = Math.min(
          1 + Math.floor(Math.random() * (1 + Math.floor(this.wave / 3))),
          this.waveTotalSpawn - this.waveSpawnCount
        );
        const capRemaining = this.getTomatoCap() - this.tomatoes.length;
        const actualBurst = Math.min(burstSize, Math.max(0, capRemaining));
        for (let i = 0; i < actualBurst; i++) this.spawnEnemy();
        this.waveSpawnCount += burstSize;
        this.waveBurstTimer = Math.max(10, this.getSpawnInterval() * (0.8 + Math.random() * 1.5));
      }
      if (this.waveSpawnCount >= this.waveTotalSpawn) {
        this.waveState = 'cleanup';
        this.waveWaitTimer = 120;
      }
    } else if (this.waveState === 'cleanup') {
      this.waveWaitTimer--;
      const alive = this.tomatoes.length;
      let cleanupDone = false;
      if (this.waveCleanupMode === 'A') {
        cleanupDone = alive === 0;
      } else {
        cleanupDone = alive <= Math.max(1, Math.floor(this.waveTotalSpawn * 0.25)) || alive === 0;
      }
      if (cleanupDone || this.waveWaitTimer <= 0) {
        this.waveState = 'calm';
        this.waveCalmTimer = this.waveIntensity > 1.2 ? 70 : this.waveIntensity < 0.8 ? 30 : 50;
      }
    } else if (this.waveState === 'calm') {
      this.waveCalmTimer--;
      if (this.waveCalmTimer <= 0) {
        this.wave++;
        this.waveState = 'preparing';
        const basePrep = this.gameMode === 'endless' ? 40 : 80;
        this.wavePrepTimer = Math.max(25, basePrep - this.wave * 3);
      }
    }
  }

  updateEndless(dt) {
    // Continuous spawning like original 温泉蛋 mode
    this.spawnTimer += dt;
    const interval = this.getSpawnInterval();
    const cap = this.getTomatoCap();
    if (this.spawnTimer >= interval && this.tomatoes.length < cap) {
      this.spawnEnemy();
      this.spawnTimer = 0;
    }

  }

  shrinkPlate() {
    SFX.plateShrink();
    const shrinkBy = SIZE * 0.025;
    const minR = SIZE * 0.15;
    const newR = Math.max(minR, UNIT - shrinkBy);
    if (newR >= UNIT) return;
    UNIT = newR;
    // Generate crack particles around edge
    for (let i = 0; i < 12; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = UNIT;
      const cx = CX + Math.cos(angle) * dist;
      const cy = CY + Math.sin(angle) * dist;
      this.particles.push(acquireParticle(cx, cy, Math.cos(angle + Math.PI / 2) * 2, Math.sin(angle + Math.PI / 2) * 2, 2 + Math.random() * 2, '#795548', 25 + Math.random() * 15));
    }
    this.plateCracks.push({ timer: 40, x: CX, y: CY, r: UNIT });
    this.crackTimer = 40;
    this.showMessage('📏 盘子缩小！活动范围减少！', 200);
  }

  checkMilestones() {
    for (const m of MILESTONES) {
      const uid = m.reward + '_' + m.time + '_' + m.kills;
      if (this.claimedMilestones.includes(uid)) continue;
      const timeMet = m.time > 0 && this.survivalTime >= m.time;
      const killsMet = m.kills > 0 && this.sessionKills >= m.kills;
      if (timeMet || killsMet) {
        this.claimedMilestones.push(uid);
        this.applyMilestoneReward(m);
        SFX.milestone();
        this.showMessage(`🏅 ${m.icon} ${m.label}: ${m.desc}`, 180);
      }
    }
  }

  applyMilestoneReward(m) {
    switch (m.reward) {
      case 'speed_boost':
        this.speedBoostTimer = 600; // 10 seconds
        this.egg.speedMult = 1.5;
        break;
      case 'plate_expand':
        if (UNIT < this.defaultUnit) {
          UNIT = Math.min(this.defaultUnit, UNIT + SIZE * 0.035);
          for (let i = 0; i < 8; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = UNIT;
            this.particles.push(acquireParticle(
              CX + Math.cos(angle) * dist, CY + Math.sin(angle) * dist,
              Math.cos(angle + Math.PI) * 3, Math.sin(angle + Math.PI) * 3,
              3, '#81c784', 30));
          }
        }
        break;
      case 'splash_range':
        this.egg.splashRangeBuff = 900; // 15 seconds
        break;
      case 'splash_power':
        this.egg.splashPowerBuff = 900;
        break;
      case 'shield':
        this.shieldTimer = 300; // 5 seconds
        break;
    }
  }

  triggerVictory() {
    this.goalReached = true;
    this.state = 'victory';
    this.victoryState = 'incoming';
    this.victoryTimer = 600;
    this.reinforcements = [];
    SFX.stopBGM();
    SFX.victory();
    this.showMessage('🎉 援军到达！蛋蛋大军降临！', 180);
    const [base, shadow] = this.egg.getSkinColor();
    // Generate random non-overlapping parking angles around the egg
    const count = this.tomatoes.length;
    const orbitDist = EGG_R * 3.5;
    const minGap = 2 * EGG_R / orbitDist;
    const orbitAngles = [];
    for (let j = 0; j < count; j++) {
      let a, attempts = 0;
      do {
        a = Math.random() * Math.PI * 2;
        attempts++;
      } while (attempts < 50 && orbitAngles.some(existing => {
        const diff = Math.abs(a - existing);
        return Math.min(diff, Math.PI * 2 - diff) < minGap;
      }));
      orbitAngles.push(a);
    }
    // Assign each tomato to a reinforcement egg
    for (let i = 0; i < count; i++) {
      const t = this.tomatoes[i];
      t.flash = 20;
      t.vel = t.pos.sub(this.egg.pos).norm().scale(-5);
      const angle = Math.PI * (0.6 + Math.random() * 0.8);
      const dist = SIZE * 0.3;
      const startX = CX + Math.cos(angle) * dist;
      const startY = CY + Math.sin(angle) * dist;
      this.reinforcements.push({
        pos: new Vec2(startX, startY),
        gatherTarget: new Vec2(
          this.egg.pos.x + Math.cos(orbitAngles[i]) * orbitDist + (Math.random() - 0.5) * EGG_R,
          this.egg.pos.y + Math.sin(orbitAngles[i]) * orbitDist + (Math.random() - 0.5) * EGG_R),
        target: t,
        baseColor: base,
        shadowColor: shadow,
        skin: this.egg.skin,
        phase: 'gathering',
        delay: i * 5,
        wobblePhase: Math.random() * Math.PI * 2,
        wobbleAmp: 1.5 + Math.random() * 2,
      });
    }
  }

  updateVictory(dt) {
    this.victoryTimer--;
    if (this.victoryTimer > 500) {
      // Phase 1: Reinforcements fly toward the player's egg
      this.victoryState = 'incoming';
      for (const r of this.reinforcements) {
        if (r.delay > 0) { r.delay--; continue; }
        if (r.phase !== 'gathering') continue;
        const diff = r.gatherTarget.sub(r.pos);
        if (diff.len() > 5) {
          const dir = diff.norm();
          const perp = new Vec2(-dir.y, dir.x);
          const wobble = Math.sin(Date.now() * 0.005 + r.wobblePhase) * r.wobbleAmp;
          r.pos = r.pos.add(diff.scale(0.08)).add(perp.scale(wobble));
        } else {
          r.phase = 'incoming';
        }
      }
      if (this.victoryTimer % 2 === 0) {
        for (const r of this.reinforcements) {
          if (r.phase === 'gathering' && r.delay <= 0) {
            this.particles.push(acquireParticle(
              r.pos.x + (Math.random() - 0.5) * 6,
              r.pos.y + (Math.random() - 0.5) * 6,
              0, 0, 3, r.baseColor, 15));
          }
        }
      }
    } else if (this.victoryTimer > 250) {
      // Phase 2: Fly to tomato → attack immediately on arrival
      this.victoryState = 'incoming';
      // Force any stragglers still gathering to start attacking
      for (const r of this.reinforcements) {
        if (r.phase === 'gathering') r.phase = 'incoming';
      }
      const splashRange = UNIT * 0.22;
      for (const r of this.reinforcements) {
        if (r.phase !== 'incoming') continue;
        if (r.target.hp <= 0) {
          const alive = this.tomatoes.filter(t => t.hp > 0);
          if (alive.length > 0) {
            r.target = alive.reduce((a, b) => r.pos.distTo(a.pos) < r.pos.distTo(b.pos) ? a : b);
          } else {
            r.phase = 'done'; continue;
          }
        }
        const diff = r.target.pos.sub(r.pos);
        if (diff.len() > splashRange) {
          const dir = diff.norm();
          const perp = new Vec2(-dir.y, dir.x);
          const wobble = Math.sin(Date.now() * 0.008 + r.wobblePhase) * (r.wobbleAmp + 1);
          r.pos = r.pos.add(diff.scale(0.06)).add(perp.scale(wobble));
        } else {
          // Attack immediately: egg splash centered on target tomato
          const splashPos = r.target.pos;
          SFX.splash();
          for (let j = 0; j < 30; j++) {
            const a = Math.PI * 2 / 30 * j + Math.random() * 0.15;
            const spd = 4 + Math.random() * 4;
            this.particles.push(acquireParticle(
              splashPos.x, splashPos.y,
              Math.cos(a) * spd, Math.sin(a) * spd,
              2 + Math.random() * 3, '#ffd600', 15 + Math.random() * 15));
          }
          this.particles.push(acquireParticle(
            splashPos.x, splashPos.y, 0, 0, 16, '#ffcc02', 10));
          this.killTomato(r.target, true);
          const range = UNIT * 0.5;
          for (const t of this.tomatoes) {
            if (t.hp <= 0) continue;
            const d = t.pos.distTo(splashPos);
            if (d < range) {
              const dir = t.pos.sub(splashPos).norm();
              const power = 1 - d / range;
              t.vel = dir.scale(8 + power * 14);
              t.flash = 14;
              if (t.shielded) {
                t.shielded = false;
                t.flash = 20;
              } else {
                t.hp -= Math.ceil((1 + power * 2));
              }
              if (t.hp <= 0) {
                this.killTomato(t, true);
              }
            }
          }
          r.phase = 'done';
        }
      }
      if (this.victoryTimer % 2 === 0) {
        for (const r of this.reinforcements) {
          if (r.phase === 'incoming') {
            this.particles.push(acquireParticle(
              r.pos.x + (Math.random() - 0.5) * 6,
              r.pos.y + (Math.random() - 0.5) * 6,
              0, 0, 3, r.baseColor, 15));
          }
        }
      }
      // Early exit: all reinforcements done
      if (this.reinforcements.every(r => r.phase === 'done')) {
        if (this.victoryExitTimer === 0) this.victoryExitTimer = 30;
        this.victoryExitTimer--;
        if (this.victoryExitTimer <= 0) { this._exitToVictoryScreen(); }
      }
    } else {
      // Phase 4: 胜利完成 → 继续处理剩余蛋，结束后跳转
      this.victoryState = 'complete';
      const splashRange = UNIT * 0.22;
      for (const r of this.reinforcements) {
        if (r.phase !== 'incoming') continue;
        if (r.target.hp <= 0) {
          const alive = this.tomatoes.filter(t => t.hp > 0);
          if (alive.length > 0) {
            r.target = alive.reduce((a, b) => r.pos.distTo(a.pos) < r.pos.distTo(b.pos) ? a : b);
          } else {
            r.phase = 'done'; continue;
          }
        }
        const diff = r.target.pos.sub(r.pos);
        if (diff.len() > splashRange) {
          const dir = diff.norm();
          const perp = new Vec2(-dir.y, dir.x);
          const wobble = Math.sin(Date.now() * 0.008 + r.wobblePhase) * (r.wobbleAmp + 1);
          r.pos = r.pos.add(diff.scale(0.06)).add(perp.scale(wobble));
        } else {
          const splashPos = r.target.pos;
          for (let j = 0; j < 20; j++) {
            const a = Math.PI * 2 / 20 * j + Math.random() * 0.15;
            const spd = 3 + Math.random() * 3;
            this.particles.push(acquireParticle(
              splashPos.x, splashPos.y,
              Math.cos(a) * spd, Math.sin(a) * spd,
              2 + Math.random() * 3, '#ffd600', 15 + Math.random() * 15));
          }
          this.particles.push(acquireParticle(splashPos.x, splashPos.y, 0, 0, 12, '#ffcc02', 8));
          this.killTomato(r.target, true);
          const range = UNIT * 0.5;
          for (const t of this.tomatoes) {
            if (t.hp <= 0) continue;
            if (t.pos.distTo(splashPos) < range) {
              const power = 1 - t.pos.distTo(splashPos) / range;
              t.vel = t.pos.sub(splashPos).norm().scale(8 + power * 14);
              t.flash = 14;
              if (t.shielded) { t.shielded = false; t.flash = 20; }
              else { t.hp -= Math.ceil((1 + power * 2)); }
              if (t.hp <= 0) this.killTomato(t, true);
            }
          }
          r.phase = 'done';
        }
      }
      if (this.victoryTimer <= 0) {
        this._exitToVictoryScreen();
      } else if (this.reinforcements.every(r => r.phase === 'done')) {
        if (this.victoryExitTimer === 0) this.victoryExitTimer = 30;
        this.victoryExitTimer--;
        if (this.victoryExitTimer <= 0) { this._exitToVictoryScreen(); }
      }
    }
  }

  _exitToVictoryScreen() {
    this.pushDebugData();
    HLRecorder.stop();
    this.totalGamesPlayed++;
    this.totalSurvivalTime += this.survivalTime;
    if (this.survivalTime > this.bestTime) this.bestTime = this.survivalTime;
    if (!this.splashUsedThisRound && this.survivalTime > this.bestNoSplashTime) this.bestNoSplashTime = this.survivalTime;
    if (this.perfectRoundThisRound && this.survivalTime > this.bestPerfectTime) this.bestPerfectTime = this.survivalTime;
    this.survivalHistory.push(Math.floor(this.survivalTime));
    if (this.survivalHistory.length > 50) this.survivalHistory.shift();
    this.saveProgress();
    this.checkAchievements();
    this.state = 'victoryscreen';
  }

  _updateParticles() {
    let writeIdx = 0;
    for (let i = 0; i < this.particles.length; i++) {
      const p = this.particles[i];
      if (p.life <= 0) { p.release(); continue; }
      p.update();
      if (p.life <= 0) { p.release(); continue; }
      this.particles[writeIdx++] = p;
    }
    this.particles.length = writeIdx;
  }

  _buildBgCache() {
    const bc = this._bgCtx;
    bc.clearRect(0, 0, CW, CH);
    bc.shadowColor = 'rgba(0,0,0,.1)';
    bc.shadowBlur = 8;
    const pw = CW - PLATE_MARGIN * 2, ph = CH - PLATE_MARGIN * 2;
    bc.beginPath();
    bc.roundRect(PLATE_MARGIN, PLATE_MARGIN, pw, ph, 14);
    bc.fillStyle = '#fafffe';
    bc.fill();
    bc.shadowBlur = 0;
    bc.beginPath();
    bc.roundRect(PLATE_MARGIN, PLATE_MARGIN, pw, ph, 14);
    bc.strokeStyle = '#c8e6c9';
    bc.lineWidth = 3;
    bc.stroke();
    bc.beginPath();
    bc.roundRect(PLATE_MARGIN + 6, PLATE_MARGIN + 6, pw - 12, ph - 12, 10);
    bc.strokeStyle = '#e8f5e9';
    bc.lineWidth = 1;
    bc.stroke();
    this._bgDirty = false;
  }

  draw() {
    ctx.clearRect(0, 0, CW, CH);
    if (this.state === 'menu') { this.drawMenu(); this.drawTransitionOverlay(); if (this.showHighlightGallery) this.drawHighlightGallery(); return; }
    if (this.state === 'gameover') { this.drawGameOver(); this.drawTransitionOverlay(); if (this.showHighlightGallery) this.drawHighlightGallery(); return; }
    if (this.state === 'victoryscreen') { this.drawVictoryScreen(); this.drawTransitionOverlay(); if (this.showHighlightGallery) this.drawHighlightGallery(); return; }
    if (this.state === 'shop' || this.state === 'preshop') { this.drawShopField(); this.drawShop(); this.drawTransitionOverlay(); if (this.showTutorial) this.drawTutorial(); return; }

    ctx.fillStyle = '#f5f5f5';
    ctx.fillRect(0, 0, CW, CH);

    // Draw cached background (plate + border)
    if (this._bgDirty) this._buildBgCache();
    ctx.drawImage(this._bgCanvas, 0, 0);

    // Plate crack overlay
    for (const crack of this.plateCracks) {
      const a = Math.min(1, crack.timer / 40);
      ctx.strokeStyle = `rgba(121,85,72,${a * 0.3})`;
      ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const angle = Math.PI * 2 / 6 * i + Math.sin(Date.now() / 200 + i) * 0.2;
        const inner = UNIT * 0.85;
        const outer = UNIT + 4;
        ctx.beginPath();
        ctx.moveTo(CX + Math.cos(angle) * inner, CY + Math.sin(angle) * inner);
        ctx.lineTo(CX + Math.cos(angle) * outer, CY + Math.sin(angle) * outer);
        ctx.stroke();
      }
    }

    if (this.nearMissTimer > 20) {
      ctx.fillStyle = `rgba(255, 255, 255, ${(this.nearMissTimer - 20) / 40})`;
      ctx.fillRect(0, 0, CW, CH);
    }

    for (let t of this.tomatoes) t.draw();
    const drawCharge = this.isCharging ? Math.min(1, Math.max(0, (Date.now() - this.chargeStartTime - 200) / 1800)) : 0;
    this.egg.draw(drawCharge);
    // Shield active visual
    if (this.shieldTimer > 0) {
      const pulse = Math.sin(Date.now() / 80) * 0.15 + 0.85;
      const a = Math.min(1, this.shieldTimer / 60) * pulse;
      ctx.save();
      ctx.shadowColor = 'rgba(79,195,247,.6)';
      ctx.shadowBlur = 12;
      ctx.strokeStyle = `rgba(79,195,247,${a * .5})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(this.egg.pos.x, this.egg.pos.y, this.egg.r * 1.6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = `rgba(179,229,252,${a * .3})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.egg.pos.x, this.egg.pos.y, this.egg.r * 1.8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      // Small rotating dots
      for (let i = 0; i < 4; i++) {
        const angle = Date.now() / 200 + i * Math.PI / 2;
        const dotR = this.egg.r * 1.6;
        ctx.fillStyle = `rgba(179,229,252,${a * .8})`;
        ctx.beginPath();
        ctx.arc(this.egg.pos.x + Math.cos(angle) * dotR, this.egg.pos.y + Math.sin(angle) * dotR, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // Fire shell visual
    if (this.fireShellTimer > 0) {
      const pulse = Math.sin(Date.now() / 50) * 0.3 + 0.7;
      ctx.save();
      ctx.shadowColor = 'rgba(255,80,0,.7)';
      ctx.shadowBlur = 15;
      ctx.strokeStyle = `rgba(255,${Math.floor(120 + pulse * 100)},0,${0.4 + pulse * 0.4})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(this.egg.pos.x, this.egg.pos.y, this.egg.r * 1.6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 20;
      ctx.strokeStyle = `rgba(255,${Math.floor(200 + pulse * 55)},0,${0.2 + pulse * 0.2})`;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(this.egg.pos.x, this.egg.pos.y, this.egg.r * 2.0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
      // Fire particles around egg (continuous)
      for (let i = 0; i < 6; i++) {
        const a = Date.now() / 200 + i * 1.2;
        const dist = this.egg.r * (1.2 + Math.sin(Date.now() / 100 + i) * 0.6);
        ctx.fillStyle = `rgba(255,${Math.floor(80 + Math.random() * 120)},0,${0.4 + Math.random() * 0.5})`;
        ctx.beginPath();
        ctx.arc(this.egg.pos.x + Math.cos(a) * dist, this.egg.pos.y + Math.sin(a) * dist, 3 + Math.random() * 4, 0, Math.PI * 2);
        ctx.fill();
      }
      // Fire shell timer text above egg
      const remain = Math.ceil(this.fireShellTimer / 60);
      ctx.save();
      ctx.shadowColor = 'rgba(255,80,0,0.8)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#ff6f00';
      ctx.font = `bold ${SIZE * .045}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText(`🔥 ${remain}s`, this.egg.pos.x, this.egg.pos.y - this.egg.r * 2.8);
      ctx.shadowBlur = 0;
      ctx.restore();
    }
    // Repulse shockwave ring (expanding)
    if (this.repulseRing) {
      const r = this.repulseRing.radius;
      const a = this.repulseRing.alpha;
      ctx.save();
      ctx.shadowColor = `rgba(255,255,255,${a * 0.5})`;
      ctx.shadowBlur = 12;
      ctx.strokeStyle = `rgba(255,255,255,${a * 0.6})`;
      ctx.lineWidth = 3 * a + 1;
      ctx.beginPath();
      ctx.arc(this.egg.pos.x, this.egg.pos.y, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = `rgba(227,242,253,${a * 0.3})`;
      ctx.lineWidth = 6 * a + 2;
      ctx.beginPath();
      ctx.arc(this.egg.pos.x, this.egg.pos.y, r * 0.7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    // Gravity field visual (swirl at egg position)
    if (this.gravityField && this.gravityField.timer > 0) {
      const gx = this.gravityField.x, gy = this.gravityField.y;
      const alive = this.gravityField.timer / 180;
      ctx.save();
      ctx.globalAlpha = 0.3 + 0.7 * alive;
      // Swirl particles
      for (let i = 0; i < 12; i++) {
        const a = Date.now() / 250 + i * Math.PI / 6;
        const dist = 5 + (1 - alive) * 40 + Math.sin(Date.now() / 150 + i * 2) * 10;
        ctx.fillStyle = `rgba(79,195,247,${0.2 + Math.sin(Date.now() / 80 + i) * 0.15})`;
        ctx.beginPath();
        ctx.arc(gx + Math.cos(a) * dist, gy + Math.sin(a) * dist, 2 + Math.random() * 3, 0, Math.PI * 2);
        ctx.fill();
      }
      // Spiral arcs
      ctx.strokeStyle = `rgba(79,195,247,${0.15 + 0.2 * alive})`;
      ctx.lineWidth = 3;
      for (let i = 0; i < 4; i++) {
        const r = 10 + i * 14 + Math.sin(Date.now() / 300 + i * 1.5) * 6;
        ctx.globalAlpha = (0.1 + 0.25 * alive) * (1 - i / 5);
        ctx.beginPath();
        ctx.arc(gx, gy, r, Date.now() / 400 + i * 1.2, Date.now() / 400 + i * 1.2 + Math.PI * 1.5);
        ctx.stroke();
      }
      ctx.restore();
      // Pull-in lines from nearby tomatoes
      ctx.save();
      ctx.strokeStyle = `rgba(79,195,247,${0.08 * alive})`;
      ctx.lineWidth = 1;
      for (const t of this.tomatoes) {
        const d = Math.hypot(t.pos.x - gx, t.pos.y - gy);
        if (d < UNIT * 1.5) {
          ctx.beginPath();
          ctx.moveTo(t.pos.x, t.pos.y);
          ctx.lineTo(gx, gy);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
    // Charge direction arrow (王者荣耀风格) + charge progress
    if (this.isCharging) {
      const elapsed = Date.now() - this.chargeStartTime;
      const charge = Math.min(1, Math.max(0, (elapsed - 200) / 1800));
      // Charge progress ring around egg
      const barR = this.egg.r * 2;
      const barColor = charge > 0.7 ? '#81c784' : charge > 0.3 ? '#ffd54f' : '#ef5350';
      ctx.shadowColor = barColor;
      ctx.shadowBlur = 5;
      ctx.strokeStyle = barColor;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(this.egg.pos.x, this.egg.pos.y, barR, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * charge);
      ctx.stroke();
      ctx.shadowBlur = 0;
      // Background ring
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.egg.pos.x, this.egg.pos.y, barR, 0, Math.PI * 2);
      ctx.stroke();
    }
    // Cartoon direction line + landing prediction
    if (this.chargeActive) {
      const dir = this.chargeDirection;
      const len = Math.sqrt(dir.x * dir.x + dir.y * dir.y);
      if (len > 1 && !this.isJumping) {
        const charge = Math.min(1, Math.max(0, (Date.now() - this.chargeStartTime - 200) / 1800));
        const nx = dir.x / len, ny = dir.y / len;
        const pw = CW - PLATE_MARGIN * 2, ph = CH - PLATE_MARGIN * 2;
        const totalDist = Math.sqrt(pw * pw + ph * ph) * charge;
        if (totalDist >= 5) {
          const path = this.computeJumpPath(this.egg.pos.x, this.egg.pos.y, nx, ny, totalDist);
          const lastSeg = path[path.length - 1];
          if (lastSeg) {
            const lx = lastSeg.x2, ly = lastSeg.y2;
            const color = charge > 0.7 ? '#81c784' : charge > 0.3 ? '#ffd54f' : '#ef5350';
            ctx.save();
            // Thick cartoon trajectory line (solid, rounded caps, glow)
            ctx.shadowColor = color;
            ctx.shadowBlur = 8;
            ctx.strokeStyle = `rgba(255,255,200,${0.4 + charge * 0.4})`;
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(this.egg.pos.x, this.egg.pos.y);
            for (const s of path) ctx.lineTo(s.x2, s.y2);
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.lineCap = 'butt';
            // Big rounded arrowhead
            const arrowSize = 10 + charge * 6;
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.8 + charge * 0.2;
            const sx = path.length > 1 ? path[path.length - 2].x2 : this.egg.pos.x;
            const sy = path.length > 1 ? path[path.length - 2].y2 : this.egg.pos.y;
            const adx = lx - sx, ady = ly - sy;
            const alen = Math.hypot(adx, ady);
            if (alen > 1) {
              const anx = adx / alen, any = ady / alen;
              const aw = 0.45;
              ctx.beginPath();
              ctx.moveTo(lx, ly);
              ctx.quadraticCurveTo(
                lx - anx * arrowSize * 0.7 + any * arrowSize * aw,
                ly - any * arrowSize * 0.7 - anx * arrowSize * aw,
                lx - anx * arrowSize * 1.3,
                ly - any * arrowSize * 1.3
              );
              ctx.quadraticCurveTo(
                lx - anx * arrowSize * 0.7 - any * arrowSize * aw,
                ly - any * arrowSize * 0.7 + anx * arrowSize * aw,
                lx, ly
              );
              ctx.closePath();
              ctx.fill();
            }
            ctx.restore();
            // Landing point indicator (egg-shaped shadow + crosshair)
            ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 5;
            ctx.fillStyle = `rgba(255,255,200,${0.15 + charge * 0.15})`;
            ctx.beginPath();
            ctx.ellipse(lx, ly + this.egg.r * 0.3, this.egg.r * 0.8, this.egg.r * 0.4, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = `rgba(255,255,200,${0.2 + charge * 0.2})`;
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 6]);
            ctx.beginPath();
            ctx.arc(lx, ly, this.egg.r * 0.5, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
            // Sparkle dots along the path
            for (let i = 0; i < 4; i++) {
              const t = (i + 1) / 5;
              let aa = 0, spx = this.egg.pos.x, spy = this.egg.pos.y;
              for (const s of path) {
                const sdx = s.x2 - s.x1, sdy = s.y2 - s.y1;
                const slen = Math.hypot(sdx, sdy);
                const next = aa + slen;
                if (next >= t * totalDist || s === path[path.length - 1]) {
                  const p = slen > 0 ? (t * totalDist - aa) / slen : 0;
                  spx = s.x1 + sdx * Math.max(0, Math.min(1, p));
                  spy = s.y1 + sdy * Math.max(0, Math.min(1, p));
                  break;
                }
                aa = next;
              }
              const sz = i === 0 || i === 2 ? 3 : 2;
              ctx.fillStyle = `rgba(255,255,200,${0.2 + charge * 0.3})`;
              ctx.beginPath();
              ctx.arc(spx, spy, sz, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
      }
    }
    // Jump shadow on plate
    if (this.isJumping && this.jumpPath.length > 0) {
      const pf = Math.min(1, this.jumpTimer / this.jumpTotalFrames);
      const td = pf * this.jumpTotalDist;
      let aa = 0, si = 0, sp = 0;
      for (let i = 0; i < this.jumpPath.length; i++) {
        const s = this.jumpPath[i];
        const sdx = s.x2 - s.x1, sdy = s.y2 - s.y1;
        const slen = Math.sqrt(sdx * sdx + sdy * sdy);
        if (aa + slen >= td || i === this.jumpPath.length - 1) {
          si = i; sp = slen > 0 ? (td - aa) / slen : 0;
          break;
        }
        aa += slen;
      }
      const ss = this.jumpPath[si];
      const sx = ss.x1 + (ss.x2 - ss.x1) * Math.max(0, Math.min(1, sp));
      const sy = ss.y1 + (ss.y2 - ss.y1) * Math.max(0, Math.min(1, sp));
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath();
      ctx.ellipse(sx, sy, this.egg.r * 0.6, this.egg.r * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // Batch particles by color to reduce fillStyle changes
    const pLen = this.particles.length;
    if (pLen > 0) {
      const pMap = {};
      for (let i = 0; i < pLen; i++) {
        const p = this.particles[i];
        if (p.glow) { p.draw(); continue; }
        const c = p.color;
        if (!pMap[c]) pMap[c] = [];
        pMap[c].push(p);
      }
      for (const c in pMap) {
        const list = pMap[c];
        ctx.fillStyle = c;
        for (let j = 0; j < list.length; j++) {
          const p = list[j];
          const a = p.life / p.maxLife;
          ctx.globalAlpha = a;
          ctx.beginPath();
          ctx.arc(p.pos.x, p.pos.y, p.r * a, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    }

    // Lightning bolts
    for (const bolt of this.lightningBolts) {
      const alpha = Math.min(1, bolt.timer / 10);
      ctx.save();
      ctx.shadowColor = 'rgba(255,235,59,.8)';
      ctx.shadowBlur = 10;
      ctx.strokeStyle = `rgba(255,255,200,${alpha})`;
      ctx.lineWidth = 2.5;
      for (let i = 0; i < bolt.points.length - 1; i++) {
        const from = bolt.points[i], to = bolt.points[i+1];
        const dx = to.x - from.x, dy = to.y - from.y;
        const dist = Math.hypot(dx, dy);
        const segs = Math.max(4, Math.floor(dist / 6));
        let px = from.x, py = from.y;
        for (let j = 0; j < segs; j++) {
          const t2 = (j + 1) / segs;
          const bx = from.x + dx * t2 + (Math.random() - 0.5) * 12;
          const by = from.y + dy * t2 + (Math.random() - 0.5) * 12;
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(bx, by);
          ctx.stroke();
          px = bx; py = by;
        }
      }
      ctx.shadowBlur = 15;
      ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.6})`;
      ctx.lineWidth = 1;
      for (let i = 0; i < bolt.points.length - 1; i++) {
        const from = bolt.points[i], to = bolt.points[i+1];
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    for (const a of this.artifacts) {
      const bob = Math.sin(Date.now() / 200 + a.phase) * 3;
      const ay = a.y + bob;
      ctx.save();
      ctx.shadowColor = 'rgba(255,215,0,.6)';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#fff8e1';
      ctx.beginPath();
      ctx.arc(a.x, ay, a.r + 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,215,0,.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(a.x, ay, a.r + 4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#333';
      ctx.font = `${a.r * 1.5}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(a.type.icon, a.x, ay);
      ctx.textBaseline = 'alphabetic';
    }

    // === Gold popups ===
    for (const p of this.goldPopups) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, p.timer / 20);
      ctx.fillStyle = '#ffd700';
      ctx.font = `bold ${SIZE * .03}px Arial`;
      ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,.3)';
    ctx.shadowBlur = 3;
    ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    }

    // === Reinforcements (victory animation) ===
    const _isVictoryEmote = this.state === 'victory' || this.state === 'victoryscreen';
    for (const r of this.reinforcements) {
      const base = r.baseColor;
      const shadow = r.shadowColor;
      const sz = EGG_R;
      ctx.shadowColor = 'rgba(0,0,0,.15)';
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.ellipse(r.pos.x, r.pos.y, sz * 1.05, sz * 1.1, 0, 0, Math.PI * 2);
      ctx.fillStyle = shadow;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.ellipse(r.pos.x, r.pos.y - sz * 0.05, sz, sz * 1.05, 0, 0, Math.PI * 2);
      ctx.fillStyle = base;
      ctx.fill();
      // 3D shading
      const grad = ctx.createRadialGradient(
        r.pos.x - sz * 0.25, r.pos.y - sz * 0.3, 0,
        r.pos.x, r.pos.y, sz * 1.0);
      grad.addColorStop(0, 'rgba(255,255,255,.2)');
      grad.addColorStop(0.4, 'rgba(255,255,255,0)');
      grad.addColorStop(0.7, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,.1)');
      ctx.fillStyle = grad;
      ctx.fill();
      // Glossy highlight
      ctx.beginPath();
      ctx.ellipse(r.pos.x - sz * 0.25, r.pos.y - sz * 0.4, sz * 0.2, sz * 0.09, -0.3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.fill();
      // Skin-specific yolk features
      if (r.skin === '煎荷包蛋') {
        ctx.beginPath();
        ctx.arc(r.pos.x, r.pos.y + sz * 0.05, sz * 0.55, 0, Math.PI * 2);
        ctx.fillStyle = '#ffb300';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(r.pos.x, r.pos.y + sz * 0.05, sz * 0.45, 0, Math.PI * 2);
        ctx.fillStyle = '#ff8f00';
        ctx.fill();
      } else if (r.skin === '溏心蛋') {
        ctx.fillStyle = '#ffb300';
        ctx.beginPath();
        ctx.arc(r.pos.x, r.pos.y + sz * 0.02, sz * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff8f00';
        ctx.beginPath();
        ctx.arc(r.pos.x, r.pos.y + sz * 0.02, sz * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
      // Eyes
      const eyeY = r.pos.y - sz * 0.12;
      const eyeSep = sz * 0.28;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(r.pos.x - eyeSep, eyeY, sz * 0.15, sz * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(r.pos.x + eyeSep, eyeY, sz * 0.15, sz * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.arc(r.pos.x - eyeSep, eyeY, sz * 0.09, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(r.pos.x + eyeSep, eyeY, sz * 0.09, 0, Math.PI * 2);
      ctx.fill();
      // Eye shine
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(r.pos.x - eyeSep - sz * 0.03, eyeY - sz * 0.04, sz * 0.035, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(r.pos.x + eyeSep - sz * 0.03, eyeY - sz * 0.04, sz * 0.035, 0, Math.PI * 2);
      ctx.fill();
      // Blush
      ctx.fillStyle = 'rgba(255,140,140,.25)';
      ctx.beginPath();
      ctx.ellipse(r.pos.x - sz * 0.36, r.pos.y + sz * 0.08, sz * 0.14, sz * 0.09, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(r.pos.x + sz * 0.36, r.pos.y + sz * 0.08, sz * 0.14, sz * 0.09, 0, 0, Math.PI * 2);
      ctx.fill();
      // Mouth: big happy smile during victory preview, small neutral otherwise
      if (_isVictoryEmote) {
        const mouthY = r.pos.y + sz * 0.2;
        ctx.fillStyle = '#e07040';
        ctx.beginPath();
        ctx.moveTo(r.pos.x - sz * 0.22, mouthY);
        ctx.quadraticCurveTo(r.pos.x, mouthY + sz * 0.28, r.pos.x + sz * 0.22, mouthY);
        ctx.quadraticCurveTo(r.pos.x, mouthY + sz * 0.12, r.pos.x - sz * 0.22, mouthY);
        ctx.fill();
        // Add a small tongue highlight
        ctx.fillStyle = 'rgba(255,200,160,0.9)';
        ctx.beginPath();
        ctx.ellipse(r.pos.x, mouthY + sz * 0.06, sz * 0.08, sz * 0.04, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.strokeStyle = '#c62828';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(r.pos.x, r.pos.y + sz * .18, sz * .12, 0.12, Math.PI - 0.12);
        ctx.stroke();
      }
      // Target line (during incoming phases)
      if ((r.phase === 'gathering' || r.phase === 'incoming') && r.target && r.target.hp > 0) {
        ctx.strokeStyle = 'rgba(255,215,0,0.3)';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 5]);
        ctx.beginPath();
        ctx.moveTo(r.pos.x, r.pos.y);
        ctx.lineTo(r.target.pos.x, r.target.pos.y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // === HUD Left ===
    const secs = Math.floor(this.survivalTime);
    // HP bar
    const hpTarget = this.egg.hp / this.egg.maxHp;
    this.hpBarDisplay += (hpTarget - this.hpBarDisplay) * 0.1;
    if (Math.abs(this.hpBarDisplay - hpTarget) < 0.01) this.hpBarDisplay = hpTarget;
    const hpW = SIZE * .2, hpH = 8;
    const hpX = SIZE * .06, hpY = SIZE * .06;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.08)';
    ctx.shadowBlur = 2;
    ctx.fillStyle = '#c8e6c9';
    ctx.beginPath();
    ctx.roundRect(hpX, hpY, hpW, hpH, 4);
    ctx.fill();
    ctx.fillStyle = this.egg.hp / this.egg.maxHp > .3 ? '#81c784' : '#ef9a9a';
    ctx.beginPath();
    ctx.roundRect(hpX, hpY, hpW * this.hpBarDisplay, hpH, 4);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
    this.drawPillText(`❤ ${this.egg.hp}/${this.egg.maxHp}`, hpX + hpW + SIZE * .015, hpY + hpH * 0.5,
      { bg: 'rgba(0,0,0,0)', fg: '#4a7c59', size: SIZE * .026, align: 'left' });
    // Timer (center) — circular ring for challenge mode
    if (this.challengeGoal > 0) {
      const ringR = SIZE * .055;
      const ringX = CX;
      const ringY = SIZE * .13;
      const progress = Math.min(1, this.survivalTime / this.challengeGoal);
      const startAngle = -Math.PI / 2;
      const endAngle = startAngle + Math.PI * 2 * progress;
      const remain = Math.max(0, this.challengeGoal - secs);
      const color = progress >= 1 ? '#ffd700' : '#81c784';
      // Background ring
      ctx.save();
      ctx.globalAlpha = .2;
      ctx.strokeStyle = '#a5d6a7';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(ringX, ringY, ringR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      // Progress ring
      ctx.strokeStyle = color;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(ringX, ringY, ringR, startAngle, endAngle);
      ctx.stroke();
      ctx.lineCap = 'butt';
      // Glow dot at tip when close
      if (progress > 0.8 && progress < 1) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(ringX + Math.cos(endAngle) * ringR, ringY + Math.sin(endAngle) * ringR, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      // Time text inside ring (countdown)
      ctx.fillStyle = progress >= 1 ? '#ffd700' : '#4a7c59';
      ctx.font = `bold ${SIZE * .032}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${remain}s`, ringX, ringY);
      ctx.textBaseline = 'alphabetic';
      ctx.restore();
    } else {
      this.drawPillText(`♾️ ${secs}秒`, CX, SIZE * .085,
        { bg: 'rgba(0,0,0,0)', fg: '#4a7c59', size: SIZE * .032, align: 'center' });
    }
    // Wave intensity preview
    if (this.gameMode !== 'endless' && this.waveState === 'preparing') {
      const intensityLabel = this.waveIntensity > 1.2 ? '🔥 猛烈' : this.waveIntensity < 0.8 ? '🌱 平缓' : '⚔️ 普通';
      const intensityColor = this.waveIntensity > 1.2 ? '#ef5350' : this.waveIntensity < 0.8 ? '#66bb6a' : '#8aa899';
      this.drawPillText(`⚠️ 下一波: ${intensityLabel}`, SIZE * .06, SIZE * .135,
        { bg: 'rgba(0,0,0,0)', fg: intensityColor, size: SIZE * .024, align: 'left' });
    } else if (this.gameMode !== 'endless' && this.waveState === 'attacking') {
      const intensityLabel = this.waveIntensity > 1.2 ? '🔥 猛攻' : this.waveIntensity < 0.8 ? '🌱 休整' : '⚔️ 推进';
      const intensityColor = this.waveIntensity > 1.2 ? '#ef5350' : this.waveIntensity < 0.8 ? '#66bb6a' : '#ffa726';
      this.drawPillText(intensityLabel, SIZE * .06, SIZE * .135,
        { bg: 'rgba(0,0,0,0)', fg: intensityColor, size: SIZE * .024, align: 'left' });
    }
    // Buffs row
    let buffX = SIZE * .06;
    if (this.shieldTimer > 0) {
      this.drawPillText(`🛡 ${Math.ceil(this.shieldTimer / 60)}s`, buffX, SIZE * .17,
        { bg: 'rgba(0,0,0,0)', fg: '#4fc3f7', size: SIZE * .022, align: 'left' });
      buffX += SIZE * .1;
    }
    if (this.dashCooldown > 0) {
      this.drawPillText(`💨 ${Math.ceil(this.dashCooldown / 60)}s`, buffX, SIZE * .17,
        { bg: 'rgba(0,0,0,0)', fg: '#b3e5fc', size: SIZE * .022, align: 'left' });
    }
    if (this.speedBoostTimer > 0) {
      this.drawPillText(`⚡ 加速 ${Math.ceil(this.speedBoostTimer / 60)}s`, buffX > SIZE * .06 ? buffX + SIZE * .1 : buffX, SIZE * .17,
        { bg: 'rgba(0,0,0,0)', fg: '#ffa726', size: SIZE * .022, align: 'left' });
    }
    // Right side
    this.drawPillText(`💰 ${this.gold}`, CW - SIZE * .06, SIZE * .06,
      { bg: 'rgba(0,0,0,0)', fg: '#ffd700', size: SIZE * .035, align: 'right' });
    this.drawPillText(`击杀: ${this.sessionKills}`, CW - SIZE * .06, SIZE * .10,
      { bg: 'rgba(0,0,0,0)', fg: '#8aa899', size: SIZE * .025, align: 'right' });
    const skinLabel = { 普通蛋: '普通蛋', 茶叶蛋: '茶叶蛋', 煎荷包蛋: '煎荷包蛋', 溏心蛋: '溏心蛋' };
    this.drawPillText(skinLabel[this.egg.skin] || '普通蛋', CW - SIZE * .06, SIZE * .14,
      { bg: 'rgba(0,0,0,0)', fg: '#8aa899', size: SIZE * .025, align: 'right' });

    // Artifact backpack (王者荣耀装备栏风格)
    const bpY = CH - SIZE * .04;
    let bpX = CX;
    const hasRange = this.egg.splashRangeBuff > 0;
    const hasPower = this.egg.splashPowerBuff > 0;
    const bpItems = [];
    if (this.storedShield > 0) bpItems.push({ icon: '🛡️', label: `x${this.storedShield}`, color: '#4fc3f7' });
    if (hasRange) bpItems.push({ icon: '💫', label: `${Math.ceil(this.egg.splashRangeBuff / 60)}s`, color: '#81d4fa' });
    if (hasPower) bpItems.push({ icon: '💢', label: `${Math.ceil(this.egg.splashPowerBuff / 60)}s`, color: '#ffd54f' });
    if (this.fireShellTimer > 0) bpItems.push({ icon: '🔥', label: `${Math.ceil(this.fireShellTimer / 60)}s`, color: '#ff6f00' });
    if (this.chainLightningStored > 0) bpItems.push({ icon: '⚡', label: `x${this.chainLightningStored}`, color: '#fdd835' });
    if (bpItems.length > 0) {
      const totalW = bpItems.length * SIZE * .08;
      let itemX = bpX - totalW / 2;
      for (const item of bpItems) {
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.roundRect(itemX - SIZE * .005, bpY - SIZE * .02, SIZE * .075, SIZE * .035, 4);
        ctx.fill();
        ctx.fillStyle = item.color;
        ctx.font = `${SIZE * .024}px Arial`;
        ctx.textAlign = 'center';
        ctx.fillText(item.icon, itemX + SIZE * .018, bpY + SIZE * .002);
        ctx.fillText(item.label, itemX + SIZE * .048, bpY + SIZE * .002);
        itemX += SIZE * .08;
      }
    }

    if (this.messageTimer > 0) {
      ctx.fillStyle = this.goalReached ? '#ffd700' : '#ff8a65';
      ctx.font = `bold ${SIZE * .07}px Arial`;
      ctx.textAlign = 'center';
      ctx.globalAlpha = Math.min(1, this.messageTimer / 20);
      const msgLines = wrapText(ctx, this.message, CW - PLATE_MARGIN * 2);
      msgLines.forEach((line, i) => {
        ctx.fillText(line, CX, SIZE * .30 + i * SIZE * .08);
      });
      ctx.globalAlpha = 1;
    }

    // Tip messages (tutorial)
    if (this.tipQueue.length > 0 && this.tipTimer > 0) {
      ctx.fillStyle = '#90a4ae';
      ctx.font = `${SIZE * .03}px Arial`;
      ctx.textAlign = 'center';
      ctx.globalAlpha = Math.min(1, this.tipTimer / 20, (120 - this.tipTimer) / 20);
      const tipLines2 = wrapText(ctx, this.tipQueue[0], CW - PLATE_MARGIN * 2);
      tipLines2.forEach((line, i) => {
        ctx.fillText(line, CX, SIZE * .40 + i * SIZE * .04);
      });
      ctx.globalAlpha = 1;
    }

    // Splash range buff indicator — 显示实际攻击范围
    if (this.egg.splashRangeBuff > 0) {
      const range = UNIT * 0.25 * 2;  // 蓄满力最大范围
      const pulse2 = Math.sin(Date.now() / 150) * 0.2 + 0.8;
      ctx.strokeStyle = '#ffab00';
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.2 * pulse2;
      ctx.setLineDash([6, 8]);
      ctx.beginPath();
      ctx.arc(this.egg.pos.x, this.egg.pos.y, range, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    if (this.egg.invincible > 0 && !this.isCharging) {
      const invPct = this.egg.invincible / 120;
      const invColor = invPct > 0.5 ? '#81c784' : invPct > 0.25 ? '#ffd54f' : '#ef5350';
      const invAlpha = 0.3 + invPct * 0.4;
      ctx.save();
      ctx.strokeStyle = invColor;
      ctx.lineWidth = 2.5;
      ctx.globalAlpha = invAlpha;
      ctx.beginPath();
      ctx.arc(this.egg.pos.x, this.egg.pos.y, this.egg.r * 1.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * invPct);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
    }
    // Victory overlay during animation
    if (this.state === 'victory') {
      ctx.fillStyle = `rgba(255,215,0,${Math.min(0.15, (600 - this.victoryTimer) / 600 * 0.15)})`;
      ctx.fillRect(0, 0, CW, CH);
    }
    // Bottom operation tips (during playing or victory)
    if (this.state === 'playing' && !this.showTutorial) {
      this.drawBottomTips();
    }
    this.drawTransitionOverlay();
    // Tutorial overlay (on top of everything including transition)
    if (this.showTutorial) {
      this.drawTutorial();
    }
    // Joystick
    if (this.state === 'playing' && !this.showTutorial && this.joystickEnabled) {
      this.drawJoystick();
    }
    // Debug overlay
    if (DEBUG && this.debugInfo.showDebug && (this.state === 'playing' || this.state === 'victory')) {
      const lines = [
        `FPS: ${this.debugInfo.fps} | dt: ${this.debugInfo.dt.toFixed(3)}`,
        `蛋: (${this.egg.pos.x.toFixed(1)}, ${this.egg.pos.y.toFixed(1)}) v: ${this.egg.vel.len().toFixed(1)}`,
        `目标: (${this.egg.target ? this.egg.target.x.toFixed(1) + ', ' + this.egg.target.y.toFixed(1) : 'null'})`,
        `番茄: ${this.tomatoes.length} | 粒子: ${this.particles.length}`,
        `状态: ${this.state} | 跳跃: ${this.isJumping} | 蓄力: ${this.chargeActive}`,
        `鼠标: (${this.mouseX.toFixed(1)}, ${this.mouseY.toFixed(1)})`,
        `波次: ${this.wave} | 生存: ${this.survivalTime.toFixed(1)}s`,
        `错误: ${this.debugInfo.errors.length}`,
        `音效: ${SFX._ctx ? SFX._ctx.state : '无'}`,
        this.gravityField ? `🌀引力 ${this.gravityField.timer.toFixed(0)}f @(${this.gravityField.x.toFixed(0)},${this.gravityField.y.toFixed(0)})` : '',
        `buff: ⚡${this.chainLightningStored} 🛡${this.shieldTimer > 0 ? Math.ceil(this.shieldTimer/60)+'s' : this.storedShield} 🔥${this.fireShellTimer > 0 ? Math.ceil(this.fireShellTimer/60)+'s' : 0}`,
      ].filter(Boolean);
      ctx.save();
      ctx.font = '12px monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      const pad = 6;
      const lh = 16;
      const maxW = Math.max(...lines.map(l => ctx.measureText(l).width));
      const bw = maxW + pad * 2;
      const bh = lines.length * lh + pad * 2;
      const dx = 4;
      const dy = CH - bh - 4;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.beginPath();
      ctx.roundRect(dx, dy, bw, bh, 6);
      ctx.fill();
      ctx.fillStyle = '#0f0';
      lines.forEach((l, i) => ctx.fillText(l, dx + pad, dy + pad + i * lh));
      ctx.restore();
    }
  }

  drawTransitionOverlay() {
    if (this.transitionState === 'none') return;
    const alpha = this.transitionState === 'fadeOut'
      ? (15 - this.transitionTimer) / 15
      : this.transitionTimer / 15;
    ctx.fillStyle = `rgba(0,0,0,${alpha * 0.5})`;
    ctx.fillRect(0, 0, CW, CH);
  }

  drawMenu() {
    ctx.fillStyle = '#f0faf0';
    ctx.fillRect(0, 0, CW, CH);
    const V = Math.max(SIZE, CH * .7);
    const skinLabel = { 普通蛋: '普通蛋', 茶叶蛋: '茶叶蛋', 煎荷包蛋: '煎荷包蛋', 溏心蛋: '溏心蛋' };
    const skinOrder = ['普通蛋', '茶叶蛋', '煎荷包蛋', '溏心蛋'];
    const idx = skinOrder.indexOf(this.currentSkin);
    const nextIdx = Math.min(idx + 1, skinOrder.length - 1);
    const nextSkin = skinOrder[nextIdx];
    const costs = { 普通蛋: 0, 茶叶蛋: 100, 煎荷包蛋: 500, 溏心蛋: 1000 };
    const curCost = costs[this.currentSkin];
    const nextCost = costs[nextSkin];
    const baseHpMap = { 普通蛋: 3, 茶叶蛋: 3, 煎荷包蛋: 4, 溏心蛋: 5 };
    ctx.textAlign = 'center';

    // Title
    ctx.fillStyle = '#4a7c59';
    ctx.font = `bold ${SIZE * .09}px Arial`;
    ctx.fillText('🥚 蛋蛋快跑', CX, CY - V * .31);

    // Subtitle (split into shorter lines for mobile)
    ctx.font = `${SIZE * .035}px Arial`;
    ctx.fillStyle = '#8aa899';
    ctx.fillText('🍅 番茄大军杀到！拖拽走位·松手爆蛋·双击冲刺·蓄力跳跃', CX, CY - V * .24);
    ctx.fillText('✨ 花式秀翻全场！回血·护盾·闪电链·引力漩涡', CX, CY - V * .195);
    ctx.fillText('✨ 道具吃满变战神！生存/无尽双模式，越苟越快乐！', CX, CY - V * .15);

    // Top-left toggle buttons: sound + debug
    const toggleSize = SIZE * .07;
    const togglePad = SIZE * .02;
    const toggleY = togglePad;
    const soundX = togglePad;
    const debugX = soundX + toggleSize + togglePad * .5;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // Sound toggle
    ctx.fillStyle = SFX.muted ? '#e0e0e0' : '#81c784';
    ctx.beginPath();
    ctx.roundRect(soundX, toggleY, toggleSize, toggleSize, 6);
    ctx.fill();
    ctx.fillStyle = SFX.muted ? '#999' : '#fff';
    ctx.font = `${SIZE * .035}px Arial`;
    ctx.fillText(SFX.muted ? '🔇' : '🔊', soundX + toggleSize / 2, toggleY + toggleSize / 2);
    // Debug toggle
    ctx.fillStyle = this.debugInfo.showDebug ? '#81c784' : '#e0e0e0';    ctx.beginPath();
    ctx.roundRect(debugX, toggleY, toggleSize, toggleSize, 6);
    ctx.fill();
    ctx.fillStyle = this.debugInfo.showDebug ? '#fff' : '#999';
    ctx.font = `${SIZE * .03}px Arial`;
    ctx.fillText('🕵️', debugX + toggleSize / 2, toggleY + toggleSize / 2);
    // Joystick toggle
    const joyX = debugX + toggleSize + togglePad * .5;
    ctx.fillStyle = this.joystickEnabled ? '#81c784' : '#e0e0e0';
    ctx.beginPath();
    ctx.roundRect(joyX, toggleY, toggleSize, toggleSize, 6);
    ctx.fill();
    ctx.fillStyle = this.joystickEnabled ? '#fff' : '#999';
    ctx.font = `${SIZE * .03}px Arial`;
    ctx.fillText('🎮', joyX + toggleSize / 2, toggleY + toggleSize / 2);
    // Recording toggle
    const recX = joyX + toggleSize + togglePad * .5;
    ctx.fillStyle = this.highlightRecording ? '#81c784' : '#e0e0e0';
    ctx.beginPath();
    ctx.roundRect(recX, toggleY, toggleSize, toggleSize, 6);
    ctx.fill();
    ctx.fillStyle = this.highlightRecording ? '#fff' : '#999';
    ctx.font = `${SIZE * .025}px Arial`;
    ctx.fillText('📹', recX + toggleSize / 2, toggleY + toggleSize / 2);
    ctx.textBaseline = 'alphabetic';

    // Egg skin preview
    this.drawSkinPreview(CX, CY - V * .08, SIZE * .055, this.currentSkin);

    // Skin name + HP
    const showMaxHp = this.getMaxHp();
    ctx.fillStyle = '#5a8a69';
    ctx.font = `bold ${SIZE * .042}px Arial`;
    ctx.fillText(`🏆 ${skinLabel[this.currentSkin] || '普通蛋'}  ❤${showMaxHp}`, CX, CY + V * .07);

    // Skin progress removed (no积分系统)

    // Mode selector buttons
    const modeBtnW = SIZE * .16, modeBtnH = SIZE * .055;
    const modeBtnY = CY + V * .17, modeGap = SIZE * .02;
    const chalX = CX - modeBtnW - modeGap / 2;
    const endX = CX + modeGap / 2;

    // Challenge button (left)
    ctx.fillStyle = this.gameMode === 'challenge' ? '#66bb6a' : '#c8e6c9';
    ctx.beginPath();
    ctx.roundRect(chalX, modeBtnY, modeBtnW, modeBtnH, 6);
    ctx.fill();
    ctx.fillStyle = this.gameMode === 'challenge' ? '#fff' : '#7a9a79';
    ctx.font = `bold ${SIZE * .028}px Arial`;
    ctx.fillText('生存挑战', chalX + modeBtnW / 2, modeBtnY + modeBtnH * .68);

    // Endless button (right)
    ctx.fillStyle = this.gameMode === 'endless' ? '#ef5350' : '#c8e6c9';
    ctx.beginPath();
    ctx.roundRect(endX, modeBtnY, modeBtnW, modeBtnH, 6);
    ctx.fill();
    ctx.fillStyle = this.gameMode === 'endless' ? '#fff' : '#7a9a79';
    ctx.font = `bold ${SIZE * .028}px Arial`;
    ctx.fillText('无尽生存', endX + modeBtnW / 2, modeBtnY + modeBtnH * .68);

    // Start button
    const startBtnY = CY + V * .24;
    const startBtnH = SIZE * .07;
    ctx.fillStyle = '#81c784';
    ctx.beginPath();
    ctx.roundRect(CX - SIZE * .18, startBtnY, SIZE * .36, startBtnH, 8);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${SIZE * .04}px Arial`;
    ctx.fillText('开始游戏', CX, startBtnY + startBtnH * .68);

    // Reset data
    const resetY = startBtnY + startBtnH + SIZE * .06;
    ctx.fillStyle = '#999';
    ctx.font = `${SIZE * .024}px Arial`;
    ctx.fillText('重置数据', CX, resetY);

  }

  drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    ctx.fillRect(0, 0, CW, CH);
    const V = Math.max(SIZE, CH * .7);
    const secs = Math.floor(this.survivalTime);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ef5350';
    ctx.font = `bold ${SIZE * .09}px Arial`;
    ctx.fillText('💀 盘子被番茄占领', CX, CY - V * .30);
    ctx.fillStyle = '#bdbdbd';
    ctx.font = `${SIZE * .028}px Arial`;
    ctx.fillText(getSurvivalTag(secs), CX, CY - V * .24);
    ctx.fillStyle = '#fff';
    ctx.font = `${SIZE * .05}px Arial`;
    ctx.fillText(`存活 ${secs} 秒`, CX, CY - V * .17);
    ctx.fillText(`💰 ${this.gold} 金币`, CX, CY - V * .10);
    ctx.fillStyle = '#bdbdbd';
    ctx.font = `${SIZE * .028}px Arial`;
    const modeLabel = this.gameMode === 'challenge' ? '生存挑战' : '无尽生存';
    ctx.fillText(`模式: ${modeLabel}`, CX, CY - V * .03);
    const isNewBest = secs >= this.bestTime;
    if (isNewBest && secs > 0) {
      ctx.fillStyle = '#ffd700';
      ctx.font = `bold ${SIZE * .04}px Arial`;
      ctx.fillText('🎉 新纪录！', CX, CY + V * .04);
      this.bestTime = secs;
      this.saveProgress();
    } else if (this.bestTime > 0) {
      ctx.fillStyle = '#bdbdbd';
      ctx.font = `${SIZE * .035}px Arial`;
      ctx.fillText(`最高纪录: ${Math.floor(this.bestTime)} 秒 (差 ${Math.floor(this.bestTime - secs)} 秒)`, CX, CY + V * .04);
    }
    const retryBtnY = CY + V * .10;
    const retryBtnH = SIZE * .08;
    ctx.fillStyle = '#81c784';
    ctx.beginPath();
    ctx.roundRect(CX - SIZE * .2, retryBtnY, SIZE * .4, retryBtnH, 10);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${SIZE * .05}px Arial`;
    ctx.textBaseline = 'middle';
    ctx.fillText('再来一次', CX, retryBtnY + retryBtnH / 2);
    const shareBtnY = CY + V * .23;
    const shareBtnH = SIZE * .07;
    ctx.fillStyle = '#a5d6a7';
    ctx.beginPath();
    ctx.roundRect(CX - SIZE * .2, shareBtnY, SIZE * .4, shareBtnH, 10);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${SIZE * .035}px Arial`;
    ctx.textBaseline = 'middle';
    ctx.fillText('📸 生成战绩', CX, shareBtnY + shareBtnH / 2);
    // Gallery button
    const galBtnH = SIZE * .055;
    const galBtnW = SIZE * .28;
    const galBtnY = CY + V * .35;
    ctx.fillStyle = '#4fc3f7';
    ctx.beginPath();
    ctx.roundRect(CX - galBtnW / 2, galBtnY - galBtnH * .65, galBtnW, galBtnH, 8);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${SIZE * .026}px Arial`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.fillText(`📹 精彩回放 (${HLRecorder.clips.length})`, CX, galBtnY - galBtnH * .15);
    // Download debug data
    const dbgY = galBtnY + SIZE * .05;
    ctx.fillStyle = '#546e7a';
    ctx.font = `${SIZE * .024}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText('📥 导出调试数据', CX, dbgY);
  }

  drawVictoryScreen() {
    const secs = Math.floor(this.survivalTime);
    // Warm gradient background
    const bgGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(CW, CH) * .7);
    bgGrad.addColorStop(0, '#fff8e1');
    bgGrad.addColorStop(.5, '#fff3cd');
    bgGrad.addColorStop(1, '#ffe0b2');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, CW, CH);
    // Confetti (if new best)
    const isNewBest = secs >= this.bestTime;
    if (isNewBest && secs > 0) {
      const ct = performance.now() / 800;
      for (let i = 0; i < 50; i++) {
        const phase = i * 2.3;
        const cx = ((Math.sin(ct * 0.7 + phase) * 0.6 + 0.5) * 0.9 + 0.05) * CW;
        const cy = ((ct * 0.3 + phase * 0.1) % 1) * CH;
        const colors = ['#ff1744', '#ffea00', '#00e5ff', '#76ff03', '#d500f9', '#ff9100'];
        ctx.fillStyle = colors[i % colors.length];
        ctx.globalAlpha = 0.7 + Math.sin(ct + i) * 0.2;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(ct + i * 0.5);
        ctx.fillRect(-6, -3, 12, 6);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
    // Decorative stars
    ctx.save();
    for (let i = 0; i < 25; i++) {
      const sx = Math.random() * CW, sy = Math.random() * CH;
      const sr = 1.5 + Math.random() * 3;
      ctx.fillStyle = `rgba(255,215,0,${0.08 + Math.random() * 0.12})`;
      ctx.beginPath();
      for (let j = 0; j < 4; j++) {
        const a = Math.PI / 4 + j * Math.PI / 2;
        if (j === 0) ctx.moveTo(sx + Math.cos(a) * sr * 2, sy + Math.sin(a) * sr * 2);
        else ctx.lineTo(sx + Math.cos(a) * sr * 2, sy + Math.sin(a) * sr * 2);
        const a2 = a + Math.PI / 4;
        ctx.lineTo(sx + Math.cos(a2) * sr, sy + Math.sin(a2) * sr);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    // Main card (adapts to screen height)
    const cardH = CH * .72;
    const cardW = Math.min(CW * .85, cardH * .58);
    const cardX = CX - cardW / 2, cardY = CY - cardH / 2;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.1)';
    ctx.shadowBlur = 24;
    ctx.shadowOffsetY = 6;
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.beginPath();
    ctx.roundRect(cardX, cardY, cardW, cardH, 24);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    // Inner golden border
    ctx.strokeStyle = 'rgba(255,215,0,.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(cardX + 6, cardY + 6, cardW - 12, cardH - 12, 20);
    ctx.stroke();
    ctx.restore();
    // === Header banner ===
    const bannerH = cardH * .075;
    ctx.save();
    ctx.shadowColor = 'rgba(255,160,0,.3)';
    ctx.shadowBlur = 10;
    const bGrad = ctx.createLinearGradient(CX - cardW * .35, 0, CX + cardW * .35, 0);
    bGrad.addColorStop(0, '#ffb300');
    bGrad.addColorStop(.5, '#ffd700');
    bGrad.addColorStop(1, '#ffb300');
    ctx.fillStyle = bGrad;
    ctx.beginPath();
    ctx.roundRect(CX - cardW * .35, cardY + cardH * .045, cardW * .7, bannerH, 10);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${bannerH * .52}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🏆 挑战成功！', CX, cardY + cardH * .045 + bannerH / 2);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
    // Subtitle
    ctx.textAlign = 'center';
    ctx.fillStyle = '#999';
    ctx.font = `${cardH * .032}px Arial`;
    ctx.fillText('蛋蛋援军赶到，番茄大军全军覆没！', CX, cardY + cardH * .17);
    // === Character decorations ===
    const charR = cardH * .042;
    const charY = cardY + cardH * .26;
    this.drawSkinPreview(CX - cardW * .36, charY, charR, this.currentSkin);
    // Happy smile overlay on egg
    const eggX = CX - cardW * .36;
    ctx.save();
    ctx.strokeStyle = '#e07040';
    ctx.lineWidth = charR * .08;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(eggX, charY + charR * .18, charR * .12, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
    ctx.restore();
    this.drawCuteTomato(CX + cardW * .36, charY, charR);
    // === Crown on egg ===
    const crownX = CX - cardW * .36;
    const crownY = charY - charR * 1.2;
    ctx.save();
    ctx.fillStyle = '#ffd700';
    ctx.strokeStyle = '#ff8f00';
    ctx.lineWidth = 2;
    const cs = charR * .25;
    ctx.beginPath();
    ctx.moveTo(crownX - cs * 1.2, crownY + cs * 0.5);
    ctx.lineTo(crownX - cs * 0.9, crownY - cs * 0.7);
    ctx.lineTo(crownX - cs * 0.4, crownY - cs * 0.1);
    ctx.lineTo(crownX, crownY - cs * 0.9);
    ctx.lineTo(crownX + cs * 0.4, crownY - cs * 0.1);
    ctx.lineTo(crownX + cs * 0.9, crownY - cs * 0.7);
    ctx.lineTo(crownX + cs * 1.2, crownY + cs * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // crown jewels
    ctx.fillStyle = '#ff1744';
    for (let jx of [crownX - cs * 0.9, crownX, crownX + cs * 0.9]) {
      ctx.beginPath();
      ctx.arc(jx, crownY - cs * 0.3, cs * 0.15, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    // === Sparkles around characters ===
    const sparkleColors = ['#ffd700', '#fff176', '#ffab00', '#ff6f00'];
    for (let side = -1; side <= 1; side += 2) {
      const cx2 = CX + side * cardW * .36;
      for (let i = 0; i < 4; i++) {
        const angle = Math.PI * 2 * i / 4 + performance.now() / 3000;
        const dist = charR * 1.7 + Math.sin(performance.now() / 500 + i * 2) * charR * 0.2;
        const sx = cx2 + Math.cos(angle) * dist;
        const sy = charY + Math.sin(angle) * dist * 0.6;
        const sr = charR * (0.08 + Math.sin(performance.now() / 400 + i * 1.5) * 0.04);
        ctx.fillStyle = sparkleColors[i % sparkleColors.length];
        ctx.globalAlpha = 0.5 + Math.sin(performance.now() / 600 + i * 1.7) * 0.3;
        ctx.beginPath();
        for (let j = 0; j < 4; j++) {
          const a = Math.PI / 4 + j * Math.PI / 2;
          if (j === 0) ctx.moveTo(sx + Math.cos(a) * sr * 2, sy + Math.sin(a) * sr * 2);
          else ctx.lineTo(sx + Math.cos(a) * sr * 2, sy + Math.sin(a) * sr * 2);
          const a2 = a + Math.PI / 4;
          ctx.lineTo(sx + Math.cos(a2) * sr, sy + Math.sin(a2) * sr);
        }
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    // === Skin name label ===
    ctx.fillStyle = '#8a6e4b';
    ctx.font = `bold ${cardH * .026}px Arial`;
    ctx.textAlign = 'center';
    const skinLabel = { 普通蛋: '普通蛋', 茶叶蛋: '茶叶蛋', 煎荷包蛋: '煎荷包蛋', 溏心蛋: '溏心蛋' };
    ctx.fillText(`🥚 ${skinLabel[this.currentSkin] || '普通蛋'}`, CX, cardY + cardH * .32);
    // === Time display ===
    ctx.save();
    ctx.shadowColor = 'rgba(239,83,80,.2)';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#ef5350';
    ctx.font = `bold ${cardH * .08}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(`⏱ ${secs}`, CX, cardY + cardH * .41);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#999';
    ctx.font = `${cardH * .028}px Arial`;
    ctx.fillText('存活秒数', CX, cardY + cardH * .47);
    ctx.restore();
    // === Stats row ===
    const stCardW = cardW * .27, stCardH = cardH * .085;
    const stGap = cardW * .055;
    const stTotalW = stCardW * 3 + stGap * 2;
    const stX = CX - stTotalW / 2;
    const stY = cardY + cardH * .53;
    const stats = [
      { icon: '🎯', label: '目标', value: `${this.challengeGoal || '-'}秒`, color: '#66bb6a', bg: 'rgba(102,187,106,.12)' },
      { icon: '💀', label: '击杀', value: `${this.sessionKills}`, color: '#ef5350', bg: 'rgba(229,57,53,.08)' },
      { icon: '💰', label: '金币', value: `${this.gold}`, color: '#f0a500', bg: 'rgba(255,213,79,.15)' },
    ];
    for (let i = 0; i < 3; i++) {
      const sx = stX + i * (stCardW + stGap);
      ctx.fillStyle = stats[i].bg;
      ctx.beginPath();
      ctx.roundRect(sx, stY, stCardW, stCardH, 10);
      ctx.fill();
      ctx.strokeStyle = stats[i].color + '30';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(sx, stY, stCardW, stCardH, 10);
      ctx.stroke();
      ctx.fillStyle = stats[i].color;
      ctx.font = `bold ${stCardH * .38}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText(stats[i].value, sx + stCardW / 2, stY + stCardH * .45);
      ctx.fillStyle = '#aaa';
      ctx.font = `${stCardH * .24}px Arial`;
      ctx.fillText(`${stats[i].icon} ${stats[i].label}`, sx + stCardW / 2, stY + stCardH * .74);
    }
    // === Extra stats line ===
    ctx.textAlign = 'center';
    ctx.fillStyle = '#bbb';
    ctx.font = `${cardH * .024}px Arial`;
    const comboText = this.maxCombo > 1 ? `  🔥 最高连击 ${this.maxCombo}` : '';
    const tag = getSurvivalTag(secs);
    ctx.fillText(`${tag}${comboText}`, CX, cardY + cardH * .65);
    // === Record ribbon ===
    if (isNewBest && secs > 0) {
      ctx.save();
      const rbGrad = ctx.createLinearGradient(CX - cardW * .22, 0, CX + cardW * .22, 0);
      rbGrad.addColorStop(0, '#ff8f00');
      rbGrad.addColorStop(.5, '#ffd700');
      rbGrad.addColorStop(1, '#ff8f00');
      ctx.shadowColor = 'rgba(255,215,0,.3)';
      ctx.shadowBlur = 8;
      ctx.fillStyle = rbGrad;
      ctx.beginPath();
      ctx.roundRect(CX - cardW * .22, cardY + cardH * .74, cardW * .44, cardH * .058, 8);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${cardH * .03}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🌟 新纪录！', CX, cardY + cardH * .74 + cardH * .029);
      ctx.textBaseline = 'alphabetic';
      ctx.restore();
      this.bestTime = secs;
      this.saveProgress();
    } else if (this.bestTime > 0) {
      ctx.fillStyle = '#999';
      ctx.font = `${cardH * .028}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText(`🏅 最高纪录: ${Math.floor(this.bestTime)} 秒`, CX, cardY + cardH * .76);
    }
    // === Buttons ===
    const btnW = cardW * .38, btnGap = cardW * .04;
    const btnY = cardY + cardH * .83;
    this.drawButton('再来一局', CX - btnW - btnGap / 2, btnY, btnW, cardH * .078,
      { bg: '#81c784', hoverBg: '#a5d6a7', fontSize: cardH * .04 });
    this.drawButton('📸 生成战绩', CX + btnGap / 2, btnY, btnW, cardH * .078,
      { bg: '#ffd54f', hoverBg: '#ffe082', fontSize: cardH * .032 });
    // Gallery button
    const galBtnH2 = cardH * .04;
    const galBtnW2 = cardW * .32;
    const galOutY = cardY + cardH + SIZE * .08;
    ctx.fillStyle = '#4fc3f7';
    ctx.beginPath();
    ctx.roundRect(CX - galBtnW2 / 2, galOutY - galBtnH2 * .65, galBtnW2, galBtnH2, 8);
    ctx.fill();
    ctx.fillStyle = '#fff';
